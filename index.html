e che ~50% di ogni prelievo sia rendimento tassato.\n    const needY = Math.max(0, (midVal('speseTarget') - midVal('altreEntrateFuture')) * 12);\n    const taxFactor = 1 + effTaxRate() * 0.5;\n    return { value: Math.round(needY * 25 * taxFactor),\n      label:'capitale per l’indipendenza: 25× il fabbisogno annuo non coperto da altre entrate (regola del 4%), maggiorato per la fiscalità stimata sul decumulo' };\n  }\n  if (deepMode() && !isFI() && isAnswered(Q('capitaleObiettivo')))\n    return { value: midVal('capitaleObiettivo'), label:'capitale obiettivo che hai dichiarato' };\n  // default prudenti e dichiarati per il percorso essenziale\n  const D = {\n    emergenza: { v: cf.expensesM * 6, l:'6 mesi di spese (fondo di emergenza pieno)' },\n    casa: { v: 60000, l:'anticipo tipico per un acquisto immobiliare (ipotesi standard 60.000 €)' },\n    figli: { v: 50000, l:'budget educativo indicativo per figlio (ipotesi standard 50.000 €)' },\n    protezione: { v: cf.expensesY, l:'12 mesi di spese come cuscinetto di protezione' },\n    crescita: { v: Math.max(50000, investable * 2), l:'raddoppio del capitale investibile attuale (ipotesi)' },\n    pensione: { v: Math.max(100000, cf.expensesY * 10), l:'10 anni di spese attuali (ipotesi semplificata)' },\n    rendita: { v: Math.max(250000, cf.expensesY * 25), l:'25 volte le spese annue attuali (regola del 4%)' }\n  };\n  const d = D[A.obiettivo] || D.crescita;\n  return { value: Math.round(d.v), label: d.l };\n}\n\n// ---- Analisi di coppia (solo se l'utente sceglie di includere il partner) ----\nfunction analyzeCouple(cf){\n  if (!coupleMode()) return null;\n  const share = (optOf('quotaReddito', A.quotaReddito) || { share:0.5 }).share;\n  const mine = Math.round(cf.income * share);\n  const theirs = cf.income - mine;\n  const resp = (A.responsabilitaPartner || []).filter(v => v !== 'nessuna');\n  const heavy = resp.some(v => ['snc','sas','sindaco'].includes(v));\n  const concentration = share >= 0.7 || share <= 0.3;   // reddito concentrato su una sola persona\n  const keyPerson = share >= 0.5 ? 'tu' : 'il tuo partner';\n  const respLabels = resp.map(v => (optOf('responsabilitaPartner', v) || { l:v }).l);\n  return { share, mine, theirs, resp, respLabels, heavy, concentration, keyPerson };\n}\n\n// ---- Cash flow ----\nfunction calculateCashFlow(){\n  const income = midVal('reddito');                       // annuo netto\n  const expensesM = midVal('spesaMensile');\n  const savingsM = midVal('risparmioMensile');\n  const expensesY = expensesM * 12, savingsY = savingsM * 12;\n  const savingsRate = income > 0 ? savingsY / income : 0;\n  // controllo coerenza: reddito - spese dovrebbe ≈ risparmio\n  const implicitSavings = income - expensesY;\n  const incoherent = Math.abs(implicitSavings - savingsY) > Math.max(6000, income * 0.25);\n  return { income, expensesM, expensesY, savingsM, savingsY, savingsRate, implicitSavings, incoherent };\n}\n\n// ---- Sostenibilità del debito ----\nfunction calculateDebtSustainability(nw, cf){\n  const rateM = midVal('rataMensile');\n  const rateY = rateM * 12;\n  const rateOnIncome = cf.income > 0 ? rateY / cf.income : 0;      // incidenza rate/reddito\n  const debtToIncome = cf.income > 0 ? nw.totalDebt / cf.income : 0;\n  const hasRevolving = (A.tipiDebiti || []).includes('revolving');\n  const yearsLeft = midVal('durataImpegni');\n  return { rateM, rateY, rateOnIncome, debtToIncome, hasRevolving, yearsLeft };\n}\n\n// ---- Fondo di emergenza ----\nfunction calculateEmergencyFund(nw, cf){\n  const months = cf.expensesM > 0 ? nw.liq / cf.expensesM : 0;   // mesi coperti dalla liquidità\n  const dedicated = A.fondoEmergenza;                             // percezione dichiarata\n  const target = 6 * cf.expensesM;                                // obiettivo prudente: 6 mesi\n  const gap = Math.max(0, target - nw.liq);\n  return { months, dedicated, target, gap };\n}\n\n// ---- Capitale investibile: investimenti + liquidità oltre 6 mesi di spese ----\nfunction calculateInvestable(nw, cf){\n  const buffer = 6 * cf.expensesM;\n  return nw.inv + Math.max(0, nw.liq - buffer);\n}\n\n// ---- Profilo di rischio ----\n// Usa i fattori disponibili nel percorso scelto (il percorso essenziale ne\n// chiede meno) mediandoli su scala comune, così i due percorsi sono comparabili.\nfunction determineRiskProfile(){\n  const hIdx = ['breve','medio','lungo','moltolungo'].indexOf(A.orizzonte); // 0..3\n  // priorità dichiarata (percorso completo) o derivata dall'obiettivo (essenziale)\n  const prio = A.priorita || ({ crescita:'crescita', rendita:'crescita', pensione:'equilibrio',\n    casa:'equilibrio', figli:'equilibrio', emergenza:'protezione', protezione:'protezione' }[A.obiettivo] || 'equilibrio');\n  const prioScore = { protezione:0, equilibrio:1.5, crescita:3 }[prio];\n\n  const factors = [];                       // ciascun fattore vale 0..3\n  if (A.conoscenza) factors.push(scoreVal('conoscenza'));\n  if (A.esperienza) factors.push(scoreVal('esperienza'));\n  if (A.reazione) factors.push(scoreVal('reazione'));\n  if (A.perditaMax) factors.push(scoreVal('perditaMax'));\n  factors.push(prioScore);\n  factors.push(Math.max(0, hIdx));\n  let score = (factors.reduce((s, x) => s + x, 0) / factors.length) * 6; // scala 0..18\n  const age = midVal('eta');\n  if (age >= 65) score -= 2; else if (age >= 55) score -= 1;\n\n  let profile = score <= 6 ? 'conservativo' : (score <= 11 ? 'bilanciato' : 'dinamico');\n\n  // vincoli prudenziali e incoerenze\n  const warnings = [];\n  const maxdd = (optOf('perditaMax', A.perditaMax) || {}).maxdd || 5;\n  if (A.orizzonte === 'breve' && profile !== 'conservativo'){\n    warnings.push('Orizzonte inferiore a 5 anni: il profilo è stato limitato a Conservativo per prudenza.');\n    profile = 'conservativo';\n  }\n  if (maxdd <= 5 && profile !== 'conservativo'){\n    warnings.push('Hai indicato una tolleranza massima alle perdite di circa il 5%: il profilo è stato limitato a Conservativo.');\n    profile = 'conservativo';\n  } else if (maxdd <= 10 && profile === 'dinamico'){\n    warnings.push('Tolleranza alle perdite intorno al 10%: il profilo Dinamico non è coerente ed è stato ridotto a Bilanciato.');\n    profile = 'bilanciato';\n  }\n  if (prio === 'crescita' && maxdd <= 10)\n    warnings.push('Incoerenza: l’obiettivo punta alla crescita ma tolleri perdite contenute. Meglio chiarire questo punto con un consulente.');\n  if (A.reazione === 'vendo_tutto' && prio !== 'protezione')\n    warnings.push('Attenzione comportamentale: vendere tutto durante un calo è il modo più comune di trasformare una perdita temporanea in una definitiva.');\n  if (A.conoscenza && scoreVal('conoscenza') === 0 && scoreVal('esperienza') === 3)\n    warnings.push('Esperienza su strumenti complessi con conoscenza di base: possibile eccesso di fiducia (overconfidence).');\n\n  return { score, profile, warnings, maxdd, age, hIdx, prio };\n}\n\n// ---- Allocazioni indicative (3 proposte) ----\nfunction generateAllocationProfiles(risk, ef){\n  // base prudente per ciascun profilo: [liquidità, obbligazioni, azioni globali, oro/real asset, previdenza]\n  const base = {\n    conservativo: {liq:15, bond:55, eq:20, gold:5, pens:5},\n    bilanciato:   {liq:10, bond:40, eq:35, gold:8, pens:7},\n    dinamico:     {liq:5,  bond:25, eq:55, gold:8, pens:7}\n  };\n  const age = midVal('eta');\n  const out = {};\n  ['conservativo','bilanciato','dinamico'].forEach(p => {\n    const a = Object.assign({}, base[p]);\n    // aggiustamenti prudenti\n    if (age >= 60){ const shift = Math.min(10, a.eq); a.eq -= shift; a.bond += shift; }          // età alta → meno azioni\n    if (A.orizzonte === 'moltolungo' && p !== 'conservativo'){ a.eq += 5; a.bond -= 5; }          // orizzonte lungo → più azioni\n    if (ef.months < 3){ const shift = Math.min(10, a.eq); a.liq += shift; a.eq -= shift; }        // poca liquidità → priorità riserva\n    out[p] = a;\n  });\n  return out;\n}\n\n// ---- Gap assicurativi ----\nfunction calculateInsuranceGaps(nw, cf, debt){\n  const cov = A.coperture || [];\n  const has = c => cov.includes(c);\n  const deps = midVal('dipendenti');\n  const hasPartnerNoIncome = coupleMode() && A.quotaReddito === 'solo_io';\n  const hasFamily = deps > 0 || hasPartner();\n  const worksForIncome = !['pensione','rendite'].includes(A.fonteReddito);\n  const age = midVal('eta');\n  const gaps = []; // {area, level:'r'|'y'|'g', why}\n\n  // TCM: essenziale se qualcuno dipende dal tuo reddito\n  if ((deps > 0 || hasPartnerNoIncome) && !has('tcm'))\n    gaps.push({area:'Vita caso morte (TCM)', level:'r', why:'Ci sono persone che dipendono dal tuo reddito ma manca una copertura in caso di decesso. Capitale indicativo di riferimento: 5–10 volte il reddito annuo (' + fmtEUR(cf.income*5) + '–' + fmtEUR(cf.income*10) + ').'});\n  else if (deps > 0 && has('tcm'))\n    gaps.push({area:'Vita caso morte (TCM)', level:'g', why:'Copertura presente. Verifica che il capitale sia adeguato a reddito e debiti residui.'});\n\n  // Invalidità: protegge la capacità di produrre reddito\n  if (worksForIncome && !has('invalidita'))\n    gaps.push({area:'Invalidità permanente', level: deps > 0 ? 'r' : 'y', why:'Il reddito da lavoro è il tuo principale \"asset\": un’invalidità grave lo interromperebbe. È spesso il rischio più sottovalutato.'});\n  else if (worksForIncome)\n    gaps.push({area:'Invalidità permanente', level:'g', why:'Copertura presente.'});\n\n  // Infortuni\n  if (worksForIncome && !has('infortuni') && !has('invalidita'))\n    gaps.push({area:'Infortuni', level:'y', why:'Nessuna protezione per infortuni con conseguenze economiche.'});\n\n  // Sanitaria\n  gaps.push(has('sanitaria')\n    ? {area:'Sanitaria', level:'g', why:'Copertura presente.'}\n    : {area:'Sanitaria', level:'y', why:'Grandi interventi o cure lunghe possono pesare sul patrimonio. Da valutare in base a regione e esigenze familiari.'});\n\n  // LTC (rilevante crescendo con l'età)\n  if (age >= 50)\n    gaps.push(has('ltc')\n      ? {area:'LTC / non autosufficienza', level:'g', why:'Copertura presente.'}\n      : {area:'LTC / non autosufficienza', level:'y', why:'Dopo i 50 anni conviene valutare il rischio di non autosufficienza: i costi assistenziali possono erodere il patrimonio.'});\n\n  // RC famiglia: costo basso, rischio potenzialmente enorme\n  if (hasFamily && !has('rc'))\n    gaps.push({area:'RC famiglia', level:'y', why:'Un danno causato a terzi (anche dai figli) può generare richieste molto elevate. Copertura di norma poco costosa.'});\n  else if (has('rc'))\n    gaps.push({area:'RC famiglia', level:'g', why:'Copertura presente.'});\n\n  // Abitazione\n  if (nw.imm > 0)\n    gaps.push(has('abitazione')\n      ? {area:'Abitazione', level:'g', why:'Copertura presente.'}\n      : {area:'Abitazione', level:'y', why:'Possiedi immobili senza copertura per incendio/danni: un evento grave colpirebbe l’asset più grande.'});\n\n  // Protezione mutuo\n  if (nw.mutuo > 0 && !has('mutuoprot') && !has('tcm'))\n    gaps.push({area:'Protezione mutuo', level:'y', why:'Mutuo in corso senza TCM né polizza dedicata: in caso di evento grave il debito resterebbe alla famiglia.'});\n\n  // Tutela legale\n  if (!has('tutela'))\n    gaps.push({area:'Tutela legale', level:'y', why:'Copertura accessoria da valutare: aiuta a sostenere spese legali impreviste.'});\n\n  // Responsabilità personale qualificata (utente)\n  const resp = (A.responsabilita || []).filter(v => v !== 'nessuna');\n  if (resp.length){\n    const heavy = resp.some(v => ['snc','sas','sindaco'].includes(v));\n    gaps.push({area:'Responsabilità personale qualificata', level: heavy ? 'r' : 'y',\n      why:'Ricopri ruoli che espongono il patrimonio personale (' + resp.map(v => (optOf('responsabilita', v)||{l:v}).l).join(', ') +\n      '). Serve una verifica specifica delle coperture di responsabilità personale/professionale con un professionista: questa analisi non copre l’ambito aziendale.'});\n  }\n\n  // Responsabilità professionale del partner (se analisi di coppia)\n  const respP = (A.responsabilitaPartner || []).filter(v => v !== 'nessuna');\n  if (coupleMode() && respP.length){\n    const heavyP = respP.some(v => ['snc','sas','sindaco'].includes(v));\n    gaps.push({area:'Responsabilità professionale del partner', level: heavyP ? 'r' : 'y',\n      why:'Il tuo partner ricopre ruoli che possono esporre il patrimonio familiare (' + respP.map(v => (optOf('responsabilitaPartner', v)||{l:v}).l).join(', ') +\n      '). Da verificare: coperture di responsabilità professionale del partner e regime patrimoniale della coppia (comunione o separazione dei beni).'});\n  }\n\n  const red = gaps.filter(g => g.level === 'r').length;\n  const yellow = gaps.filter(g => g.level === 'y').length;\n  return { gaps, red, yellow, covCount: cov.filter(c => c !== 'nessuna').length };\n}\n\n// ---- Proiezione patrimoniale (capitalizzazione mensile) ----\nfunction runProjection(P0, monthly, years, annualReturn){\n  const rm = annualReturn / 12;\n  let v = Math.max(0, P0);\n  const points = [v];\n  const months = Math.round(years * 12);\n  for (let m = 1; m <= months; m++){\n    v = v * (1 + rm) + monthly;\n    if (m % 12 === 0) points.push(v);\n  }\n  if (months % 12 !== 0) points.push(v);\n  return { final: v, points, contributed: Math.max(0, P0) + monthly * months };\n}\n\n/* ============================================================\n   VALUTAZIONE A SEMAFORO (10 aree)\n   ============================================================ */\nfunction computeTrafficLights(M){\n  const {nw, cf, debt, ef, risk, ins} = M;\n  const L = [];\n  const add = (name, level, why) => L.push({name, level, why});\n\n  // 1. Solidità patrimoniale\n  const nwRatio = cf.income > 0 ? nw.netWorth / cf.income : 0;\n  if (nw.netWorth < 0) add('Solidità patrimoniale', 'r', 'Il patrimonio netto è negativo: i debiti superano gli attivi.');\n  else if (nwRatio < 1) add('Solidità patrimoniale', 'y', 'Patrimonio netto inferiore a un anno di reddito: la base è ancora sottile.');\n  else if (nwRatio < 3) add('Solidità patrimoniale', 'y', 'Patrimonio netto pari a ' + nwRatio.toFixed(1).replace('.',',') + ' anni di reddito: in costruzione.');\n  else add('Solidità patrimoniale', 'g', 'Patrimonio netto pari a circa ' + nwRatio.toFixed(1).replace('.',',') + ' anni di reddito.');\n\n  // 2. Liquidità / fondo emergenza\n  if (ef.months >= 6) add('Liquidità / fondo emergenza', 'g', 'La liquidità copre circa ' + Math.round(ef.months) + ' mesi di spese.');\n  else if (ef.months >= 3) add('Liquidità / fondo emergenza', 'y', 'Copertura di circa ' + Math.round(ef.months) + ' mesi: l’obiettivo prudente è 6 mesi.');\n  else add('Liquidità / fondo emergenza', 'r', 'Meno di 3 mesi di spese coperte: priorità assoluta prima di investire.');\n\n  // 3. Sostenibilità cash flow\n  if (cf.implicitSavings < 0) add('Sostenibilità cash flow', 'r', 'Le spese stimate superano il reddito: il bilancio familiare è in deficit.');\n  else if (cf.savingsRate >= 0.15) add('Sostenibilità cash flow', 'g', 'Tasso di risparmio di circa ' + fmtPct(cf.savingsRate*100, 0) + ': ottima capacità di accumulo.');\n  else if (cf.savingsRate >= 0.05) add('Sostenibilità cash flow', 'y', 'Tasso di risparmio di circa ' + fmtPct(cf.savingsRate*100, 0) + ': margine di miglioramento.');\n  else add('Sostenibilità cash flow', 'r', 'Risparmio quasi nullo: senza accantonamenti il piano non può decollare.');\n\n  // 4. Impegni finanziari / debiti\n  if (debt.rateY === 0 && nw.totalDebt === 0) add('Impegni finanziari', 'g', 'Nessun debito in corso.');\n  else if (debt.hasRevolving) add('Impegni finanziari', 'r', 'Le carte revolving hanno costi molto elevati: estinguerle è di norma la priorità numero uno.');\n  else if (debt.rateOnIncome > 0.35) add('Impegni finanziari', 'r', 'Le rate assorbono circa ' + fmtPct(debt.rateOnIncome*100, 0) + ' del reddito: livello critico (soglia di attenzione: 35%).');\n  else if (debt.rateOnIncome > 0.20) add('Impegni finanziari', 'y', 'Rate pari a circa ' + fmtPct(debt.rateOnIncome*100, 0) + ' del reddito: sostenibile ma da monitorare.');\n  else add('Impegni finanziari', 'g', 'Rate pari a circa ' + fmtPct(debt.rateOnIncome*100, 0) + ' del reddito: incidenza contenuta.');\n\n  // 5. Coperture assicurative\n  if (ins.red > 0) add('Coperture assicurative', 'r', ins.red + ' protezione/i essenziale/i mancante/i (dettaglio nella sezione dedicata).');\n  else if (ins.yellow >= 3) add('Coperture assicurative', 'y', 'Diverse aree di protezione da valutare o completare.');\n  else add('Coperture assicurative', 'g', 'Le protezioni principali risultano presenti rispetto al tuo profilo.');\n\n  // 6. Coerenza investimenti / orizzonte\n  if (A.orizzonte === 'breve' && risk.profile !== 'conservativo') add('Coerenza investimenti / orizzonte', 'r', 'Orizzonte breve e profilo aggressivo non sono compatibili.');\n  else if (risk.hIdx >= 2 && nw.inv === 0 && cf.savingsY > 0 && ef.months >= 3) add('Coerenza investimenti / orizzonte', 'y', 'Orizzonte lungo, buona capacità di risparmio ma nessun investimento: il capitale fermo perde potere d’acquisto con l’inflazione.');\n  else add('Coerenza investimenti / orizzonte', 'g', 'Orizzonte e impostazione appaiono coerenti.');\n\n  // 7. Propensione al rischio vs allocazione\n  if (risk.warnings.length >= 2) add('Propensione vs tolleranza al rischio', 'r', 'Più segnali di incoerenza tra rischio dichiarato e comportamento atteso.');\n  else if (risk.warnings.length === 1) add('Propensione vs tolleranza al rischio', 'y', risk.warnings[0]);\n  else add('Propensione vs tolleranza al rischio', 'g', 'Il profilo ' + risk.profile + ' appare coerente con le tue risposte.');\n\n  // 8. Rischio comportamentale\n  if (A.reazione === 'vendo_tutto') add('Rischio comportamentale', 'r', 'La reazione di panico nei cali è il principale distruttore di rendimento di lungo periodo.');\n  else if (A.reazione === 'vendo_parte' || (A.conoscenza && scoreVal('conoscenza') <= 1 && risk.profile === 'dinamico')) add('Rischio comportamentale', 'y', 'Nei momenti di stress potresti deviare dal piano: utile definire regole scritte in anticipo.');\n  else add('Rischio comportamentale', 'g', 'Atteggiamento dichiarato disciplinato nei ribassi.');\n\n  // 9. Protezione del nucleo familiare\n  const deps = midVal('dipendenti');\n  if (deps > 0 || (coupleMode() && A.quotaReddito === 'solo_io')){\n    const tcmOk = (A.coperture || []).includes('tcm'), invOk = (A.coperture || []).includes('invalidita');\n    if (!tcmOk && !invOk) add('Protezione del nucleo familiare', 'r', 'Persone a carico e nessuna protezione su decesso o invalidità di chi produce reddito.');\n    else if (!tcmOk || !invOk) add('Protezione del nucleo familiare', 'y', 'Protezione del nucleo parziale: manca ' + (!tcmOk ? 'la copertura caso morte' : 'la copertura invalidità') + '.');\n    else add('Protezione del nucleo familiare', 'g', 'Le protezioni chiave del nucleo risultano presenti.');\n  } else add('Protezione del nucleo familiare', 'g', 'Nessuna persona economicamente dipendente: l’esigenza di protezione del nucleo è limitata.');\n\n  // 10. Responsabilità civile personale qualificata (utente + eventuale partner)\n  const resp = (A.responsabilita || []).filter(v => v !== 'nessuna');\n  const respP = (A.responsabilitaPartner || []).filter(v => v !== 'nessuna');\n  const heavyRole = v => ['snc','sas','sindaco'].includes(v);\n  if (A.responsabilita === undefined && !coupleMode()) add('Responsabilità personale qualificata', 'y', 'Tema non incluso nel percorso Light. Se ricopri ruoli con responsabilità personali (professionista con albo, amministratore, socio SNC/SAS, sindaco/revisore), rifai l’analisi in modalità Standard o Approfondita.');\n  else if (!resp.length && !respP.length) add('Responsabilità personale qualificata', 'g', 'Nessun ruolo con esposizione patrimoniale particolare dichiarato' + (coupleMode() ? ', né per te né per il partner.' : '.'));\n  else if (resp.some(heavyRole) || respP.some(heavyRole)) add('Responsabilità personale qualificata', 'r', (resp.some(heavyRole) ? 'Ricopri ruoli' : 'Il tuo partner ricopre ruoli') + ' con responsabilità illimitata o molto elevata: necessaria verifica professionale specifica delle coperture e del regime patrimoniale.');\n  else add('Responsabilità personale qualificata', 'y', (resp.length && respP.length ? 'Tu e il tuo partner ricoprite' : (respP.length ? 'Il tuo partner ricopre' : 'Ricopri')) + ' ruoli con possibile esposizione personale: consigliata una verifica delle coperture di responsabilità con un professionista.');\n\n  return L;\n}\n\n/* ============================================================\n   MODELLO COMPLESSIVO\n   ============================================================ */\nfunction computeAll(){\n  normalizeDebts(); // garantisce coerenza delle risposte auto-compilate sui debiti\n  const nw = calculateNetWorth();\n  const cf = calculateCashFlow();\n  const debt = calculateDebtSustainability(nw, cf);\n  const ef = calculateEmergencyFund(nw, cf);\n  const investable = calculateInvestable(nw, cf);\n  const risk = determineRiskProfile();\n  const ins = calculateInsuranceGaps(nw, cf, debt);\n  const allocs = generateAllocationProfiles(risk, ef);\n\n  // obiettivo (dichiarato, calcolato per l'indipendenza, o default prudente)\n  const goalObj = computeGoal(cf, investable);\n  const goal = goalObj.value;\n\n  // orizzonte: dal piano dichiarato, oppure dall'età-obiettivo (indipendenza/pensione)\n  let years = midVal('orizzonte');\n  if (deepMode() && isFI() && A.etaObiettivo)\n    years = Math.min(40, Math.max(1, midVal('etaObiettivo') - midVal('eta')));\n\n  const baseR = RETURNS[risk.profile];\n  const monthly = cf.savingsM;\n  const projBase = runProjection(investable, monthly, years, baseR);\n  const projLow  = runProjection(investable, monthly, years, Math.max(0.005, baseR - SCENARIO_DELTA));\n  const projHigh = runProjection(investable, monthly, years, baseR + SCENARIO_DELTA);\n  const goalGap = goal - projBase.final;\n\n  // fiscalità stimata (v. assunzioni): imposta sui guadagni e bollo titoli\n  const tax = effTaxRate();\n  const growth = Math.max(0, projBase.final - projBase.contributed);\n  const netFinal = projBase.contributed + growth * (1 - tax);        // valore netto se liquidato a fine piano\n  const bolloStima = Math.round(0.002 * ((investable + projBase.final) / 2) * years); // 0,2% annuo sul saldo medio\n\n  // sostenibilità degli accantonamenti: il risparmio dichiarato è compatibile col bilancio?\n  const sustainable = cf.implicitSavings >= cf.savingsY * 0.8 || cf.savingsY === 0;\n\n  const couple = analyzeCouple(cf);\n\n  const M = { nw, cf, debt, ef, investable, risk, ins, allocs, goal, goalLabel: goalObj.label,\n              years, baseR, monthly, projBase, projLow, projHigh, goalGap, sustainable,\n              tax, growth, netFinal, bolloStima, deep: deepMode(), tier: tier(), tierLabel: tierName(), couple };\n  M.lights = computeTrafficLights(M);\n  return M;\n}\n/* ============================================================\n   GRAFICI SVG (vanilla, nessuna libreria)\n   ============================================================ */\nconst PALETTE = ['#1f4e79','#2e7dba','#0e8a6d','#d99a06','#8a5fbf','#d64545','#5a6b7d'];\n\nfunction polar(cx, cy, r, ang){ return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)]; }\n\n// Donut chart: items = [{label, value, color}]\nfunction svgDonut(items, size){\n  size = size || 220;\n  const total = items.reduce((s, i) => s + i.value, 0);\n  if (total <= 0) return '<p class=\"muted small\" style=\"text-align:center\">Nessun dato da rappresentare.</p>';\n  const cx = size/2, cy = size/2, r1 = size/2 - 6, r2 = size/4.4;\n  let a = -Math.PI/2, paths = '';\n  items.filter(i => i.value > 0).forEach(i => {\n    const frac = i.value / total, a2 = a + frac * 2 * Math.PI;\n    const large = frac > 0.5 ? 1 : 0;\n    // settore quasi completo: disegna anello pieno\n    if (frac > 0.999){\n      paths += `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"${(r1+r2)/2}\" fill=\"none\" stroke=\"${i.color}\" stroke-width=\"${r1-r2}\"/>`;\n    } else {\n      const [x1,y1] = polar(cx,cy,r1,a), [x2,y2] = polar(cx,cy,r1,a2);\n      const [x3,y3] = polar(cx,cy,r2,a2), [x4,y4] = polar(cx,cy,r2,a);\n      paths += `<path d=\"M${x1.toFixed(1)},${y1.toFixed(1)} A${r1},${r1} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} L${x3.toFixed(1)},${y3.toFixed(1)} A${r2},${r2} 0 ${large} 0 ${x4.toFixed(1)},${y4.toFixed(1)} Z\" fill=\"${i.color}\" stroke=\"#fff\" stroke-width=\"1.5\"/>`;\n    }\n    a = a2;\n  });\n  const legend = '<div class=\"legend\">' + items.filter(i => i.value > 0).map(i =>\n    `<span><i style=\"background:${i.color}\"></i>${esc(i.label)} · ${fmtEUR(i.value)} (${fmtPct(100*i.value/total,0)})</span>`).join('') + '</div>';\n  return `<svg viewBox=\"0 0 ${size} ${size}\" width=\"${size}\" role=\"img\">${paths}</svg>` + legend;\n}\n\n// Line chart: series = [{name, color, points[]}] (punti annuali), hline opzionale = {value,label}\nfunction svgLines(series, hline, yearsLabel){\n  const w = 680, h = 300, padL = 78, padR = 16, padT = 16, padB = 34;\n  let maxV = 0, maxN = 0;\n  series.forEach(s => { maxN = Math.max(maxN, s.points.length - 1); s.points.forEach(p => maxV = Math.max(maxV, p)); });\n  if (hline) maxV = Math.max(maxV, hline.value);\n  maxV = maxV * 1.08 || 1;\n  const X = i => padL + (w - padL - padR) * (maxN ? i / maxN : 0);\n  const Y = v => padT + (h - padT - padB) * (1 - v / maxV);\n  let g = '';\n  for (let k = 0; k <= 4; k++){\n    const v = maxV * k / 4, y = Y(v);\n    g += `<line x1=\"${padL}\" y1=\"${y}\" x2=\"${w-padR}\" y2=\"${y}\" stroke=\"#e3e8ef\"/>` +\n         `<text x=\"${padL-8}\" y=\"${y+4}\" font-size=\"11\" fill=\"#5a6b7d\" text-anchor=\"end\">${fmtShort(v)}</text>`;\n  }\n  const step = Math.max(1, Math.ceil(maxN / 8));\n  for (let i = 0; i <= maxN; i += step)\n    g += `<text x=\"${X(i)}\" y=\"${h-10}\" font-size=\"11\" fill=\"#5a6b7d\" text-anchor=\"middle\">${i}</text>`;\n  g += `<text x=\"${(w+padL)/2}\" y=\"${h+2}\" font-size=\"10\" fill=\"#5a6b7d\" text-anchor=\"middle\">${esc(yearsLabel || 'anni')}</text>`;\n  series.forEach(s => {\n    const d = s.points.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(p).toFixed(1)).join(' ');\n    g += `<path d=\"${d}\" fill=\"none\" stroke=\"${s.color}\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>`;\n  });\n  if (hline){\n    g += `<line x1=\"${padL}\" y1=\"${Y(hline.value)}\" x2=\"${w-padR}\" y2=\"${Y(hline.value)}\" stroke=\"#d64545\" stroke-dasharray=\"6 4\" stroke-width=\"1.5\"/>` +\n         `<text x=\"${w-padR}\" y=\"${Y(hline.value)-6}\" font-size=\"11\" fill=\"#d64545\" text-anchor=\"end\">${esc(hline.label)}</text>`;\n  }\n  const legend = '<div class=\"legend\">' + series.map(s => `<span><i style=\"background:${s.color}\"></i>${esc(s.name)}</span>`).join('') +\n    (hline ? `<span><i style=\"background:#d64545\"></i>${esc(hline.label)}</span>` : '') + '</div>';\n  return `<div class=\"chart-box\"><svg viewBox=\"0 0 ${w} ${h+8}\" width=\"${w}\">${g}</svg>${legend}</div>`;\n}\nfunction fmtShort(v){\n  if (v >= 1e6) return (v/1e6).toFixed(1).replace('.',',') + ' M€';\n  if (v >= 1e3) return Math.round(v/1e3) + ' k€';\n  return Math.round(v) + ' €';\n}\n\n// Barre orizzontali: items = [{label, value, color, text}]\nfunction svgHBars(items, maxV){\n  const w = 680, rowH = 34, padL = 200, padR = 90, h = items.length * rowH + 10;\n  maxV = maxV || Math.max(1, ...items.map(i => i.value));\n  let g = '';\n  items.forEach((it, k) => {\n    const y = 8 + k * rowH, bw = Math.max(2, (w - padL - padR) * it.value / maxV);\n    g += `<text x=\"${padL-8}\" y=\"${y+15}\" font-size=\"12\" fill=\"#1c2733\" text-anchor=\"end\">${esc(trunc(it.label, 28))}</text>` +\n         `<rect x=\"${padL}\" y=\"${y}\" width=\"${bw}\" height=\"20\" rx=\"5\" fill=\"${it.color}\"/>` +\n         `<text x=\"${padL+bw+7}\" y=\"${y+15}\" font-size=\"12\" fill=\"#5a6b7d\">${esc(it.text !== undefined ? it.text : String(it.value))}</text>`;\n  });\n  return `<div class=\"chart-box\"><svg viewBox=\"0 0 ${w} ${h}\" width=\"${w}\">${g}</svg></div>`;\n}\nfunction trunc(s, n){ return s.length > n ? s.slice(0, n-1) + '…' : s; }\n\n// Barre impilate per confronto allocazioni\nfunction svgStacked(rows){ // rows = [{label, segments:[{value,color,name}]}]\n  const w = 680, rowH = 46, padL = 120, padR = 12, h = rows.length * rowH + 6;\n  let g = '';\n  rows.forEach((r, k) => {\n    const y = 6 + k * rowH;\n    g += `<text x=\"${padL-8}\" y=\"${y+20}\" font-size=\"12\" font-weight=\"600\" fill=\"#1c2733\" text-anchor=\"end\">${esc(r.label)}</text>`;\n    let x = padL;\n    r.segments.forEach(s => {\n      const bw = (w - padL - padR) * s.value / 100;\n      if (bw > 0.5){\n        g += `<rect x=\"${x.toFixed(1)}\" y=\"${y}\" width=\"${bw.toFixed(1)}\" height=\"30\" fill=\"${s.color}\"/>`;\n        if (bw > 34) g += `<text x=\"${(x+bw/2).toFixed(1)}\" y=\"${y+20}\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">${s.value}%</text>`;\n        x += bw;\n      }\n    });\n  });\n  return `<div class=\"chart-box\"><svg viewBox=\"0 0 ${w} ${h}\" width=\"${w}\">${g}</svg></div>`;\n}\n\n// Barra a soglie per l'incidenza rate/reddito\nfunction svgGauge(pct){\n  const w = 680, h = 74, padL = 14, padR = 14, bw = w - padL - padR;\n  const zones = [{to:20, c:'#2e9e5b'},{to:35, c:'#d99a06'},{to:60, c:'#d64545'}];\n  let g = '', x0 = padL, prev = 0;\n  zones.forEach(z => {\n    const zw = bw * (z.to - prev) / 60;\n    g += `<rect x=\"${x0}\" y=\"26\" width=\"${zw}\" height=\"16\" fill=\"${z.c}\" opacity=\".28\" rx=\"3\"/>`;\n    g += `<text x=\"${x0+zw}\" y=\"60\" font-size=\"10\" fill=\"#5a6b7d\" text-anchor=\"middle\">${z.to}%</text>`;\n    x0 += zw; prev = z.to;\n  });\n  const p = Math.min(60, Math.max(0, pct));\n  const xm = padL + bw * p / 60;\n  g += `<polygon points=\"${xm-7},14 ${xm+7},14 ${xm},26\" fill=\"#1c2733\"/>` +\n       `<text x=\"${xm}\" y=\"10\" font-size=\"12\" font-weight=\"700\" fill=\"#1c2733\" text-anchor=\"middle\">${fmtPct(pct,0)}</text>`;\n  return `<div class=\"chart-box\"><svg viewBox=\"0 0 ${w} ${h}\" width=\"${w}\">${g}</svg><div class=\"legend\"><span><i style=\"background:#2e9e5b\"></i>≤20% contenuta</span><span><i style=\"background:#d99a06\"></i>20–35% da monitorare</span><span><i style=\"background:#d64545\"></i>&gt;35% critica</span></div></div>`;\n}\n\n/* ============================================================\n   SIMULATORE DINAMICO GUIDATO\n   Parametri modificabili: accantonamento mensile, durata piano,\n   allocazione azionaria entro ±10 punti dal profilo coerente.\n   ============================================================ */\nlet MODEL = null;\nconst SIM = { monthly:0, years:10, tilt:0 };\n\nfunction simBaseEquity(){ return MODEL.allocs[MODEL.risk.profile].eq; }\n\nfunction updateSimulator(){\n  if (!MODEL) return;\n  SIM.monthly = +byId('simMonthly').value;\n  SIM.years = +byId('simYears').value;\n  SIM.tilt = +byId('simTilt').value;\n  byId('simMonthlyOut').textContent = fmtEUR(SIM.monthly) + '/mese';\n  byId('simYearsOut').textContent = SIM.years + ' anni (fine ' + (new Date().getFullYear() + SIM.years) + ')';\n  const eq = simBaseEquity() + SIM.tilt;\n  byId('simTiltOut').textContent = (SIM.tilt > 0 ? '+' : '') + SIM.tilt + ' p.ti → azionario ' + eq + '%';\n\n  // rendimento atteso: base del profilo ± 0,04 punti percentuali per ogni punto di azionario spostato\n  const r = RETURNS[MODEL.risk.profile] + SIM.tilt * 0.0004;\n  const base = runProjection(MODEL.investable, SIM.monthly, SIM.years, r);\n  const low  = runProjection(MODEL.investable, SIM.monthly, SIM.years, Math.max(0.005, r - SCENARIO_DELTA));\n  const high = runProjection(MODEL.investable, SIM.monthly, SIM.years, r + SCENARIO_DELTA);\n  const gap = base.final - MODEL.goal;\n  const growth = base.final - base.contributed;\n\n  const riskLabel = eq < 25 ? 'Basso' : (eq <= 45 ? 'Medio' : 'Alto');\n  const coherent = MODEL.risk.maxdd >= (eq < 25 ? 5 : (eq <= 45 ? 10 : 20));\n\n  const netF = base.contributed + growth * (1 - (MODEL.tax !== undefined ? MODEL.tax : 0.26));\n  byId('simKpis').innerHTML =\n    kpi(fmtEUR(base.final), 'Patrimonio finale stimato (scenario intermedio)') +\n    kpi(fmtEUR(low.final) + ' – ' + fmtEUR(high.final), 'Forchetta prudente – positivo') +\n    kpi(fmtEUR(base.contributed), 'Capitale versato (iniziale + accantonamenti)') +\n    kpi(fmtEUR(growth), 'Crescita stimata dai rendimenti') +\n    kpi(fmtEUR(netF), 'Valore netto stimato dopo fiscalità (se liquidato)') +\n    kpi((gap >= 0 ? '+' : '') + fmtEUR(gap), gap >= 0 ? 'Sopra l’obiettivo' : 'Sotto l’obiettivo di ' + fmtEUR(MODEL.goal)) +\n    kpi(riskLabel, 'Rischio qualitativo dell’allocazione simulata');\n\n  let msg = '';\n  if (!coherent) msg += `<div class=\"alert warn\">⚠️ Con azionario al ${eq}% le oscillazioni possibili superano la perdita massima che hai dichiarato di tollerare (~${MODEL.risk.maxdd}%). Meglio restare più vicino al profilo suggerito.</div>`;\n  if (gap < 0){\n    const plus100 = runProjection(MODEL.investable, SIM.monthly + 100, SIM.years, r).final - base.final;\n    const plus5y  = runProjection(MODEL.investable, SIM.monthly, SIM.years + 5, r).final - base.final;\n    msg += `<div class=\"alert info\">💡 Per avvicinarti all’obiettivo: <b>+100 €/mese</b> aggiungerebbero circa <b>${fmtEUR(plus100)}</b>; <b>+5 anni di orizzonte</b> circa <b>${fmtEUR(plus5y)}</b>. Piccole variazioni costanti contano più di scommesse sul rendimento.</div>`;\n  } else msg += '<div class=\"alert ok\">✅ Con queste ipotesi prudenti l’obiettivo appare raggiungibile. Ricorda: sono stime, non promesse.</div>';\n  byId('simMsg').innerHTML = msg;\n\n  byId('simChart').innerHTML = svgLines([\n    {name:'Prudente (' + fmtPct((r - SCENARIO_DELTA)*100,1) + ')', color:'#5a6b7d', points:low.points},\n    {name:'Intermedio (' + fmtPct(r*100,1) + ')', color:'#1f4e79', points:base.points},\n    {name:'Positivo (' + fmtPct((r + SCENARIO_DELTA)*100,1) + ')', color:'#0e8a6d', points:high.points}\n  ], {value:MODEL.goal, label:'Obiettivo ' + fmtEUR(MODEL.goal)}, 'anni da oggi');\n}\nfunction kpi(v, l){ return `<div class=\"kpi\"><div class=\"v\">${v}</div><div class=\"l\">${esc(l)}</div></div>`; }\n\n/* ============================================================\n   REPORT SEMPLIFICATO\n   ============================================================ */\nfunction generateSimpleReport(M){\n  const g = M.lights.filter(l => l.level === 'g'), y = M.lights.filter(l => l.level === 'y'), r = M.lights.filter(l => l.level === 'r');\n  const profLabel = {conservativo:'Prudente', bilanciato:'Bilanciato', dinamico:'Dinamico'}[M.risk.profile];\n  let h = '';\n\n  h += `<div class=\"simple-block\"><h4>📍 Dove sei oggi</h4>\n    <p>Il tuo patrimonio netto stimato è di circa <b>${fmtEUR(M.nw.netWorth)}</b>. Ogni anno la tua famiglia guadagna circa <b>${fmtEUR(M.cf.income)}</b>, spende circa <b>${fmtEUR(M.cf.expensesY)}</b> e riesce a mettere da parte circa <b>${fmtEUR(M.cf.savingsY)}</b>. La tua liquidità copre circa <b>${Math.round(M.ef.months)} mesi</b> di spese.</p></div>`;\n\n  h += `<div class=\"simple-block\"><h4>💪 Punti di forza</h4>` +\n    (g.length ? '<ul class=\"clean\">' + g.map(l => `<li><b>${esc(l.name)}</b>: ${esc(l.why)}</li>`).join('') + '</ul>' : '<p>Al momento non emergono aree pienamente solide: è normale all’inizio di un percorso. Si costruiscono un passo alla volta.</p>') + '</div>';\n\n  if (r.length + y.length){\n    h += `<div class=\"simple-block\" style=\"border-left-color:var(--warn)\"><h4>🔍 Aree fragili</h4><ul class=\"clean\">` +\n      r.map(l => `<li>🔴 <b>${esc(l.name)}</b>: ${esc(l.why)}</li>`).join('') +\n      y.map(l => `<li>🟡 <b>${esc(l.name)}</b>: ${esc(l.why)}</li>`).join('') + '</ul></div>';\n  }\n\n  // cosa controllare prima (ordine di priorità classico: emergenze → debiti cari → protezioni → investimenti)\n  const prio = [];\n  if (M.ef.months < 3) prio.push('Costruisci il fondo di emergenza: obiettivo 3–6 mesi di spese (' + fmtEUR(M.ef.target) + ') su un conto separato e subito disponibile.');\n  if (M.debt.hasRevolving) prio.push('Estingui le carte revolving: costano più di quanto qualsiasi investimento prudente possa rendere.');\n  if (M.debt.rateOnIncome > 0.35) prio.push('Riduci il peso delle rate: sopra il 35% del reddito ogni imprevisto diventa pericoloso.');\n  if (M.ins.red > 0) prio.push('Colma le protezioni essenziali mancanti (vedi sezione assicurativa): proteggere i rischi gravi viene prima di investire.');\n  if (M.cf.savingsRate < 0.05 && M.cf.implicitSavings > 0) prio.push('Alza il tasso di risparmio: anche 50–100 € in più al mese cambiano il piano nel lungo periodo.');\n  if (!prio.length) prio.push('Le basi appaiono in ordine: puoi concentrarti su costanza degli accantonamenti e revisione annuale del piano.');\n  h += `<div class=\"simple-block\"><h4>✅ Cosa controllare prima</h4><ul class=\"clean\">` + prio.map(p => '<li>' + esc(p) + '</li>').join('') + '</ul></div>';\n\n  h += `<div class=\"simple-block\"><h4>⚖️ Il piano è sostenibile?</h4>\n    <p>${M.sustainable ? 'Sì: il risparmio che hai indicato è compatibile con il tuo bilancio.' : 'Attenzione: il risparmio indicato sembra superiore a quanto il bilancio (reddito meno spese) consente davvero. Rivedi le stime prima di fissare il piano.'}\n    ${M.cf.implicitSavings < 0 ? ' Le spese superano il reddito: prima di ogni piano di investimento serve riportare il bilancio in positivo.' : ''}</p>\n    <p>Impegni finanziari: ${M.nw.totalDebt === 0 ? 'non hai debiti — ottimo punto di partenza.' : 'le rate assorbono circa <b>' + fmtPct(M.debt.rateOnIncome*100,0) + '</b> del reddito' + (M.debt.rateOnIncome <= 0.2 ? ', un livello gestibile.' : (M.debt.rateOnIncome <= 0.35 ? ', un livello da tenere d’occhio.' : ', un livello critico da ridurre.'))}</p>\n    <p>Coperture assicurative: ${M.ins.red > 0 ? 'ci sono <b>lacune importanti</b> da valutare al più presto.' : (M.ins.yellow >= 3 ? 'diverse aree sono da completare, ma senza urgenze drammatiche.' : 'l’impianto di protezione appare ragionevole per il tuo profilo.')}</p></div>`;\n\n  h += `<div class=\"simple-block\"><h4>🧭 Profilo suggerito: <b>${profLabel}</b></h4>\n    <p>In base a età, orizzonte, esperienza e tolleranza alle perdite, l’allocazione più coerente per te è quella <b>${profLabel.toLowerCase()}</b> (la trovi evidenziata più sotto). Con ipotesi prudenti, continuando a risparmiare ${fmtEUR(M.monthly)}/mese per ${M.years} anni, il tuo capitale potrebbe passare da ${fmtEUR(M.investable)} a circa <b>${fmtEUR(M.projBase.final)}</b> (tra ${fmtEUR(M.projLow.final)} e ${fmtEUR(M.projHigh.final)} negli scenari prudente e positivo). ${M.goalGap <= 0 ? 'L’obiettivo di ' + fmtEUR(M.goal) + ' appare raggiungibile.' : 'Rispetto all’obiettivo di ' + fmtEUR(M.goal) + ' mancherebbero circa ' + fmtEUR(M.goalGap) + ': usa il simulatore per capire cosa cambia con più risparmio o più tempo.'}</p>\n    <p class=\"small muted\">Come è stato fissato l’obiettivo di ${fmtEUR(M.goal)}: ${esc(M.goalLabel)}.</p></div>`;\n\n  if (M.couple){\n    h += `<div class=\"simple-block\"><h4>👫 Analisi di coppia</h4>\n    <p>Del reddito familiare di ${fmtEUR(M.cf.income)}, tu ne porti circa il <b>${fmtPct(M.couple.share*100,0)}</b> (${fmtEUR(M.couple.mine)}) e il tuo partner ${fmtEUR(M.couple.theirs)}. ${M.couple.concentration\n      ? 'Il reddito dipende in gran parte da <b>' + (M.couple.keyPerson === 'tu' ? 'te' : 'una sola persona (il tuo partner)') + '</b>: proteggere chi lo produce (vita caso morte, invalidità) è la priorità assicurativa numero uno della famiglia.'\n      : 'Il reddito è ben distribuito tra voi due: la famiglia è più resiliente se uno dei due deve fermarsi.'}</p>\n    ${M.couple.resp.length\n      ? '<p>⚠️ Il tuo partner ricopre ruoli con possibile esposizione patrimoniale (' + esc(M.couple.respLabels.join(', ')) + '): in certe condizioni (ad es. comunione dei beni) anche il patrimonio familiare può esserne coinvolto. Da verificare con un professionista: coperture di responsabilità del partner e regime patrimoniale.</p>'\n      : '<p>Nessun ruolo a rischio patrimoniale segnalato per il partner.</p>'}</div>`;\n  }\n\n  h += `<div class=\"simple-block\"><h4>🧾 Fisco in breve</h4>\n    <p>In Italia i guadagni degli investimenti sono in genere tassati al <b>26%</b> (12,5% per i titoli di Stato) e sul conto titoli si paga un’imposta di bollo dello <b>0,2% l’anno</b>. Se a fine piano liquidassi tutto, il patrimonio stimato di ${fmtEUR(M.projBase.final)} varrebbe circa <b>${fmtEUR(M.netFinal)}</b> netti (stima). La previdenza integrativa gode di vantaggi fiscali: deduzione dei versamenti fino a ~5.164 €/anno e tassazione finale agevolata (15%, riducibile fino al 9%).</p></div>`;\n\n  if (M.risk.warnings.length)\n    h += `<div class=\"alert warn\">⚠️ <div>${M.risk.warnings.map(esc).join('<br>')}</div></div>`;\n\n  return h;\n}\n\n/* ============================================================\n   REPORT AVANZATO\n   ============================================================ */\nfunction generateAdvancedReport(M){\n  const t = (rows, headers) => '<table class=\"t\"><tr>' + headers.map(x => '<th>' + x + '</th>').join('') + '</tr>' +\n    rows.map(r => '<tr' + (r.tot ? ' class=\"trow-tot\"' : '') + '><td>' + r.k + '</td><td class=\"num\">' + r.v + '</td>' + (r.n !== undefined ? '<td class=\"small muted\">' + r.n + '</td>' : '') + '</tr>').join('') + '</table>';\n\n  let h = '<div class=\"chart-title\">Tabella patrimonio</div>' + t([\n    {k:'Liquidità', v:fmtEUR(M.nw.liq)},{k:'Investimenti finanziari', v:fmtEUR(M.nw.inv)},\n    {k:'Immobili', v:fmtEUR(M.nw.imm)},{k:'Previdenza integrativa', v:fmtEUR(M.nw.prev)},\n    {k:'Altri asset', v:fmtEUR(M.nw.altri)},{k:'Patrimonio lordo', v:fmtEUR(M.nw.grossAssets), tot:true},\n    {k:'Debiti totali', v:'− ' + fmtEUR(M.nw.totalDebt)},{k:'Patrimonio netto', v:fmtEUR(M.nw.netWorth), tot:true}\n  ], ['Voce','Valore stimato']);\n\n  h += '<div class=\"chart-title\">Composizione del patrimonio lordo</div><div class=\"chart-box\" style=\"text-align:center\">' +\n    svgDonut([\n      {label:'Liquidità', value:M.nw.liq, color:PALETTE[1]},\n      {label:'Investimenti', value:M.nw.inv, color:PALETTE[0]},\n      {label:'Immobili', value:M.nw.imm, color:PALETTE[3]},\n      {label:'Previdenza', value:M.nw.prev, color:PALETTE[2]},\n      {label:'Altri asset', value:M.nw.altri, color:PALETTE[4]}\n    ]) + '</div>';\n\n  h += '<div class=\"chart-title\">Tabella cash flow</div>' + t([\n    {k:'Reddito annuo netto', v:fmtEUR(M.cf.income)},\n    {k:'Spese annue stimate', v:'− ' + fmtEUR(M.cf.expensesY)},\n    {k:'Saldo implicito', v:fmtEUR(M.cf.implicitSavings)},\n    {k:'Risparmio annuo dichiarato', v:fmtEUR(M.cf.savingsY), tot:true},\n    {k:'Tasso di risparmio', v:fmtPct(M.cf.savingsRate*100,1)}\n  ], ['Voce','Valore']);\n  if (M.cf.incoherent) h += '<div class=\"alert warn\">⚠️ Reddito, spese e risparmio dichiarati non tornano perfettamente tra loro: i range possono spiegare parte dello scarto, ma conviene ricontrollare le stime.</div>';\n\n  h += '<div class=\"chart-title\">Tabella debiti</div>';\n  if (M.nw.totalDebt === 0 && M.debt.rateY === 0) h += '<p class=\"muted small\">Nessun debito dichiarato.</p>';\n  else {\n    h += t([\n      {k:'Mutuo residuo', v:fmtEUR(M.nw.mutuo)},\n      {k:'Altri debiti (' + ((A.tipiDebiti||[]).filter(x=>x!=='nessuno').map(v=>(optOf('tipiDebiti',v)||{l:v}).l).join(', ') || '—') + ')', v:fmtEUR(M.nw.altriDeb)},\n      {k:'Totale debiti', v:fmtEUR(M.nw.totalDebt), tot:true},\n      {k:'Rata annua totale', v:fmtEUR(M.debt.rateY)},\n      {k:'Incidenza rate / reddito', v:fmtPct(M.debt.rateOnIncome*100,1)},\n      {k:'Debiti / reddito annuo', v:(M.debt.debtToIncome).toFixed(1).replace('.',',') + '×'},\n      {k:'Durata residua massima', v:labelOf('durataImpegni')}\n    ], ['Voce','Valore']);\n    if (M.nw.debtEstimated) h += '<div class=\"alert info\">ℹ️ Percorso Light: il debito residuo è <b>stimato dalla rata mensile</b> (ipotesi: durata media residua 5 anni). Per il dato puntuale rifai l’analisi in modalità Standard o Approfondita.</div>';\n    h += '<div class=\"chart-title\">Composizione debiti</div><div class=\"chart-box\" style=\"text-align:center\">' +\n      svgDonut([{label:'Mutuo', value:M.nw.mutuo, color:PALETTE[0]},{label:'Altri debiti', value:M.nw.altriDeb, color:PALETTE[5]}], 190) + '</div>';\n  }\n  h += '<div class=\"chart-title\">Incidenza rate sul reddito</div>' + svgGauge(M.debt.rateOnIncome*100);\n\n  // Indicatori di sostenibilità\n  h += '<div class=\"chart-title\">Indicatori di sostenibilità</div><div class=\"kpis\">' +\n    kpi(fmtPct(M.cf.savingsRate*100,0), 'Tasso di risparmio (rif. ≥15%)') +\n    kpi(Math.round(M.ef.months) + ' mesi', 'Fondo emergenza (rif. ≥6 mesi)') +\n    kpi(fmtPct(M.debt.rateOnIncome*100,0), 'Rate/reddito (rif. ≤20%)') +\n    kpi((M.debt.debtToIncome).toFixed(1).replace('.',',') + '×', 'Debiti/reddito annuo') +\n    kpi(fmtEUR(M.investable), 'Capitale investibile (oltre 6 mesi di riserva)') +\n    kpi(fmtEUR(M.goal), 'Capitale obiettivo a fine piano') + '</div>';\n\n  // Coperture assicurative\n  h += '<div class=\"chart-title\">Coperture assicurative e gap</div>' + t(\n    M.ins.gaps.map(g => ({k:g.area, v:'<span class=\"pill ' + g.level + '\">' + (g.level==='g'?'OK':(g.level==='y'?'Da valutare':'Critico')) + '</span>', n:g.why})),\n    ['Area','Stato','Nota']);\n  h += svgHBars(M.ins.gaps.map(g => ({\n    label:g.area, value:g.level==='g'?100:(g.level==='y'?55:20),\n    color:g.level==='g'?'#2e9e5b':(g.level==='y'?'#d99a06':'#d64545'),\n    text:g.level==='g'?'adeguata':(g.level==='y'?'da valutare':'lacuna critica')})), 100);\n\n  // Simulazione patrimoniale (scenari base)\n  h += '<div class=\"chart-title\">Simulazione patrimoniale — profilo ' + esc(M.risk.profile) + ' (' + fmtPct(M.baseR*100,1) + ' atteso)</div>';\n  h += svgLines([\n    {name:'Prudente ' + fmtPct((Math.max(0.005, M.baseR-SCENARIO_DELTA))*100,1), color:'#5a6b7d', points:M.projLow.points},\n    {name:'Intermedio ' + fmtPct(M.baseR*100,1), color:'#1f4e79', points:M.projBase.points},\n    {name:'Positivo ' + fmtPct((M.baseR+SCENARIO_DELTA)*100,1), color:'#0e8a6d', points:M.projHigh.points}\n  ], {value:M.goal, label:'Obiettivo'}, 'anni (piano di ' + M.years + ' anni, ' + fmtEUR(M.monthly) + '/mese)');\n  h += t([\n    {k:'Capitale iniziale investibile', v:fmtEUR(M.investable)},\n    {k:'Versamenti totali nel piano', v:fmtEUR(M.projBase.contributed - M.investable)},\n    {k:'Scenario prudente', v:fmtEUR(M.projLow.final)},\n    {k:'Scenario intermedio', v:fmtEUR(M.projBase.final), tot:true},\n    {k:'Scenario positivo', v:fmtEUR(M.projHigh.final)},\n    {k:'Gap vs obiettivo (scenario intermedio)', v:(M.goalGap>0?'− ':'+ ') + fmtEUR(Math.abs(M.goalGap))}\n  ], ['Scenario','Valore a fine piano']);\n\n  // Analisi di coppia\n  if (M.couple){\n    h += '<div class=\"chart-title\">Analisi di coppia</div>' + t([\n      {k:'Reddito familiare annuo netto', v:fmtEUR(M.cf.income)},\n      {k:'Apporto tuo (' + fmtPct(M.couple.share*100,0) + ')', v:fmtEUR(M.couple.mine)},\n      {k:'Apporto del partner (' + fmtPct((1-M.couple.share)*100,0) + ')', v:fmtEUR(M.couple.theirs)},\n      {k:'Concentrazione del reddito', v:M.couple.concentration ? '⚠️ Alta' : 'Equilibrata', n:M.couple.concentration ? 'la famiglia dipende soprattutto da ' + (M.couple.keyPerson === 'tu' ? 'te' : 'il partner') + ': priorità a TCM e copertura invalidità su quella persona' : 'buona resilienza del bilancio familiare'},\n      {k:'Ruoli a rischio patrimoniale del partner', v:M.couple.resp.length ? '⚠️ Presenti' : 'Nessuno', n:M.couple.resp.length ? esc(M.couple.respLabels.join(', ')) + ' — verificare RC professionale del partner e regime patrimoniale (comunione/separazione dei beni)' : ''}\n    ], ['Voce','Valore','Nota']);\n  }\n\n  // Decumulo e fiscalità\n  h += '<div class=\"chart-title\">Decumulo e fiscalità (stime semplificate)</div>';\n  if (M.deep && isFI() && isAnswered(Q('speseTarget'))){\n    const needM = Math.max(0, midVal('speseTarget') - midVal('altreEntrateFuture'));\n    h += t([\n      {k:'Tenore di vita mensile desiderato', v:fmtEUR(midVal('speseTarget'))},\n      {k:'Altre entrate previste (pensione, affitti…)', v:'− ' + fmtEUR(midVal('altreEntrateFuture'))},\n      {k:'Fabbisogno mensile da capitale', v:fmtEUR(needM), tot:true},\n      {k:'Fabbisogno annuo netto', v:fmtEUR(needM*12)},\n      {k:'Capitale obiettivo (25× + fiscalità stimata)', v:fmtEUR(M.goal), tot:true},\n      {k:'Età di inizio decumulo indicata', v:labelOf('etaObiettivo')},\n      {k:'Anni di accumulo residui stimati', v:M.years + ' anni'}\n    ], ['Voce','Valore']);\n    h += '<div class=\"alert info\">💡 <div>Con la <b>regola del 4%</b> un prelievo annuo pari al 4% del capitale iniziale è storicamente risultato sostenibile su orizzonti lunghi, ma non è garantito. La correzione fiscale ipotizza che circa metà di ogni prelievo sia rendimento tassato all’aliquota stimata (' + fmtPct(M.tax*100,1) + ').</div></div>';\n  }\n  h += t([\n    {k:'Aliquota stimata sui guadagni', v:fmtPct(M.tax*100,1), n:A.tipoStrumenti ? 'in base agli strumenti indicati (26% standard, 12,5% titoli di Stato, 20% proxy misto)' : 'ipotesi standard 26% (non specificato)'},\n    {k:'Guadagni stimati a fine piano (scenario intermedio)', v:fmtEUR(M.growth)},\n    {k:'Imposta stimata in caso di liquidazione totale', v:'− ' + fmtEUR(Math.round(M.growth * M.tax))},\n    {k:'Valore netto stimato dopo fiscalità', v:fmtEUR(M.netFinal), tot:true},\n    {k:'Bollo titoli cumulato stimato (0,2%/anno)', v:'~ ' + fmtEUR(M.bolloStima), n:'già un motivo per preferire strumenti e depositi efficienti'}\n  ], ['Voce','Valore']);\n  h += '<p class=\"small muted\">Nota previdenza integrativa: versamenti deducibili fino a 5.164,57 €/anno (risparmio IRPEF immediato), tassazione finale agevolata dal 15% al 9% in base agli anni di partecipazione. Il TFR in fondo pensione gode dello stesso regime. Approfondisci con un consulente previdenziale.</p>';\n\n  // Assunzioni\n  h += `<div class=\"chart-title\">Assunzioni utilizzate</div><ul class=\"clean small muted\">\n    <li>Rendimenti annui nominali attesi (lordi): conservativo 2,0% · bilanciato 3,2% · dinamico 4,5%; scenari prudente/positivo a ±1,5 punti.</li>\n    <li>Capitalizzazione mensile dei versamenti; versamenti costanti; nessuna interruzione.</li>\n    <li>Gli importi a range usano il valore centrale della fascia (o il valore preciso se inserito).</li>\n    <li>Fiscalità: 26% sui guadagni (12,5% titoli di Stato, 20% proxy per portafogli misti), applicata come stima alla liquidazione; bollo 0,2% annuo sul saldo medio. Non sono modellati: minusvalenze compensabili, zainetto fiscale, regime gestito vs amministrato.</li>\n    <li>Percorso essenziale: debiti residui stimati dalla rata (durata media ipotizzata 5 anni); obiettivo di capitale da default prudenti dichiarati.</li>\n    <li>Inflazione e costi di prodotto non modellati esplicitamente: i rendimenti prudenti li compensano solo in parte.</li>\n    <li>Capitale investibile = investimenti attuali + liquidità eccedente 6 mesi di spese.</li>\n    <li>Soglie: fondo emergenza ≥6 mesi; rate/reddito ≤20% (critico &gt;35%); tasso di risparmio ≥15%.</li>\n  </ul>`;\n  return h;\n}\n\n/* ============================================================\n   TIPS & TRICKS / PRINCIPI GUIDA\n   ============================================================ */\nfunction generateTipsAndTricks(){\n  const tips = [\n    {t:'Il comportamento batte l’analisi', p:'Il risultato finanziario dipende più dalla disciplina (risparmiare con costanza, non vendere nel panico) che dall’intelligenza dei singoli investimenti. Proteggiti dalle tue reazioni prima che dal mercato.', s:'Morgan Housel, “La psicologia dei soldi”'},\n    {t:'Diffida dell’istinto sui soldi', p:'Le decisioni rapide e intuitive sono piene di errori sistematici (ancoraggio, eccesso di fiducia). Sulle scelte patrimoniali importanti rallenta: dormici sopra e usa regole scritte in anticipo.', s:'Daniel Kahneman, “Pensieri lenti e veloci”'},\n    {t:'Le perdite pesano il doppio', p:'Una perdita fa male circa il doppio di quanto un guadagno uguale faccia piacere. Per questo si vende ai minimi. Scegli un’allocazione le cui oscillazioni puoi sopportare davvero, non quella con il rendimento più alto.', s:'Kahneman e Tversky, “Prospect Theory”'},\n    {t:'Ricchezza è ciò che non vedi', p:'I patrimoni solidi si costruiscono spendendo meno di quanto si guadagna per decenni, non con lo stile di vita visibile. Il tasso di risparmio è la variabile che controlli di più.', s:'Stanley e Danko, “Il milionario della porta accanto”'},\n    {t:'Paga prima te stesso', p:'Accantona una quota fissa del reddito appena arriva (idealmente ≥10%), automaticamente, prima di ogni altra spesa. Ciò che resta si spende comunque.', s:'George S. Clason, “L’uomo più ricco di Babilonia”'},\n    {t:'I costi sono certi, i rendimenti no', p:'Ogni punto percentuale di costo annuo è rendimento perso per sempre. Strumenti semplici, diversificati e a basso costo battono nel tempo la maggior parte delle alternative care.', s:'John C. Bogle, “Il piccolo libro dell’investimento vincente”'},\n    {t:'Il passato non si ripete su comando', p:'I rendimenti storici non garantiscono quelli futuri e battere sistematicamente il mercato è raro. Non scegliere un fondo solo perché “ha reso bene ultimamente”.', s:'Burton G. Malkiel, “A Random Walk Down Wall Street”; Eugene Fama, EMH'},\n    {t:'Quattro pilastri, non uno', p:'Teoria, storia, psicologia e industria del risparmio: trascurarne uno costa caro. In particolare, studia le crisi passate: chi conosce il 1929 o il 2008 si spaventa meno nei ribassi.', s:'William J. Bernstein, “I quattro pilastri dell’investimento”'},\n    {t:'Diversifica: è l’unico pasto gratis', p:'Combinare asset che non si muovono insieme riduce il rischio senza sacrificare proporzionalmente il rendimento. Nessun singolo titolo o Paese merita una fetta dominante del patrimonio.', s:'Harry Markowitz, “Portfolio Selection”'},\n    {t:'Preparati a ciò che non è mai successo', p:'Gli eventi estremi e imprevisti dominano la storia finanziaria. Margini di sicurezza (liquidità, assicurazioni, poco debito) valgono più di previsioni precise ma fragili.', s:'Nassim N. Taleb, “Il Cigno Nero”'},\n    {t:'Non confondere cicli e permanenza', p:'Debito, tassi e inflazione si muovono in grandi cicli: ciò che ha funzionato negli ultimi 10 anni può non funzionare nei prossimi 10. Costruisci un portafoglio che regga più scenari.', s:'Ray Dalio, “Principles”; “The Changing World Order”'},\n    {t:'L’euforia è un segnale, non un invito', p:'Quando “tutti guadagnano facilmente” (1929, dot-com, 2008) il rischio è massimo proprio mentre sembra minimo. Distingui il rischio percepito dal rischio reale.', s:'Robert Shiller, “Irrational Exuberance”; Galbraith, “The Great Crash, 1929”'},\n    {t:'Prima i rischi catastrofali', p:'Assicura ciò che non puoi permetterti di perdere (morte, invalidità, responsabilità civile) prima di ottimizzare i rendimenti. Un gap di protezione può azzerare decenni di risparmio.', s:'Principio cardine della pianificazione; cfr. Bernstein, “I quattro pilastri”'},\n    {t:'Il tempo nel mercato batte il timing', p:'Su orizzonti lunghi l’azionario diversificato ha storicamente premiato la pazienza, ma solo chi è rimasto investito. Allunga l’orizzonte invece di cercare il momento perfetto.', s:'Jeremy Siegel, “Stocks for the Long Run”'},\n    {t:'Razionalità limitata: semplifica', p:'Nessuno può elaborare tutte le informazioni: decisioni “abbastanza buone”, semplici e ripetibili battono strategie perfette ma ingestibili. Automatizza risparmio e ribilanciamento.', s:'Herbert Simon, “Administrative Behavior”'}\n  ];\n  return tips.map(x => `<div class=\"tip\"><b>${esc(x.t)}</b><p>${esc(x.p)}</p><div class=\"src\">Per approfondire: ${esc(x.s)}</div></div>`).join('');\n}\n\n/* ============================================================\n   RENDERING RISULTATI\n   ============================================================ */\nfunction renderTrafficLights(lights){\n  return '<div class=\"lights-grid\">' + lights.map(l =>\n    `<div class=\"light-card\"><span class=\"light ${l.level}\" style=\"margin-top:3px\"></span><div><b>${esc(l.name)}</b> <span class=\"pill ${l.level}\">${l.level==='g'?'Adeguata':(l.level==='y'?'Da monitorare':'Critica')}</span><p>${esc(l.why)}</p></div></div>`\n  ).join('') + '</div>';\n}\n\nfunction renderAllocations(M){\n  const names = {conservativo:'🛡️ Bassa propensione (Prudente)', bilanciato:'⚖️ Profilo intermedio (Bilanciato)', dinamico:'🚀 Alta propensione (Dinamico)'};\n  const rows = ['conservativo','bilanciato','dinamico'];\n  let h = '<div class=\"alloc-grid\">';\n  rows.forEach(p => {\n    const a = M.allocs[p], sug = p === M.risk.profile;\n    h += `<div class=\"alloc-card${sug ? ' suggested' : ''}\">` +\n      (sug ? '<div class=\"tag\">✔ coerente con il tuo profilo</div>' : '') +\n      `<h4>${names[p]}</h4><p class=\"small muted\">Rendimento atteso ~${fmtPct(RETURNS[p]*100,1)}/anno</p>` +\n      `<div class=\"alloc-row\"><span>Liquidità / fondo emergenza</span><b>${a.liq}%</b></div>` +\n      `<div class=\"alloc-row\"><span>Obbligazionario</span><b>${a.bond}%</b></div>` +\n      `<div class=\"alloc-row\"><span>Azionario globale</span><b>${a.eq}%</b></div>` +\n      `<div class=\"alloc-row\"><span>Oro / real asset</span><b>${a.gold}%</b></div>` +\n      `<div class=\"alloc-row\"><span>Previdenza / fondo pensione</span><b>${a.pens}%</b></div></div>`;\n  });\n  h += '</div>';\n  h += '<div class=\"chart-title\">Confronto visivo</div>' + svgStacked(rows.map(p => ({label:p.charAt(0).toUpperCase()+p.slice(1), segments:[\n    {value:M.allocs[p].liq, color:PALETTE[1]},{value:M.allocs[p].bond, color:PALETTE[2]},\n    {value:M.allocs[p].eq, color:PALETTE[0]},{value:M.allocs[p].gold, color:PALETTE[3]},\n    {value:M.allocs[p].pens, color:PALETTE[4]}]})));\n  h += '<div class=\"legend\"><span><i style=\"background:'+PALETTE[1]+'\"></i>Liquidità</span><span><i style=\"background:'+PALETTE[2]+'\"></i>Obbligazioni</span><span><i style=\"background:'+PALETTE[0]+'\"></i>Azionario</span><span><i style=\"background:'+PALETTE[3]+'\"></i>Oro/real asset</span><span><i style=\"background:'+PALETTE[4]+'\"></i>Previdenza</span></div>';\n  h += '<div class=\"alert info\">🛡️ <div>Percentuali <b>indicative e prudenti</b>, da adattare con un consulente. La <b>protezione assicurativa dei rischi gravi va finanziata prima o insieme</b> agli investimenti: nessuna allocazione regge se un imprevisto non coperto azzera il capitale.' +\n    (M.ef.months < 6 ? ' Nel tuo caso, completa prima il fondo di emergenza (mancano circa ' + fmtEUR(M.ef.gap) + ').' : '') + '</div></div>';\n  return h;\n}\n\nfunction showResults(){\n  MODEL = computeAll();\n  const M = MODEL;\n  byId('wizard').hidden = true;\n  byId('results').hidden = false;\n\n  const profLabel = {conservativo:'Prudente', bilanciato:'Bilanciato', dinamico:'Dinamico'}[M.risk.profile];\n  const healthScore = computeHealthScore(M.lights);\n\n  // bonus di completamento (una tantum) e festeggiamento\n  award('report', 50, 'analisi completata!');\n  if (M.tier === 3) award('deep', 50, 'percorso Approfondito: trofeo Analista');\n  if (M.couple) award('couple', 20, 'analisi di coppia');\n  confettiBurst();\n\n  let h = '';\n\n  // KPI di sintesi\n  h += `<div class=\"card\"><h2>📊 La tua fotografia</h2><div class=\"kpis\">` +\n    kpi(healthScore + '/100', 'Indice di salute finanziaria') +\n    kpi(fmtEUR(M.nw.netWorth), 'Patrimonio netto stimato') +\n    kpi(fmtEUR(M.cf.income), 'Reddito annuo netto') +\n    kpi(fmtEUR(M.cf.savingsY), 'Risparmio annuo (' + fmtPct(M.cf.savingsRate*100,0) + ')') +\n    kpi(Math.round(M.ef.months) + ' mesi', 'Copertura fondo emergenza') +\n    kpi(fmtPct(M.debt.rateOnIncome*100,0), 'Rate / reddito') +\n    kpi(profLabel, 'Profilo di rischio coerente') +\n    kpi(M.tierLabel, 'Percorso di analisi svolto') + '</div>' +\n    (M.tier === 1 ? '<div class=\"alert warn\">⚠️ <b>Percorso Light:</b> questa analisi è più imprecisa, perché basata su poche domande e su stime standard (debiti, patrimonio di dettaglio, profilo di rischio). Per un quadro affidabile rifai l’analisi con il percorso <b>Approfondito</b>.</div>' : '') +\n    (M.cf.incoherent ? '<div class=\"alert warn\">⚠️ Le stime di reddito, spese e risparmio non sono perfettamente coerenti tra loro: i risultati vanno letti come ordine di grandezza.</div>' : '') + '</div>';\n\n  // Semafori\n  h += `<div class=\"card\" id=\"secLights\"><h2>🚦 Valutazione a semaforo</h2><p class=\"muted small\">Verde = tendenzialmente adeguata · Giallo = da monitorare o migliorare · Rosso = potenzialmente critica.</p>` + renderTrafficLights(M.lights) + '</div>';\n\n  // Gamification: trofei e missioni (solo se la modalità gioco è attiva)\n  if (GAME.enabled){\n    h += `<div class=\"card\" id=\"secBadges\"><h2>🏆 I tuoi trofei</h2>` + renderBadges(M) +\n      `<p class=\"small muted\" style=\"margin-top:12px\">Punti totali: <b>${GAME.xp}</b> · Livello: <b>${esc(gameLevel().cur.name)}</b></p></div>`;\n    h += `<div class=\"card\" id=\"secMissions\"><h2>🎯 Le tue prossime missioni</h2><p class=\"muted small\">Sfide concrete generate dalle tue aree più deboli: ogni missione completata nella vita reale migliora l’analisi (e il punteggio) della prossima volta.</p>` + renderMissions(M, healthScore) + '</div>';\n  }\n\n  // Report semplificato\n  h += `<div class=\"card\" id=\"secSimple\"><h2>📄 Report semplificato</h2>` + generateSimpleReport(M) + '</div>';\n\n  // Simulatore\n  const maxMonthly = Math.max(500, Math.min(3000, Math.ceil((M.cf.savingsM * 2 + 200) / 50) * 50));\n  h += `<div class=\"card\" id=\"secSim\"><h2>🎛️ Simulatore guidato</h2>\n    <p class=\"muted small\">Un simulatore volutamente limitato: puoi variare solo accantonamento, durata e (di poco) l’allocazione. Rendimenti prudenti e dichiarati — le curve sono stime, non previsioni.</p>\n    <div class=\"sim-controls\" id=\"simControls\">\n      <div class=\"sim-ctl\"><label>Accantonamento mensile <output id=\"simMonthlyOut\"></output></label>\n        <input type=\"range\" id=\"simMonthly\" min=\"0\" max=\"${maxMonthly}\" step=\"50\" value=\"${Math.min(maxMonthly, M.cf.savingsM)}\">\n        <div class=\"sim-note\">Il tuo risparmio attuale è ~${fmtEUR(M.cf.savingsM)}/mese</div></div>\n      <div class=\"sim-ctl\"><label>Durata del piano <output id=\"simYearsOut\"></output></label>\n        <input type=\"range\" id=\"simYears\" min=\"5\" max=\"40\" step=\"1\" value=\"${Math.min(40, Math.max(5, M.years))}\">\n        <div class=\"sim-note\">Orizzonte dichiarato: ~${M.years} anni</div></div>\n      <div class=\"sim-ctl\"><label>Allocazione azionaria <output id=\"simTiltOut\"></output></label>\n        <input type=\"range\" id=\"simTilt\" min=\"-10\" max=\"10\" step=\"5\" value=\"0\">\n        <div class=\"sim-note\">Max ±10 punti rispetto al profilo ${profLabel} (azionario base ${M.allocs[M.risk.profile].eq}%)</div></div>\n    </div>\n    <div class=\"kpis\" id=\"simKpis\"></div>\n    <div id=\"simMsg\"></div>\n    <div id=\"simChart\"></div></div>`;\n\n  // Allocazioni\n  h += `<div class=\"card\" id=\"secAlloc\"><h2>🥧 Tre allocazioni indicative</h2>` + renderAllocations(M) + '</div>';\n\n  // Report avanzato\n  h += `<div class=\"card\" id=\"secAdv\"><h2>📈 Report avanzato</h2>` + generateAdvancedReport(M) + '</div>';\n\n  // Tips\n  h += `<div class=\"card\" id=\"secTips\"><h2>💡 Tips &amp; Tricks — Principi guida</h2><p class=\"muted small\">Sintesi operative ispirate alla letteratura finanziaria: ogni scheda indica la fonte per approfondire.</p>` + generateTipsAndTricks() + '</div>';\n\n  // Limiti e prossimi passi\n  h += `<div class=\"card\" id=\"secLimits\"><h2>🧭 Limiti di questa analisi e prossimi passi</h2>\n    <h3>Cosa questo strumento NON fa</h3>\n    <ul class=\"clean small\">\n      <li>Non è consulenza finanziaria, assicurativa, fiscale o legale personalizzata.</li>\n      <li>Usa valori centrali dei range e ipotesi semplificate: non conosce contratti, tasse, costi reali dei tuoi prodotti.</li>\n      <li>Non modella inflazione puntuale, sequenza dei rendimenti, eventi di vita (separazioni, eredità, spese sanitarie straordinarie).</li>\n      <li>Non analizza coperture professionali o aziendali: per le responsabilità qualificate serve una verifica dedicata.</li>\n      <li>Le simulazioni non sono previsioni: i mercati possono fare molto peggio (e meglio) degli scenari mostrati.</li>\n    </ul>\n    <h3>Prossimi passi suggeriti</h3>\n    <ul class=\"clean small\">\n      <li>Stampa o salva in PDF questo report e portalo a un <b>consulente finanziario abilitato</b> e a un <b>intermediario assicurativo</b>: sarà una base di discussione già strutturata.</li>\n      <li>Rifai l’analisi 1–2 volte l’anno o dopo eventi importanti (figli, casa, cambio lavoro).</li>\n      <li>Verifica per prime le aree rosse del semaforo, poi le gialle.</li>\n    </ul>\n    <p class=\"muted small\" style=\"margin-top:10px\">🔒 Promemoria privacy: i dati restano su questo dispositivo finché non vengono inviati all'agenzia; dopo l'invio vengono cancellati.</p></div>`;\n\n  byId('resultsBody').innerHTML = h;\n  updateSimulator();\n  window.scrollTo(0, 0);\n}\n\n/* ============================================================\n   EVENT DELEGATION (compatibilità iOS/Safari e visualizzatori\n   che bloccano i gestori inline onclick/onchange)\n   ============================================================ */\ndocument.addEventListener('click', function(e){\n  const t = e.target.closest ? e.target.closest('[data-action],[data-goto]') : null;\n  if (!t) return;\n  if (t.hasAttribute('data-goto')){ gotoStep(+t.getAttribute('data-goto')); return; }\n  const a = t.getAttribute('data-action');\n  if (a === 'start') startWizard();\n  else if (a === 'prev') prevStep();\n  else if (a === 'next') nextStep();\n  else if (a === 'print') window.print();\n  else if (a === 'restart') restart();\n});\ndocument.addEventListener('change', function(e){\n  const el = e.target;\n  if (el.id === 'gameToggle'){ GAME.enabled = el.checked; updateXPBar(); return; } // partecipazione volontaria\n  if (el.tagName === 'SELECT' && el.hasAttribute('data-q')) setAnswer(el.getAttribute('data-q'), el.value);\n  else if (el.type === 'radio' && el.hasAttribute('data-q')) setAnswer(el.getAttribute('data-q'), el.value);\n  else if (el.type === 'checkbox' && el.hasAttribute('data-q')) toggleMulti(el.getAttribute('data-q'), el.getAttribute('data-v'), el.checked);\n  else if (el.hasAttribute('data-precise')) setPrecise(el.getAttribute('data-precise'), el.value);\n});\ndocument.addEventListener('input', function(e){\n  const el = e.target;\n  if (el.type === 'range' && (el.id === 'simMonthly' || el.id === 'simYears' || el.id === 'simTilt')) updateSimulator();\n});\n\n// Se questo codice viene eseguito, il JavaScript è attivo: nascondi l'avviso\n(function(){ const w = byId('jsWarn'); if (w) w.style.display = 'none'; })();\n\n/* ============ PONTE CON BUSSOLA (aggiunto in fase di composizione) ============ */\n(function(){\n  const avvisa = (evento, dati) => { try { parent.postMessage(Object.assign({ bussola: \"mfo\", evento }, dati || {}), \"*\"); } catch (e) {} };\n  const pulisci = t => String(t == null ? \"\" : t).replace(/[\\u{1F000}-\\u{1FFFF}\\u{2600}-\\u{27BF}\\u{2B00}-\\u{2BFF}️‍]/gu, \"\").replace(/\\s+/g, \" \").trim();\n  /* dentro Bussola la pagina non scorre da sola: chiede all'app di tornare in cima */\n  window.scrollTo = function(){ avvisa(\"inCima\"); };\n  const avvolgi = (nome, evento) => {\n    const orig = window[nome]; if (typeof orig !== \"function\") return;\n    window[nome] = function(){ const r = orig.apply(this, arguments); avvisa(evento); return r; };\n  };\n  [\"setAnswer\", \"setPrecise\", \"toggleMulti\", \"nextStep\", \"prevStep\", \"gotoStep\", \"startWizard\"].forEach(n => avvolgi(n, \"cambio\"));\n  avvolgi(\"showResults\", \"risultati\");\n  avvolgi(\"restart\", \"ricomincia\");\n\n  window.__bussola = {\n    stato(){ return { A: JSON.parse(JSON.stringify(A)), passo: currentStep, risultati: !byId(\"results\").hidden, iniziato: byId(\"intro\").hidden }; },\n    ripristina(st){\n      if (!st || !st.A) return;\n      A = st.A;\n      if (st.risultati) { try { showResults(); return; } catch (e) {} }\n      if (st.iniziato) { byId(\"intro\").hidden = true; byId(\"wizard\").hidden = false; currentStep = Math.min(st.passo || 0, STEPS.length - 1); renderStep(); }\n    },\n    preimposta(d){\n      if (d.eta != null && !A.eta) {\n        const e = d.eta; A.eta = e < 30 ? \"u30\" : e < 40 ? \"30_39\" : e < 50 ? \"40_49\" : e < 60 ? \"50_59\" : e < 70 ? \"60_69\" : \"70p\";\n      }\n    },\n    sintesi(){\n      return QUESTIONS.filter(q => isVisible(q) && isAnswered(q))\n        .map(q => ({ sez: pulisci(SECTION_TITLES[q.step] || q.step), dom: pulisci(q.label), risp: pulisci(labelOf(q.id)) }));\n    },\n    risultati(){\n      const M = computeAll();\n      const prof = { conservativo: \"Prudente\", bilanciato: \"Bilanciato\", dinamico: \"Dinamico\" }[M.risk.profile];\n      return {\n        punteggio: computeHealthScore(M.lights), percorso: M.tierLabel,\n        patrimonioNetto: M.nw.netWorth, reddito: M.cf.income, risparmioAnno: M.cf.savingsY, tassoRisparmio: M.cf.savingsRate,\n        mesiEmergenza: M.ef.months, rateSuReddito: M.debt.rateOnIncome, investibile: M.investable,\n        profilo: prof, avvisiProfilo: (M.risk.warnings || []).map(pulisci),\n        obiettivo: pulisci(M.goalLabel), importoObiettivo: M.goal, anni: M.years,\n        proiezione: { prudente: M.projLow.final, base: M.projBase.final, favorevole: M.projHigh.final },\n        semafori: M.lights.map(l => ({ nome: pulisci(l.name), livello: l.level, perche: pulisci(l.why) })),\n        coperture: M.ins.gaps.map(g => ({ area: pulisci(g.area), livello: g.level, perche: pulisci(g.why) }))\n      };\n    }\n  };\n  /* comunica l'altezza della pagina, così l'app mostra tutto senza doppie barre di scorrimento */\n  const misura = () => avvisa(\"altezza\", { h: Math.ceil(document.documentElement.scrollHeight) });\n  if (window.ResizeObserver) new ResizeObserver(misura).observe(document.body);\n  window.addEventListener(\"load\", misura);\n  avvisa(\"pronto\");\n})();\n<\/script>\n</body>\n</html>\n";

/* =====================================================================
   CODICE FISCALE: controllo e dati ricavabili (sesso, data e luogo di nascita)
   e verifica di coerenza con nome e cognome.
   ===================================================================== */

const CF_OMOCODIA = "LMNPQRSTUV";          // cifre sostituite in caso di omocodia: L=0 … V=9
const CF_MESI = "ABCDEHLMPRST";            // A=gennaio … T=dicembre
const CF_POS_NUMERICHE = [6, 7, 9, 10, 12, 13, 14];

let _luoghi = null;
function luogoDaCodice(cod) {
  if (!_luoghi) {
    _luoghi = {};
    for (const x of LUOGHI_CF.split(";")) { const [n, p] = x.slice(4).split("|"); _luoghi[x.slice(0, 4)] = { nome: n, prov: p }; }
  }
  return _luoghi[cod] || null;
}

function cfPulito(v) { return String(v || "").replace(/\s/g, "").toUpperCase(); }

/* Riporta le cifre sostituite per omocodia alla forma normale */
function cfNormalizza(cf) {
  const a = cf.split("");
  for (const i of CF_POS_NUMERICHE) { const k = CF_OMOCODIA.indexOf(a[i]); if (k >= 0) a[i] = String(k); }
  return a.join("");
}

function cfCarattereControllo(primi15) {
  const DISP = { 0: 1, 1: 0, 2: 5, 3: 7, 4: 9, 5: 13, 6: 15, 7: 17, 8: 19, 9: 21, A: 1, B: 0, C: 5, D: 7, E: 9, F: 13, G: 15, H: 17, I: 19, J: 21, K: 2, L: 4, M: 18, N: 20, O: 11, P: 3, Q: 6, R: 8, S: 12, T: 14, U: 16, V: 10, W: 22, X: 25, Y: 24, Z: 23 };
  let s = 0;
  for (let i = 0; i < 15; i++) {
    const ch = primi15[i];
    if (i % 2 === 0) s += DISP[ch];
    else s += /\d/.test(ch) ? Number(ch) : ch.charCodeAt(0) - 65;
  }
  return String.fromCharCode(65 + (s % 26));
}

function cfFormaPersona(cf) {
  return /^[A-Z]{6}[0-9LMNPQRSTUV]{2}[ABCDEHLMPRST][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$/.test(cf);
}

/* Esito: { tipo: "persona"|"societa"|null, valido, errore, dati } */
function analizzaCF(valoreGrezzo, oggi) {
  const cf = cfPulito(valoreGrezzo);
  if (!cf) return { tipo: null, valido: false };
  if (/^\d{11}$/.test(cf)) return { tipo: "societa", valido: true };
  if (!cfFormaPersona(cf)) return { tipo: null, valido: false, errore: "Il codice fiscale ha 16 caratteri (persona) o 11 cifre (società)" };
  if (cfCarattereControllo(cf.slice(0, 15)) !== cf[15])
    return { tipo: "persona", valido: false, errore: "L'ultimo carattere non torna: probabilmente c'è un errore di battitura" };
  const n = cfNormalizza(cf);
  const aa = Number(n.slice(6, 8)), mese = CF_MESI.indexOf(n[8]) + 1;
  let gg = Number(n.slice(9, 11));
  const sesso = gg > 40 ? "F" : "M";
  if (gg > 40) gg -= 40;
  const ora = oggi || new Date();
  /* Il codice ha solo due cifre per l'anno: "25" può essere 1925 o 2025.
     Il cliente di una polizza è un adulto, quindi se nel 2000 avrebbe meno di 16 anni si sceglie il 1900. */
  const anno = (2000 + aa) <= ora.getFullYear() - 16 ? 2000 + aa : 1900 + aa;
  const d = new Date(Date.UTC(anno, mese - 1, gg));
  if (gg < 1 || d.getUTCMonth() !== mese - 1) return { tipo: "persona", valido: false, errore: "La data di nascita contenuta nel codice non esiste" };
  const codLuogo = n.slice(11, 15);
  const luogo = luogoDaCodice(codLuogo);
  const pad = x => String(x).padStart(2, "0");
  return {
    tipo: "persona", valido: true,
    dati: {
      sesso,
      dataNascita: `${anno}-${pad(mese)}-${pad(gg)}`,
      luogoNascita: luogo ? (luogo.prov === "EE" ? luogo.nome + " (estero)" : `${luogo.nome} (${luogo.prov})`) : "",
      codLuogo, luogoTrovato: !!luogo
    }
  };
}

/* ---------- coerenza con nome e cognome ---------- */
function cfLettere(s) { return s.toUpperCase().normalize("NFD").replace(/[^A-Z]/g, ""); }
function cfConsVoc(s) { const l = cfLettere(s); return [l.replace(/[AEIOU]/g, ""), l.replace(/[^AEIOU]/g, "")]; }
function cfParteCognome(s) { const [c, v] = cfConsVoc(s); return (c + v + "XXX").slice(0, 3); }
function cfParteNome(s) { const [c, v] = cfConsVoc(s); if (c.length >= 4) return c[0] + c[2] + c[3]; return (c + v + "XXX").slice(0, 3); }

/* Il campo contiene "nome cognome" o "cognome nome": prova tutte le divisioni.
   true = coerente, false = non coerente, null = impossibile dirlo */
function cfCoerenteConNome(cf, nomeCompleto) {
  const x = cfPulito(cf);
  const parole = String(nomeCompleto || "").trim().split(/\s+/).filter(Boolean);
  if (!cfFormaPersona(x) || parole.length < 2) return null;
  const atteso = x.slice(0, 6);
  for (let i = 1; i < parole.length; i++) {
    const a = parole.slice(0, i).join(""), b = parole.slice(i).join("");
    if (cfParteCognome(b) + cfParteNome(a) === atteso) return true;   // nome cognome
    if (cfParteCognome(a) + cfParteNome(b) === atteso) return true;   // cognome nome
  }
  return false;
}

};
function regoleRC(p) { let r = REGOLE_RC[p]; return typeof r === "string" ? REGOLE_RC[r] : r; }

/* Massimali non disponibili (RD nei moduli) in base al fatturato e alla forma. */
function massimaleAmmesso(p, fatt, m, forma) {
  if (p === "mediatore") return !fatt || (fatt <= 100000 ? m === 500 : m === 750);
  if (p === "agenteImm" && forma) return m === { singolo: 260, snc: 520, srl: 1550 }[forma];
  const grp = PROFESSIONI[p] && PROFESSIONI[p].gruppo;
  if (grp !== "tecnici" || !fatt) return true;
  if (p === "perito") return !(m === 250 && fatt > 150000);
  if (m === 250 && fatt > 100000) return false;
  if (m === 250 && fatt > 50000 && p !== "geometra") return false;
  if (m === 500 && fatt > 500000) return false;
  return true;
}
const etichettaMassimale = m => m >= 1000 ? (m / 1000).toLocaleString("it-IT") + " mln" : m + " mila";

/* Quando la compagnia vuole la proposta completa (tailor made) */
function motiviProposta(r) {
  const out = [], p = P_(r), R = regoleRC(r.professione);
  if (!p) return out;
  if (p.proposta) out.push(`Per ${p.nome.toLowerCase()} la compagnia valuta sempre su proposta completa.`);
  if (R && R.fattMax && Number(r.fatturato) > R.fattMax) out.push(`Il fatturato supera ${euro(R.fattMax)}, il limite del modulo standard.`);
  const nonConf = QUESTIONARI.rcprof.passi.filter(x => x.id !== "proposta" && (!x.se || x.se(r)))
    .some(x => campiAttivi(x, r).some(c => c.tipo === "conferma" && r[c.id] === "no"));
  if (nonConf) out.push("C'è almeno una dichiarazione non confermata.");
  return out;
}

/* ------------------------------ CYBER ------------------------------ */
const dimCyber = r => {
  const f = Number(r.fatturato) || 0;
  if (!f) return null;
  if (r.tipoCyber === "studio") return f <= 2.5e6 ? "prof" : "oltre";
  if (f <= 10e6) return "pmi";
  if (f >= 250e6 && f <= 1e9) return "midcorp";

  "Capitolato speciale d'appalto allegato al preliminare di vendita (se ci sono le estensioni)", "Esito finale (report) del controllore tecnico, se la compagnia lo chiede"];

const listaDocEdile = r => {
  const k = r._prodotto === "edile-rc" ? (r.ruoloRC === "committente" ? "committente" : "impresa") : "car";
  return DOC_EDILE[k].filter(d => !d.se || d.se(r));
};
const docMancanti = r => listaDocEdile(r).filter(d => !(r.docConsegnati || []).includes(d.v));

/* Testo pronto da mandare al cliente (email, WhatsApp…) con i documenti che mancano */
function messaggioDocumenti(r, profilo) {
  const m = docMancanti(r);
  const prodotto = r._prodotto === "edile-rc" ? (r.ruoloRC === "committente" ? "la responsabilità civile del committente" : "la responsabilità civile dell'impresa")
    : r.coperturaEd === "postuma" ? "la polizza decennale postuma" : r.coperturaEd === "entrambe" ? "le polizze CAR e decennale postuma" : "la polizza CAR (tutti i rischi del cantiere)";
  const saluto = r.referente ? `Gentile ${r.referente}` : r.nome ? `Gentile ${r.nome}` : "Buongiorno";
  const firma = [profilo && profilo.nome, AGENZIA.nome, profilo && profilo.tel].filter(Boolean).join("\n");
  if (!m.length) return `${saluto},\nabbiamo tutto il necessario per il preventivo per ${prodotto}. Vi aggiorniamo appena abbiamo le quotazioni.\n\nCordiali saluti\n${firma}`;
  const cantiere = r.luogoOpere ? ` (cantiere di ${r.luogoOpere})` : "";
  return `${saluto},\nper preparare il preventivo per ${prodotto}${cantiere} le compagnie ci chiedono questi documenti:\n\n${m.map(d => "- " + d.t).join("\n")}\n\nPuò inviarceli rispondendo a questo messaggio, anche in PDF o in foto leggibili. Se qualcosa non è ancora disponibile, ci dica quando pensa di averlo.\n\nGrazie e cordiali saluti\n${firma}`;
}
