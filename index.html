/* ---- 30_logica.js ---- */
/* =====================================================================
   LOGICA: memoria locale, pratiche, visibilità dei campi, controlli.
   Nessun riferimento all'interfaccia qui dentro.
   ===================================================================== */

/* ---------- memoria locale protetta: se il browser la blocca, si lavora in RAM ---------- */
const Memoria = (() => {
  let ok = false, ram = {};
  try { const k = "__prova__"; localStorage.setItem(k, "1"); localStorage.removeItem(k); ok = true; } catch (e) { ok = false; }
  return {
    disponibile: () => ok,
    leggi(chiave, predefinito) {
      try { const s = ok ? localStorage.getItem(chiave) : ram[chiave]; return s == null ? predefinito : JSON.parse(s); }
      catch (e) { return predefinito; }
    },
    scrivi(chiave, valore) {
      const s = JSON.stringify(valore);
      try { if (ok) localStorage.setItem(chiave, s); else ram[chiave] = s; } catch (e) { ram[chiave] = s; }
    },
    togli(chiave) { try { if (ok) localStorage.removeItem(chiave); } catch (e) {} delete ram[chiave]; }
  };
})();

/* ---------- pratiche (bozze non ancora inviate) ---------- */
const Pratiche = {
  tutte() { return Memoria.leggi("bussola.pratiche", []); },
  salva(p) {
    p.aggiornata = Date.now();
    const elenco = this.tutte().filter(x => x.id !== p.id);
    elenco.unshift(p);
    Memoria.scrivi("bussola.pratiche", elenco);
  },
  elimina(id) { Memoria.scrivi("bussola.pratiche", this.tutte().filter(x => x.id !== id)); Allegati.eliminaPratica(id); },
  pulisciVecchie() {
    const limite = Date.now() - AGENZIA.giorniConservazioneBozze * 864e5;
    const restano = this.tutte().filter(x => (x.aggiornata || 0) > limite);
    Memoria.scrivi("bussola.pratiche", restano);
    Allegati.tieniSolo(restano.map(x => x.id));   // cancella anche i file delle pratiche scadute
  },
  nuova(tipo, questionario) {
    return { id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), tipo, questionario, passo: 0, risposte: {}, creata: Date.now() };
  }
};

/* ---------- allegati (foto e file): nel database del browser, con ripiego in RAM ----------
   I file non stanno nella memoria semplice (troppo piccola): si usa IndexedDB, il database
   interno del browser. Se non è disponibile, restano solo finché la pagina è aperta.        */
const Allegati = (() => {
  const ram = new Map();
  let dbProm = null;
  function db() {
    if (dbProm) return dbProm;
    dbProm = new Promise(ok => {
      try {
        const req = indexedDB.open("bussola", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("file", { keyPath: "id" });
        req.onsuccess = () => ok(req.result);
        req.onerror = () => ok(null);
      } catch (e) { ok(null); }
    });
    return dbProm;
  }
  async function op(modo, fn) {
    const d = await db(); if (!d) return null;
    return new Promise(ok => {
      try { const tx = d.transaction("file", modo); const r = fn(tx.objectStore("file")); tx.oncomplete = () => ok(r && r.result); tx.onerror = () => ok(null); }
      catch (e) { ok(null); }
    });
  }
  return {
    async salva(pratica, blob, nome) {
      const rec = { id: "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), pratica, blob, nome, tipo: blob.type, dim: blob.size };
      ram.set(rec.id, rec);
      await op("readwrite", st => st.put(rec));
      return { id: rec.id, nome, tipo: blob.type, dim: blob.size };
    },
    async leggi(id) { if (ram.has(id)) return ram.get(id).blob; const r = await op("readonly", st => st.get(id)); return r ? r.blob : null; },
    async elimina(id) { ram.delete(id); await op("readwrite", st => st.delete(id)); },
    async eliminaPratica(pratica) { return this.tieniSolo(Pratiche.tutte().map(x => x.id).filter(x => x !== pratica)); },
    async tieniSolo(praticheValide) {
      const ok = new Set(praticheValide);
      for (const [k, v] of ram) if (!ok.has(v.pratica)) ram.delete(k);
      const tutti = (await op("readonly", st => st.getAll())) || [];
      for (const f of tutti) if (!ok.has(f.pratica)) await op("readwrite", st => st.delete(f.id));
    }
  };
})();

/* Riduce le foto (max 1800 px, JPEG) per non appesantire le email; i PDF restano come sono. */
async function preparaFile(file) {
  const MAX_MB = 10;
  if (!/^image\//.test(file.type)) {
    if (file.type !== "application/pdf") throw new Error("Formato non supportato: usa una foto o un PDF");
    if (file.size > MAX_MB * 1048576) throw new Error(`Il PDF supera ${MAX_MB} MB`);
    return { blob: file, nome: file.name };
  }
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.82));
    if (blob && blob.size < file.size) return { blob, nome: file.name.replace(/\.[^.]+$/, "") + ".jpg" };
  } catch (e) { /* se il browser non sa ridurla, si tiene l'originale */ }
  if (file.size > MAX_MB * 1048576) throw new Error(`La foto supera ${MAX_MB} MB`);
  return { blob: file, nome: file.name };
}

/* ---------- questionario: valori calcolati ---------- */
function valore(x, r) { return typeof x === "function" ? x(r) : x; }

function figliAperti(c, r) {
  if (!c.figli) return false;
  const q = c.figli.quando, v = r[c.id];
  return typeof q === "function" ? !!q(v, r) : v === q;
}

function campoVisibile(c, r) { return !c.se || !!c.se(r); }

/* Campi di un passo effettivamente visibili, figli compresi (per controlli e riepilogo) */
function campiAttivi(passo, r) {
  const out = [];
  (function giro(lista) {
    for (const c of lista) {
      if (!campoVisibile(c, r)) continue;
      out.push(c);
      if (figliAperti(c, r)) giro(c.figli.campi);
    }
  })(passo.campi);
  return out;
}

function passiVisibili(q, r) { return q.passi.filter(p => (!p.se || p.se(r)) && campiAttivi(p, r).length > 0); }

function vuoto(v) { return v == null || v === "" || v === false || (Array.isArray(v) && v.length === 0); }

/* Restituisce { idCampo: "messaggio" } per i campi obbligatori mancanti o non validi */
function controllaPasso(passo, r) {
  const errori = {};
  for (const c of campiAttivi(passo, r)) {
    const v = r[c.id];
    if (valore(c.obbl, r) && vuoto(v)) { errori[c.id] = c.msgObbl || (c.tipo === "mfo" ? "Completa l'analisi fino alla pagina dei risultati" : "Risposta necessaria"); continue; }
    if (c.verifica && !vuoto(v)) { const m = c.verifica(v, r); if (m) { errori[c.id] = m; continue; } }
    if (!vuoto(v) && c.tipo === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) errori[c.id] = "Indirizzo non valido";
    if (!vuoto(v) && c.tipo === "tel") { const n = String(v).replace(/[\s\-\/.()]/g, ""); if (!/^\+?\d{6,15}$/.test(n)) errori[c.id] = "Numero non valido: solo cifre, eventualmente con + davanti"; }
    if (!vuoto(v) && c.id === "piva" && !/^\d{11}$/.test(String(v).replace(/\s/g, ""))) errori[c.id] = "La partita IVA ha 11 cifre";
    if (!vuoto(v) && c.id === "cf") { const e = analizzaCF(v); if (!e.valido) errori[c.id] = e.errore; }
    if (c.tipo === "scelta" && !vuoto(v)) {
      const opz = valore(c.opzioni, r) || [];
      if (!opz.some(o => o.v === v)) errori[c.id] = "Scelta non più valida: riseleziona";
    }
  }
  /* Gruppi "almeno uno": basta compilarne uno (es. partita IVA o codice fiscale) */
  const gruppi = {};
  for (const c of campiAttivi(passo, r)) if (c.almenoUno) (gruppi[c.almenoUno] = gruppi[c.almenoUno] || []).push(c);
  for (const lista of Object.values(gruppi)) {
    if (lista.every(c => vuoto(r[c.id]))) {
      for (const c of lista) errori[c.id] = errori[c.id] || "Compila almeno uno tra " + lista.map(x => valore(x.dom, r)).join(" e ");
    }
  }
  return errori;
}


/* Segnalazioni per il backoffice: dichiarazioni non confermate, fuori soglia, compliance */
function segnalazioni(q, r) {
  const out = [];
  for (const p of passiVisibili(q, r)) for (const c of campiAttivi(p, r)) {
    const v = r[c.id];
    if (c.tipo === "conferma" && v === "no") out.push({ livello: "rosso", testo: "Non confermato: " + valore(c.dom, r) });
    if (c.avviso && !vuoto(v)) { const a = c.avviso(c.tipo === "euro" ? Number(v) : v, r); if (a) out.push(a); }
    if (c.tipo === "sino" && v === "no" && c.avvisoNo) out.push({ livello: c.avvisoNo.livello, testo: c.avvisoNo.testo });
    if (c.avvisoSe) { const a = c.avvisoSe(v, r); if (a) out.push({ livello: a.livello, testo: valore(c.dom, r) + ": " + a.testo }); }
  }
  return out;
}

/* IBAN: controllo internazionale (ISO 13616, resto della divisione per 97) */
function ibanValido(v) {
  const x = String(v || "").replace(/\s/g, "").toUpperCase();
  if (!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(x)) return false;
  if (x.startsWith("IT") && x.length !== 27) return false;
  const num = (x.slice(4) + x.slice(0, 4)).replace(/[A-Z]/g, c => String(c.charCodeAt(0) - 55));
  let resto = 0;
  for (const cifra of num) resto = (resto * 10 + Number(cifra)) % 97;
  return resto === 1;
}

/* Campi con valori "suggeriti" (es. garanzie consigliate in base alle risposte):
   si aggiornano da soli finché il commerciale non li modifica a mano. */
function stessoInsieme(a, b) { return Array.isArray(a) && Array.isArray(b) && a.length === b.length && a.every(x => b.includes(x)); }
function applicaSuggeriti(passo, r) {
  r._sugg = r._sugg || {};
  /* più giri: un suggerimento può far comparire un altro campo suggerito (sezioni → garanzie) */
  const fatti = new Set();
  for (let giro = 0; giro < 4; giro++) {
    let nuoviCampi = false;
    for (const c of campiAttivi(passo, r)) {
      if (!c.suggerito || fatti.has(c.id)) continue;
      fatti.add(c.id); nuoviCampi = true;
      const nuovo = c.suggerito(r), prec = r._sugg[c.id];
      if (r[c.id] === undefined || stessoInsieme(r[c.id], prec)) r[c.id] = nuovo.slice();
      r._sugg[c.id] = nuovo;
    }
    if (!nuoviCampi) break;
  }
}

/* ---------- riepilogo strutturato: sezioni con domanda e risposta ---------- */
function testoRisposta(c, v, r) {
  if (vuoto(v)) return "";
  switch (c.tipo) {
    case "sino": return v === "si" ? "Sì" : "No";
    case "flag": return v === true ? "Sì" : "No";
    case "conferma": return v === "si" ? "Confermo" : "NON CONFERMO";
    case "euro": return euro(v);
    case "data": { const [a, m, g] = String(v).split("-"); return g ? `${g}/${m}/${a}` : v; }
    case "scelta": { const o = (valore(c.opzioni, r) || []).find(x => x.v === v); return o ? o.t : v; }
    case "multipla": { const o = valore(c.opzioni, r) || []; return v.map(x => (o.find(z => z.v === x) || { t: x }).t).join(", "); }
    case "allegato": return v.map(f => f.nome).join(", ");
    case "consenso": return v === "si" ? "Acconsento" : "Non acconsento";
    case "firma": return v && v.quando ? "Firmata sul dispositivo il " + new Date(v.quando).toLocaleString("it-IT", { dateStyle: "short", timeStyle: "short" }) : "";
    default: return String(v);
  }
}

function titoloPratica(p) {
  const s = p.prodotto && percorsoNodo(p.prodotto);
  return s ? s[s.length - 1].nome : QUESTIONARI[p.questionario].titolo;
}

function costruisciRiepilogo(p) {
  const q = QUESTIONARI[p.questionario], r = p.risposte;
  const sezioni = passiVisibili(q, r).map(passo => ({
    titolo: passo.titolo,
    righe: campiAttivi(passo, r).filter(c => (c.tipo === "info") || (!["allegato", "mfo"].includes(c.tipo) && !vuoto(r[c.id])))
      .map(c => c.tipo === "info"
        ? { dom: valore(c.dom, r), risp: (valore(c.elenco, r) || []).join("; ") }
        : { dom: valore(c.dom, r), risp: testoRisposta(c, r[c.id], r), grave: c.tipo === "conferma" && r[c.id] === "no" })
  })).filter(s => s.righe.length);
  /* Analisi patrimoniale: risposte raggruppate e risultati principali */
  if (r.mfo && passiVisibili(q, r).some(x => x.campi.some(c => c.tipo === "mfo"))) {
    const k = sezioni.findIndex(x => x.titolo === "Cliente") + 1;
    const M = r.mfo.risultati, pct = x => Math.round((x || 0) * 100) + "%";
    const livello = l => l === "r" ? "Critico" : l === "y" ? "Da migliorare" : "Buono";
    const extra = [{
      titolo: "Analisi patrimoniale: risultati",
      righe: [
        { dom: "Indice di salute finanziaria", risp: M.punteggio + "/100" },
        { dom: "Patrimonio netto stimato", risp: euro(Math.round(M.patrimonioNetto)) },
        { dom: "Reddito annuo netto", risp: euro(Math.round(M.reddito)) },
        { dom: "Risparmio annuo", risp: `${euro(Math.round(M.risparmioAnno))} (${pct(M.tassoRisparmio)})` },
        { dom: "Liquidità di emergenza", risp: Math.round(M.mesiEmergenza) + " mesi di spese" },
        { dom: "Rate sul reddito", risp: pct(M.rateSuReddito) },
        { dom: "Profilo di rischio", risp: M.profilo + (M.avvisiProfilo.length ? " — " + M.avvisiProfilo.join(" ") : "") },
        { dom: "Obiettivo", risp: `${M.obiettivo}: ${euro(Math.round(M.importoObiettivo))} in ${M.anni} anni` },
        { dom: "Proiezione (prudente / base / favorevole)", risp: [M.proiezione.prudente, M.proiezione.base, M.proiezione.favorevole].map(x => euro(Math.round(x))).join(" / ") },
        { dom: "Percorso di analisi", risp: M.percorso }
      ].concat(M.semafori.map(l => ({ dom: l.nome, risp: `${livello(l.livello)}: ${l.perche}`, grave: l.livello === "r" })))
    }, {
      titolo: "Analisi patrimoniale: coperture da valutare",
      righe: M.coperture.filter(g => g.livello !== "g").map(g => ({ dom: g.area, risp: `${livello(g.livello)}: ${g.perche}`, grave: g.livello === "r" }))
    }];
    const gruppi = {};
    for (const x of r.mfo.sintesi) (gruppi[x.sez] = gruppi[x.sez] || []).push({ dom: x.dom, risp: x.risp });
    Object.entries(gruppi).forEach(([sez, righe]) => extra.push({ titolo: "Analisi patrimoniale: " + sez.toLowerCase(), righe }));
    sezioni.splice(k, 0, ...extra.filter(x => x.righe.length));
  }
  /* Nota per il backoffice: per ogni garanzia scelta, quali compagnie la offrono (dai DIP) */
  const mappa = [];
  for (const passo of passiVisibili(q, r)) for (const c of campiAttivi(passo, r)) {
    if (c.tipo !== "multipla" || !Array.isArray(r[c.id])) continue;
    for (const v of r[c.id]) {
      const o = (valore(c.opzioni, r) || []).find(x => x.v === v);
      if (o && (o.comp || o.rif)) mappa.push({ dom: (o.g ? o.g + " · " : "") + o.t, risp: [(o.comp || []).map(x => NOME_COMP[x] || x).join(", "), o.rif].filter(Boolean).join(" — ") });
    }
  }
  if (mappa.length) sezioni.push({ titolo: "Per il backoffice: compagnie che offrono le garanzie scelte (indicativo, dai DIP)", righe: mappa, soloBackoffice: true });
  const allegati = [];
  for (const passo of passiVisibili(q, r)) for (const c of campiAttivi(passo, r))
    if (c.tipo === "allegato" && Array.isArray(r[c.id])) for (const f of r[c.id]) allegati.push({ ...f, voce: valore(c.dom, r) });
  const strada = p.prodotto ? (percorsoNodo(p.prodotto) || []).map(n => n.nome).join(" › ") : "";
  return {
    tipo: p.tipo === "sinistro" ? "Denuncia di sinistro" : "Richiesta di preventivo",
    prodotto: titoloPratica(p), strada,
    cliente: r.nome || "Cliente senza nome",
    data: new Date(),
    segnalazioni: segnalazioni(q, r),
    sezioni, allegati
  };
}

function nomeFile(p, est) {
  const pul = s => String(s).normalize("NFD").replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-");
  const oggi = new Date().toISOString().slice(0, 10);

const PDF_LARG = {

  b: [278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584]
};
const PDF_SPECIALI = { "€": 0x80, "‚": 0x82, "„": 0x84, "…": 0x85, "‘": 0x91, "’": 0x92, "“": 0x93, "”": 0x94, "•": 0x95, "–": 0x96, "—": 0x97, "›": 0x9B, "‹": 0x8B, "™": 0x99 };

/* Converte il testo nella codifica del carattere PDF (WinAnsi); lettere accentate comprese */
function pdfCodifica(s) {
  let out = "";
  for (const ch of String(s)) {
    const c = ch.charCodeAt(0), cp = ch.codePointAt(0);
    if (cp > 0xFFFF || (cp >= 0x2190 && cp <= 0x2BFF && !PDF_SPECIALI[ch]) || cp === 0xFE0F || cp === 0x200D) continue;   // emoji e simboli: non stampabili in Helvetica
    if (PDF_SPECIALI[ch]) out += String.fromCharCode(PDF_SPECIALI[ch]);
    else if (c >= 32 && c < 127) out += ch;
    else if (c >= 160 && c < 256) out += ch;
    else if (ch === "\t") out += " ";
    else { const base = ch.normalize("NFD")[0]; out += base.charCodeAt(0) < 127 ? base : "?"; }
  }
  return out;
}
function pdfLarghezza(s, grassetto, corpo) {
  const t = grassetto ? PDF_LARG.b : PDF_LARG.n; let w = 0;
  for (const ch of pdfCodifica(s)) {
    let c = ch.charCodeAt(0);
    if (c >= 192) c = ch.normalize("NFD").charCodeAt(0);         // accentate: larghezza della lettera base
    w += (c >= 32 && c <= 126) ? t[c - 32] : 556;
  }
  return w * corpo / 1000;
}
function pdfACapo(testo, larghezza, grassetto, corpo) {
  const righe = [];
  for (const paragrafo of String(testo).split("\n")) {
    let riga = "";
    for (const parola of paragrafo.split(/\s+/)) {
      if (!parola) continue;
      const prova = riga ? riga + " " + parola : parola;
      if (pdfLarghezza(prova, grassetto, corpo) <= larghezza) { riga = prova; continue; }
      if (riga) righe.push(riga);
      /* parola più lunga della riga (es. un indirizzo email): si spezza a forza */
      let pz = parola;
      while (pdfLarghezza(pz, grassetto, corpo) > larghezza) {
        let k = pz.length; while (k > 1 && pdfLarghezza(pz.slice(0, k), grassetto, corpo) > larghezza) k--;
        righe.push(pz.slice(0, k)); pz = pz.slice(k);
      }
      riga = pz;
    }
    righe.push(riga);
  }
  return righe;
}
const pdfEsc = s => pdfCodifica(s).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)");

/* Crea il PDF del riepilogo. Restituisce un Blob "application/pdf". */
function creaPDF(p, commerciale) {
  const R = costruisciRiepilogo(p);
  const W = 595.28, H = 841.89, M = 42, LARGH = W - 2 * M;
  const BLU = "0.161 0.302 0.584", GRIGIO = "0.36 0.40 0.45", NERO = "0.16 0.16 0.16";
  const pagine = []; let ops = [], y = 0;

  function nuovaPagina() {
    ops = []; pagine.push(ops); y = H - M;
    if (pagine.length === 1) {
      if (LOGO_JPG) ops.push(`q 96 0 0 60 ${M} ${y - 60} cm /Logo Do Q`);
      testo(R.tipo.toUpperCase(), M + 112, y - 16, true, 9, BLU);
      testo(R.prodotto, M + 112, y - 36, true, 18, NERO);
      testo(R.strada, M + 112, y - 52, false, 9, GRIGIO);
      y -= 76;
      linea(M, y, W - M, y, "0.85 0.89 0.94", 1);
      y -= 18;
      const dataTxt = R.data.toLocaleDateString("it-IT") + " " + R.data.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
      coppia("Cliente", R.cliente, true);
      coppia("Data", dataTxt);
      coppia("Commerciale", [commerciale.nome, commerciale.email, commerciale.tel].filter(Boolean).join(" · ") || "-");
      y -= 6;
    } else {
      testo(`${R.prodotto} · ${R.cliente}`, M, y - 8, false, 8, GRIGIO); y -= 24;
    }
  }
  function testo(t, x, yy, b, corpo, colore) { if (t) ops.push(`BT /${b ? "F2" : "F1"} ${corpo} Tf ${colore || NERO} rg ${x.toFixed(2)} ${yy.toFixed(2)} Td (${pdfEsc(t)}) Tj ET`); }
  function linea(x1, y1, x2, y2, colore, sp) { ops.push(`${colore} RG ${sp} w ${x1} ${y1.toFixed(2)} m ${x2} ${y2.toFixed(2)} l S`); }
  function rett(x, yy, w, h, colore) { ops.push(`${colore} rg ${x} ${yy.toFixed(2)} ${w} ${h.toFixed(2)} re f`); }
  function spazio(h) { if (y - h < M + 20) nuovaPagina(); }
  function coppia(dom, risp, grassetto) {
    const colDom = 150, righeR = pdfACapo(risp, LARGH - colDom - 8, !!grassetto, 10), righeD = pdfACapo(dom, colDom - 8, false, 9);
    const h = Math.max(righeR.length * 13, righeD.length * 11.5) + 5;
    spazio(h);
    righeD.forEach((t, i) => testo(t, M, y - 10 - i * 11.5, false, 9, GRIGIO));
    righeR.forEach((t, i) => testo(t, M + colDom, y - 10 - i * 13, !!grassetto, 10, NERO));
    y -= h;
  }
  function titoloSezione(t) {
    spazio(75); y -= 10;   /* il titolo non resta mai da solo in fondo alla pagina */
    rett(M, y - 20, LARGH, 20, "0.914 0.933 0.969");
    testo(t, M + 8, y - 14, true, 11, BLU); y -= 28;
  }

  nuovaPagina();
  if (R.segnalazioni.length) {
    titoloSezione("Da verificare");
    for (const s of R.segnalazioni) {
      const righe = pdfACapo(s.testo, LARGH - 16, false, 9.5), h = righe.length * 12.5 + 6;
      spazio(h);
      const col = s.livello === "rosso" ? "0.64 0.15 0.17" : s.livello === "ambra" ? "0.60 0.36 0" : BLU;
      rett(M, y - h + 3, 3, h - 4, col);
      righe.forEach((t, i) => testo(t, M + 10, y - 10 - i * 12.5, false, 9.5, col));
      y -= h;
    }
  }
  for (const s of R.sezioni) {
    titoloSezione(s.titolo);
    for (const x of s.righe) coppia(x.dom, x.risp, x.grave);
  }
  if (R.allegati.length) {
    titoloSezione(`Allegati (${R.allegati.length})`);
    for (const a of R.allegati) coppia(a.voce, `${a.nome} · ${Math.max(1, Math.round(a.dim / 1024))} KB`);
  }
  /* nota finale solo se c'è posto: non apre una pagina quasi vuota */
  if (y - 34 > M + 20) {
    y -= 14;
    for (const t of pdfACapo("Documento generato dall'app Bussola per uso interno dell'agenzia. Dopo l'invio la pratica viene cancellata dal dispositivo del commerciale.", LARGH, false, 8))
      { testo(t, M, y, false, 8, GRIGIO); y -= 10; }
  }

  /* in coda: informativa privacy firmata nell'app (stesso documento per il backoffice) */
  let immagini = {};
  const rp = p.risposte;
  if (rp.privacyModo === "app" && rp.firmaPrivacy && rp.firmaPrivacy.dati) {
    const X = paginePrivacy(rp, commerciale);
    pagine.push(...X.pagine); Object.assign(immagini, X.immagini);
  }
  if (p.questionario === "dichiarazione") {
    const X = pagineDichiarazione(rp, commerciale);
    pagine.push(...X.pagine); Object.assign(immagini, X.immagini);
  }
  /* piè di pagina con numerazione */
  pagine.forEach((o, i) => {
    o.push(`0.85 0.89 0.94 RG 0.6 w ${M} ${M - 6} m ${W - M} ${M - 6} l S`);
    o.push(`BT /F1 8 Tf ${GRIGIO} rg ${M} ${M - 18} Td (${pdfEsc(AGENZIA.nome + " · " + R.cliente + " · " + AGENZIA.app + " " + AGENZIA.versione)}) Tj ET`);
    const n = `Pagina ${i + 1} di ${pagine.length}`;
    o.push(`BT /F1 8 Tf ${GRIGIO} rg ${(W - M - pdfLarghezza(n, false, 8)).toFixed(2)} ${M - 18} Td (${n}) Tj ET`);
  });

  return scriviPDF(pagine, `${R.tipo} - ${R.prodotto} - ${R.cliente}`, W, H, immagini);
}

/* ---- scrittura del file: oggetti, tabella xref, trailer ---- */
function scriviPDF(pagine, titolo, W, H, immagini) {
  const oggetti = [];
  const agg = s => { oggetti.push(s); return oggetti.length; };
  const idCatalogo = agg(null), idPagine = agg(null);
  const idF1 = agg("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  const idF2 = agg("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  let idLogo = 0;
  if (LOGO_JPG && pagine.some(o => o.some(x => x.includes("/Logo Do")))) {
    const bin = atob(LOGO_JPG.dati);
    idLogo = agg(`<< /Type /XObject /Subtype /Image /Width ${LOGO_JPG.l} /Height ${LOGO_JPG.a} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bin.length} >>\nstream\n${bin}\nendstream`);
  }
  const extra = Object.entries(immagini || {}).map(([nome, im]) => {
    const bin = atob(im.dati);
    return [nome, agg(`<< /Type /XObject /Subtype /Image /Width ${im.l} /Height ${im.a} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bin.length} >>\nstream\n${bin}\nendstream`)];
  });
  const xobj = (idLogo ? ` /Logo ${idLogo} 0 R` : "") + extra.map(([n, id]) => ` /${n} ${id} 0 R`).join("");
  const idsPagina = pagine.map(o => {
    const flusso = o.join("\n");
    const idC = agg(`<< /Length ${flusso.length} >>\nstream\n${flusso}\nendstream`);
    return agg(`<< /Type /Page /Parent ${idPagine} 0 R /MediaBox [0 0 ${W} ${H}] /Contents ${idC} 0 R /Resources << /Font << /F1 ${idF1} 0 R /F2 ${idF2} 0 R >>${xobj ? ` /XObject <<${xobj} >>` : ""} >> >>`);
  });
  oggetti[idCatalogo - 1] = `<< /Type /Catalog /Pages ${idPagine} 0 R >>`;
  oggetti[idPagine - 1] = `<< /Type /Pages /Kids [${idsPagina.map(i => i + " 0 R").join(" ")}] /Count ${idsPagina.length} >>`;
  const idInfo = agg(`<< /Title (${pdfEsc(titolo)}) /Producer (Bussola) /CreationDate (D:${new Date().toISOString().replace(/[-:T]/g, "").slice(0, 14)}) >>`);
  let out = "%PDF-1.4\n%\xE2\xE3\xCF\xD3\n";
  const pos = [];
  oggetti.forEach((o, i) => { pos.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const xref = out.length;
  out += `xref\n0 ${oggetti.length + 1}\n0000000000 65535 f \n` + pos.map(n => String(n).padStart(10, "0") + " 00000 n \n").join("");
  out += `trailer\n<< /Size ${oggetti.length + 1} /Root ${idCatalogo} 0 R /Info ${idInfo} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  const byte = new Uint8Array(out.length);
  for (let i = 0; i < out.length; i++) byte[i] = out.charCodeAt(i) & 255;
  return new Blob([byte], { type: "application/pdf" });
}

/* ---- lettera di disdetta del cliente (Documenti utili della Guida) ---- */
const TESTO_DISDETTA = [
  "Con la presente intendo presentare disdetta, a termine delle Condizioni Generali di assicurazione della polizza in oggetto, comprese eventuali successive sostituzioni della medesima.",

function dataIt(v) { const [a, m, g] = String(v || "").split("-"); return g ? `${g}/${m}/${a}` : (v || ""); }
function creaDisdettaPDF(d) {
  const W = 595.28, H = 841.89, M = 64, LARGH = W - 2 * M, NERO = "0.1 0.1 0.1";

  blocco([d.nome, d.indirizzo, d.cf ? "Codice fiscale: " + d.cf : ""].filter(Boolean), M, 260, false);

  ops.push(`0.4 0.4 0.4 RG 0.6 w ${xDest} ${y.toFixed(2)} m ${W - M} ${y.toFixed(2)} l S`);

/* ---- informativa privacy con consensi e firma del cliente (firma elettronica semplice) ----
   Le pagine si usano in tre modi: PDF per il cliente, coda del PDF per il backoffice,
   modulo in bianco da stampare (Guida). Senza firma escono caselle e righe vuote. */
function paginePrivacy(r, commerciale) {
  const F = r && r.firmaPrivacy && r.firmaPrivacy.dati ? r.firmaPrivacy : null, P = INFORMATIVA_PRIVACY;
  const W = 595.28, H = 841.89, M = 48, LARGH = W - 2 * M, BLU = "0.161 0.302 0.584", GRIGIO = "0.36 0.40 0.45", NERO = "0.12 0.12 0.12";
  const pagine = []; let ops = [], y = 0;
  const testo = (t, x, yy, b, corpo, col) => { if (t) ops.push(`BT /${b ? "F2" : "F1"} ${corpo} Tf ${col || NERO} rg ${x.toFixed(2)} ${yy.toFixed(2)} Td (${pdfEsc(t)}) Tj ET`); };
  const linea = (x1, yy, x2) => ops.push(`0.55 0.58 0.62 RG 0.6 w ${x1} ${yy.toFixed(2)} m ${x2} ${yy.toFixed(2)} l S`);
  const nuova = () => { ops = []; pagine.push(ops); y = H - M; };
  const spazio = h => { if (y - h < M + 24) nuova(); };
  const paragrafo = (t, b, corpo, col, rientro) => { for (const riga of pdfACapo(t, LARGH - (rientro || 0), b, corpo)) { spazio(corpo + 4); testo(riga, M + (rientro || 0), y - corpo, b, corpo, col); y -= corpo + 3.2; } y -= 3; };
  nuova();
  if (LOGO_JPG) ops.push(`q 80 0 0 50 ${M} ${y - 50} cm /Logo Do Q`);
  testo("INFORMATIVA E CONSENSI PRIVACY", M + 96, y - 18, true, 13, BLU);
  testo(P.titolare, M + 96, y - 34, false, 8.5, GRIGIO);
  testo("Documento " + P.versione, M + 96, y - 46, false, 8.5, GRIGIO);
  y -= 66;
  const v = r || {};
  const dati = [["Cognome e nome / ragione sociale", v.nome], ["Codice fiscale / partita IVA", [v.cf, v.piva].filter(Boolean).join(" / ")],
    ["Indirizzo", [v.indirizzo, v.citta].filter(Boolean).join(", ")], ["Telefono", v.tel], ["Email", v.email],
    ["Documento d'identità", [({ ci: "Carta d'identità", patente: "Patente", passaporto: "Passaporto" })[v.docTipo] || "", v.docNumero].filter(Boolean).join(" n. ")]];
  for (const [d, x] of dati) {
    spazio(16); testo(d, M, y - 10, false, 8.5, GRIGIO);
    if (x) testo(String(x), M + 170, y - 10, true, 9.5); else if (!F) linea(M + 170, y - 12, W - M);
    else testo("-", M + 170, y - 10, true, 9.5);
    y -= 16;
  }
  y -= 8;
  for (const sz of P.sezioni) { spazio(40); y -= 4; paragrafo(sz.titolo, true, 9, BLU); for (const par of sz.par) paragrafo(par, false, 8, NERO, par.startsWith("•") ? 8 : 0); }
  spazio(330); y -= 6; paragrafo("CONSENSO AL TRATTAMENTO DEI DATI PERSONALI", true, 9.5, BLU);   /* consensi e firma sempre sulla stessa pagina */
  paragrafo("Preso atto dell'Informativa sulla tutela dei dati personali, io sottoscritto/a", false, 8.5);
  for (const c of CONSENSI_PRIVACY) {
    const val = F ? v[c.id] : null;
    paragrafo(`[${val === "si" ? "X" : " "}] acconsento   [${val === "no" ? "X" : " "}] non acconsento   ${c.testo}`, false, 8.5, val === "no" ? "0.45 0.1 0.12" : NERO);
  }
  spazio(130); y -= 10;
  if (F) {
    const quando = new Date(F.quando);
    testo("Data " + quando.toLocaleDateString("it-IT") + " ore " + quando.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }), M, y - 10, false, 9);
    testo("Firma del cliente", M + 260, y - 10, false, 9, GRIGIO);
    const larg = 220, alt = larg * F.a / F.l;

    y -= alt + 26;

      (F.impronta ? ` Impronta di controllo (SHA-256): ${F.impronta}` : ""), false, 7.5, GRIGIO);
  } else {

    y -= 44;

    y -= 50;
  }
  return { pagine, immagini: F ? { Firma: F } : {}, W, H, M };
}
function piePrivacy(pagine, r, M, W) {
  const GRIGIO = "0.36 0.40 0.45";
  pagine.forEach((o, i) => {
    o.push(`BT /F1 7.5 Tf ${GRIGIO} rg ${M} ${M - 16} Td (${pdfEsc(AGENZIA.nome + " · " + INFORMATIVA_PRIVACY.versione + (r && r.nome ? " · " + r.nome : ""))}) Tj ET`);
    const n = `Pagina ${i + 1} di ${pagine.length}`;
    o.push(`BT /F1 7.5 Tf ${GRIGIO} rg ${(W - M - pdfLarghezza(n, false, 7.5)).toFixed(2)} ${M - 16} Td (${n}) Tj ET`);

}
function creaPrivacyPDF(p, commerciale) {
  const r = p ? p.risposte : {}, X = paginePrivacy(r, commerciale);

  return scriviPDF(X.pagine, r.nome ? `Privacy - ${r.nome}` : "Informativa privacy Lloyd Varesino", X.W, X.H, X.immagini);
}

/* ---- dichiarazione di personalizzazione della proposta (vita): pagina come il modulo dell'agenzia ---- */
function pagineDichiarazione(r, commerciale) {
  const D = DICHIARAZIONE_PERS, v = r || {}, FC = v.firmaClienteDich && v.firmaClienteDich.dati ? v.firmaClienteDich : null, FI = v.firmaIntermDich && v.firmaIntermDich.dati ? v.firmaIntermDich : null;
  const W = 595.28, H = 841.89, M = 56, LARGH = W - 2 * M, BLU = "0.161 0.302 0.584", GRIGIO = "0.36 0.40 0.45", NERO = "0.12 0.12 0.12";
  const ops = []; let y = H - M;
  const testo = (t, x, yy, b, corpo, col) => { if (t) ops.push(`BT /${b ? "F2" : "F1"} ${corpo} Tf ${col || NERO} rg ${x.toFixed(2)} ${yy.toFixed(2)} Td (${pdfEsc(t)}) Tj ET`); };
  const linea = (x1, yy, x2) => ops.push(`0.55 0.58 0.62 RG 0.6 w ${x1} ${yy.toFixed(2)} m ${x2} ${yy.toFixed(2)} l S`);
  const par = (t, b, corpo, rientro, col) => { for (const riga of pdfACapo(t, LARGH - (rientro || 0), b, corpo)) { testo(riga, M + (rientro || 0), y - corpo, b, corpo, col); y -= corpo + 3.5; } y -= 4; };
  if (LOGO_JPG) ops.push(`q 80 0 0 50 ${M} ${y - 50} cm /Logo Do Q`);
  y -= 70;
  par(D.titolo, true, 12.5, 0, BLU);
  y -= 4;
  testo("Il sottoscritto/a", M, y - 10, false, 10);
  if (v.nome) testo(v.nome, M + 90, y - 10, true, 10.5); else linea(M + 90, y - 12, W - M);
  y -= 22;
  par(D.premessa, false, 10);
  for (const p of D.punti) par("- " + p, false, 10, 6);
  y -= 4;
  testo("Numero proposta perfezionata:", M, y - 10, false, 10);
  if (v.numProposta) testo(String(v.numProposta).toUpperCase(), M + 150, y - 10, true, 10.5); else linea(M + 150, y - 12, M + 280);
  testo("Compagnia mandante:", M + 295, y - 10, false, 10);
  if (v.compagniaVita) testo(v.compagniaVita, M + 400, y - 10, true, 10); else linea(M + 400, y - 12, W - M);
  y -= 30;
  par("Motivazione della proposta di prodotto assicurativo consigliato", true, 10.5, 0, BLU);
  const scelti = v.motiviProposta || [];
  for (const [k, t] of D.motivi) {
    const x = scelti.includes(k);
    par(`[${x ? "X" : " "}]  ${t}${k === "altro" && v.motivoAltro ? " " + v.motivoAltro : ""}`, x, 9.5, 6);
    if (k === "altro" && !v.motivoAltro) { linea(M + 120, y + 6, W - M); y -= 4; }
  }
  y -= 14;
  const quando = FC ? new Date(FC.quando) : null;
  testo("Luogo e data:", M, y - 10, false, 10);
  if (v.luogoDich || quando) testo([v.luogoDich, quando && quando.toLocaleDateString("it-IT")].filter(Boolean).join(", "), M + 75, y - 10, true, 10); else linea(M + 75, y - 12, M + 260);
  y -= 34;
  const firma = (etichetta, F, nome) => {
    testo(etichetta, M, y - 10, false, 10);
    if (F) { const larg = 200, alt = larg * F.a / F.l; ops.push(`q ${larg} 0 0 ${alt.toFixed(2)} ${M + 140} ${(y - 6 - alt).toFixed(2)} cm /${nome} Do Q`); y -= Math.max(alt, 20) + 14; }
    else { linea(M + 140, y - 12, M + 360); y -= 34; }
  };
  firma("Firma del cliente:", FC, "FirmaCli");
  firma("Firma dell'intermediario:", FI, "FirmaInt");
  if (FC) {
    y -= 6;
    par(`Firme elettroniche semplici raccolte con l'app ${AGENZIA.app} il ${quando.toLocaleString("it-IT", { dateStyle: "short", timeStyle: "short" })}` +
      (commerciale && commerciale.nome ? ` sul dispositivo di ${commerciale.nome}` : "") + ` (${AGENZIA.nome}).` + (FC.impronta ? ` Impronta di controllo (SHA-256): ${FC.impronta}` : ""), false, 7.5, 0, GRIGIO);
  }
  const immagini = {}; if (FC) immagini.FirmaCli = FC; if (FI) immagini.FirmaInt = FI;
  return { pagine: [ops], immagini, W, H, M };
}
function creaDichiarazionePDF(p, commerciale) {
  const r = p ? p.risposte : null, X = pagineDichiarazione(r, commerciale);
  return scriviPDF(X.pagine, "Dichiarazione proposta personalizzata" + (r && r.nome ? " - " + r.nome : ""), X.W, X.H, X.immagini);
}

const Stato = { pila: [], pratica: null, errori: {} };

function vai(schermo, dati) {
  Stato.pila.push({ schermo, dati: dati || {} });
  try { history.pushState({ n: Stato.pila.length }, ""); } catch (e) {}
  disegna();
}
function indietro() {
  if (Stato.schermo() === "questionario" && Stato.pratica && Stato.pratica.passo > 0) {
    Stato.pratica.passo--; Stato.errori = {}; Pratiche.salva(Stato.pratica); disegna(); window.scrollTo(0, 0); return;

/* ---------- misura reale delle barre: niente altezze supposte ---------- */
function misura() {
  const r = document.documentElement.style;
  r.setProperty("--h-barra", $("#barra").offsetHeight + "px");
  const az = $("#azioni");
  r.setProperty("--h-azioni", az.hidden ? "0px" : az.offsetHeight + "px");
}

function impostaBarra(titolo, sotto, conIndietro, progresso) {
  $("#titolo").textContent = titolo;
  $("#sottotitolo").textContent = sotto || "";
  $("#btnIndietro").hidden = !conIndietro;
  $("#btnHome").hidden = !conIndietro;
  document.body.classList.toggle("interno", !!conIndietro);
  const p = $("#progresso");
  if (progresso) {
    p.hidden = false;
    p.innerHTML = Array.from({ length: progresso.totale }, (_, i) => `<i class="${i < progresso.ora ? "fatto" : i === progresso.ora ? "ora" : ""}"></i>`).join("");
  } else { p.hidden = true; p.innerHTML = ""; }
}
function impostaAzioni(html) {
  const az = $("#azioni");
  if (html) { az.hidden = false; $("#azioniRiga").innerHTML = html; } else { az.hidden = true; $("#azioniRiga").innerHTML = ""; }
}

function disegna() {
  const s = Stato.schermo();
  document.body.classList.toggle("esperto", Memoria.leggi("bussola.esperto", false) === true);
  ({ home: vistaHome, albero: vistaAlbero, questionario: vistaQuestionario, riepilogo: vistaRiepilogo, schede: vistaSchede })[s]();
  misura();
}

/* Anteprime delle foto allegate, caricate dopo il disegno della pagina */
async function caricaAnteprime() {
  for (const el of document.querySelectorAll("[data-anteprima]")) {
    if (!/^image\//.test(el.dataset.tipo) || el.firstChild) continue;
    const blob = await Allegati.leggi(el.dataset.anteprima);
    if (!blob) { el.textContent = "?"; el.title = "File non più disponibile: ricaricalo"; continue; }
    const img = new Image(); img.alt = ""; img.src = URL.createObjectURL(blob); img.onload = () => URL.revokeObjectURL(img.src);
    el.appendChild(img);
  }
}

async function aggiungiFile(idCampo, files) {
  const stato = document.querySelector(`[data-stato-file="${idCampo}"]`);
  const lista = (Stato.pratica.risposte[idCampo] || []).slice();
  const problemi = [];
  for (const f of files) {
    if (stato) stato.textContent = `Preparo ${f.name}…`;
    try { const { blob, nome } = await preparaFile(f); lista.push(await Allegati.salva(Stato.pratica.id, blob, nome)); }
    catch (e) { problemi.push(`${f.name}: ${e.message}`); }
  }
  rispondi(idCampo, lista, true);
  const st2 = document.querySelector(`[data-stato-file="${idCampo}"]`);
  if (st2 && problemi.length) { st2.textContent = problemi.join(" · "); st2.classList.add("errore"); }
}

function vistaQuestionario() {
  const p = Stato.pratica, q = QUESTIONARI[p.questionario], r = p.risposte;
  const passi = passiVisibili(q, r);
  if (p.passo >= passi.length) p.passo = passi.length - 1;
  const passo = passi[p.passo];
  applicaSuggeriti(passo, r);
  impostaBarra(titoloPratica(p), `${p.passo + 1} di ${passi.length}`, true, { totale: passi.length, ora: p.passo });
  const ultimo = p.passo === passi.length - 1;
  const passoMFO = passo.campi.some(c => c.tipo === "mfo");
  impostaAzioni(`${p.passo > 0 ? '<button class="btn secondario-largo" data-az="indietro">Indietro</button>' : ""}<button class="btn primario" data-az="avanti" ${passoMFO && !r.mfo ? "disabled" : ""}>${
    passoMFO ? (r.mfo ? "Avanti: documenti e compliance" : "Completa l'analisi per proseguire") : ultimo ? "Vai al riepilogo" : "Avanti"}</button>`);
  p.massimo = Math.max(p.massimo || 0, p.passo);
  const lato = passi.map((x, i) => `<button data-passo="${i}" class="${i === p.passo ? "ora" : i < p.passo ? "fatto" : ""}" ${i <= p.massimo ? "" : "disabled"}>
      <span class="n">${i < p.passo ? "✓" : i + 1}</span>${esc(x.titolo)}</button>`).join("");
  $("#vista").innerHTML = `<div class="layout-q"><nav class="passi-lato" aria-label="Passi">${lato}</nav><div>
    <div class="passo-titolo">${esc(passo.titolo)}</div>
    <p class="passo-sotto">${esc(passo.sotto || "")}</p>
    <div id="campi">${disegnaCampi(passo.campi, r)}</div>
    <button class="elimina-pratica" data-elimina="${p.id}" data-dentro="1">Elimina questa pratica</button></div></div>`;
  caricaAnteprime();
  avviaMFO();
  attivaFirme();
  Stato.firmaDisegno = firmaPasso();
}

/* ---------- firma su schermo: tratto con dito, penna o mouse; salvata come JPEG ---------- */
function attivaFirme() {
  document.querySelectorAll("canvas[data-firma]").forEach(cv => {
    const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const ctx = cv.getContext("2d");
    ctx.scale(dpr, dpr); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
    ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#14213d";
    let attivo = false, ultimo = null;
    const punto = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    cv.addEventListener("pointerdown", e => { attivo = true; ultimo = punto(e); cv.setPointerCapture(e.pointerId); cv.dataset.tracciata = "1"; cv.parentNode.classList.add("in-corso");
      delete Stato.errori[cv.dataset.firma]; const err = cv.closest(".campo").querySelector(":scope > .errore"); if (err) err.remove(); e.preventDefault(); });
    cv.addEventListener("pointermove", e => { if (!attivo) return; const p = punto(e); ctx.beginPath(); ctx.moveTo(ultimo[0], ultimo[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); ultimo = p; e.preventDefault(); });
    const fine = () => { attivo = false; };
    cv.addEventListener("pointerup", fine); cv.addEventListener("pointercancel", fine);
  });
}
async function salvaFirma(id) {
  const cv = document.querySelector(`canvas[data-firma="${id}"]`), r = Stato.pratica.risposte;
  if (!cv || cv.dataset.tracciata !== "1") { Stato.errori[id] = "Il riquadro è vuoto: fai firmare il cliente"; return vistaQuestionario(); }
  const dati = cv.toDataURL("image/jpeg", 0.85).split(",")[1];
  const campo = trovaCampo(id), scelte = campo && campo.legame ? campo.legame(r) : "", quando = new Date().toISOString();
  let impronta = "";
  try {
    const testo = JSON.stringify({ documento: campo && campo.documento ? valore(campo.documento, r) : "", cliente: r.nome, cf: r.cf || r.piva, scelte, quando });
    const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(testo));
    impronta = Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) {}
  rispondi(id, { dati, l: cv.width, a: cv.height, quando, scelte, impronta }, true);
}

function disegnaCampi(lista, r) { return lista.filter(c => campoVisibile(c, r)).map(c => disegnaCampo(c, r)).join(""); }

function disegnaCampo(c, r) {
  const v = r[c.id], dom = valore(c.dom, r), err = Stato.errori[c.id];
  const aiuto = c.aiuto ? `<div class="aiuto">${esc(valore(c.aiuto, r))}</div>` : "";
  let corpo = "";
  switch (c.tipo) {
    case "testo": case "email": case "tel":
      corpo = `<input type="${c.tipo === "testo" ? "text" : c.tipo}" id="f_${c.id}" data-campo="${c.id}" value="${esc(v)}"

    case "data":
      corpo = `<input type="date" id="f_${c.id}" data-campo="${c.id}" value="${esc(v)}">`; break;
    case "nota":
      corpo = `<textarea id="f_${c.id}" data-campo="${c.id}">${esc(v)}</textarea>`; break;
    case "euro":
      corpo = `<div class="euro"><input type="text" inputmode="numeric" id="f_${c.id}" data-campo="${c.id}" data-euro="1"
        value="${v ? Number(v).toLocaleString("it-IT") : ""}" placeholder="0"></div>`; break;
    case "sino":
      corpo = `<div class="scelte due">${pill(c.id, "si", "Sì", v, "")}${pill(c.id, "no", "No", v, "")}</div>`; break;
    case "conferma":
      corpo = `<div class="scelte due">${pill(c.id, "si", "Confermo", v, "si")}${pill(c.id, "no", "Non confermo", v, "no")}</div>`; break;
    case "scelta": {
      const opz = valore(c.opzioni, r) || [];
      corpo = `<div class="${c.verticale ? "elenco" : "scelte"}">${opz.map(o => c.verticale
        ? `<button class="voce" data-campo="${c.id}" data-v="${esc(o.v)}" aria-pressed="${v === o.v}" style="${v === o.v ? "border-color:var(--blu);box-shadow:inset 0 0 0 1px var(--blu);background:var(--blu-chiaro)" : ""}">
             <div><b style="font-size:16px">${esc(o.t)}</b>${o.n ? `<small>${esc(o.n)}</small>` : ""}</div>${v === o.v ? "✓" : ""}</button>`
        : pill(c.id, o.v, o.t, v, "")).join("")}</div>`; break;
    }
    case "allegato": {
      const lista = Array.isArray(v) ? v : [];
      corpo = `<div class="allegati">${lista.map(f => `<div class="allegato">
          <span class="anteprima" data-anteprima="${esc(f.id)}" data-tipo="${esc(f.tipo)}">${f.tipo === "application/pdf" ? "PDF" : ""}</span>
          <div><b>${esc(f.nome)}</b><small>${(f.dim / 1024 < 1000 ? Math.max(1, Math.round(f.dim / 1024)) + " KB" : (f.dim / 1048576).toFixed(1) + " MB")}</small></div>
          <button class="btn piccolo" data-togli="${esc(c.id)}|${esc(f.id)}" aria-label="Rimuovi ${esc(f.nome)}">Rimuovi</button></div>`).join("")}
        <div class="stato-file" data-stato-file="${c.id}"></div>
        <label class="btn aggiungi"><input type="file" multiple accept="image/*,application/pdf" data-allegato="${c.id}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          ${lista.length ? "Aggiungi altro" : "Scatta una foto o scegli un file"}</label></div>`; break;
    }
    case "flag":
      return `<div class="campo" data-box="${c.id}"><button class="spunta impegno" data-flag="${c.id}" aria-pressed="${v === true}">
          <span class="casella">${v === true ? "✓" : ""}</span><span class="testo-spunta"><b>${esc(dom)}</b></span></button>
        <div data-avviso="${c.id}">${htmlAvviso(c, r)}</div>${err ? `<div class="errore">${esc(err)}</div>` : ""}</div>`;
    case "consenso":
      corpo = `<div class="scelte due">${pill(c.id, "si", "Acconsento", v, "si")}${pill(c.id, "no", "Non acconsento", v, "no")}</div>`; break;
    case "informativa": {
      const P = INFORMATIVA_PRIVACY;
      corpo = `<details class="informativa"><summary>Leggi l'informativa completa (${esc(P.versione)})</summary>
        ${P.sezioni.map(sz => `<h4>${esc(sz.titolo)}</h4>${sz.par.map(x => `<p>${esc(x)}</p>`).join("")}`).join("")}</details>
        <div class="aiuto" style="margin-top:8px">Fai leggere l'informativa al cliente, poi le sue scelte qui sotto. I consensi non sono mai preselezionati.</div>`; break;
    }
    case "firma": {
      if (v && v.dati) {
        corpo = `<img class="firma-img" alt="Firma del cliente" src="data:image/jpeg;base64,${v.dati}">

      } else {
        corpo = `<div class="riquadro-firma"><canvas data-firma="${c.id}"></canvas><span class="segno-firma">Firma qui con il dito o con il mouse</span></div>

          <button class="btn piccolo primario" data-salva-firma="${c.id}">Conferma la firma</button></div>`;
      }
      break;
    }
    case "messaggio": {
      const testo = valore(c.testo, r) || "";
      const mail = r.email ? `mailto:${encodeURIComponent(r.email)}?subject=${encodeURIComponent("Documenti per il preventivo – " + AGENZIA.nome)}&body=${encodeURIComponent(testo)}` : "";
      corpo = `<div class="messaggio">${esc(testo)}</div>
        <div class="bottoni-msg"><button class="btn piccolo" data-copia="${esc(testo)}" data-copia-nome="il messaggio">Copia</button>
        <button class="btn piccolo" data-condividi-testo="${esc(testo)}">Condividi</button>
        ${mail ? `<a class="btn piccolo link" href="${mail}">Email al cliente</a>` : ""}</div>
        <div data-esito-copia class="aiuto" style="min-height:1.2em;margin:6px 0 0"></div>`; break;
    }
    case "info": {
      corpo = `<ul class="lista-schede">${(valore(c.elenco, r) || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>`; break;
    }
    case "mfo":
      /* l'analisi occupa tutto lo spazio, senza la cornice degli altri campi */
      return `<div data-box="mfo" class="mfo-campo">
        <div id="mfoEsito">${htmlEsitoMFO(r)}</div>${err ? `<div class="errore">${esc(err)}</div>` : ""}
        <iframe id="mfoFrame" title="Analisi patrimoniale" style="height:900px"></iframe></div>`;
    case "multipla": {
      const sel = Array.isArray(v) ? v : [];
      const consigliate = c.suggerito ? c.suggerito(r) : [];
      let gruppoPrec = null;
      const etichetta = o => consigliate.includes(o.v) ? ' <span class="consigliata">consigliata</span>' : "";
      const gruppo = o => o.g && o.g !== gruppoPrec ? `<div class="gruppo-opz">${esc(gruppoPrec = o.g)}</div>` : "";
      corpo = c.verticale
        /* elenco a righe: titolo, spiegazione da dire al cliente, spunta */
        ? `<div class="elenco-spunte">${(valore(c.opzioni, r) || []).map(o => gruppo(o) +
            `<button class="spunta" data-campo="${c.id}" data-multi="${esc(o.v)}" aria-pressed="${sel.includes(o.v)}">
              <span class="casella">${sel.includes(o.v) ? "✓" : ""}</span>
              <span class="testo-spunta"><b>${esc(o.t)}${etichetta(o)}</b>${o.n ? `<small>${esc(o.n)}</small>` : ""}</span></button>`).join("")}</div>`

      break;
    }
  }
  const daCF = r._auto && r._auto[c.id] !== undefined && r._auto[c.id] === v;
  if (daCF) corpo += `<div class="aiuto" style="margin:6px 0 0">Ricavato dal codice fiscale</div>`;
  const elenco = c.elenco && c.tipo !== "info" ? `<ul>${c.elenco.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  let figli = "";
  if (figliAperti(c, r)) figli = `<div class="sottocampi">${disegnaCampi(c.figli.campi, r)}</div>`;
  const corto = c.corto || !c.largo && ["testo", "email", "tel", "data", "euro"].includes(c.tipo) || (c.tipo === "sino" && !c.figli && !c.aiuto);
  const cls = (c.tipo === "conferma" ? "campo dichiarazione" : "campo") + (corto ? " corto" : "");
  const titolo = c.tipo === "conferma" ? `<div class="testo">${esc(dom)}</div>` : `<label for="f_${c.id}" class="dom">${esc(dom)}${valore(c.obbl, r) || c.tipo === "info" ? "" : ` <span style="font-weight:400;color:var(--testo-2);font-size:14px">(${c.almenoUno ? "basta uno tra P. IVA e C.F." : "facoltativo"})</span>`}</label>`;
  const perche = c.perche || PERCHE[c.id];
  const htmlPerche = perche ? `<div class="perche"><b>Perché lo chiediamo:</b> ${esc(perche)}</div>` : "";
  return `<div class="${cls}" data-box="${c.id}">${titolo}${elenco}${htmlPerche}${aiuto}${corpo}
    <div data-avviso="${c.id}">${htmlAvviso(c, r)}</div>${err ? `<div class="errore">${esc(err)}</div>` : ""}${figli}</div>`;
}

function pill(id, val, testo, attuale, tono) {
  return `<button class="pill ${tono}" data-campo="${id}" data-v="${esc(val)}" aria-pressed="${attuale === val}">${esc(testo)}</button>`;
}

function htmlAvviso(c, r) {
  const v = r[c.id]; let a = null;
  if (c.avvisoNo && v === "no") a = c.avvisoNo;
  if (!a && c.avviso && !vuoto(v)) a = c.avviso(c.tipo === "euro" ? Number(v) : v, r);
  if (!a && c.avvisoSe) a = c.avvisoSe(v, r);
  if (!a && c.avvisoVuoto && vuoto(v)) a = c.avvisoVuoto(r);
  return a ? `<div class="avviso ${a.livello}">${ICONE.attenzione}<span>${esc(a.testo)}</span></div>` : "";
}

/* "Firma" di ciò che è visibile: se cambia dopo una risposta, si ridisegna il passo */
function firmaPasso() {
  const p = Stato.pratica, q = QUESTIONARI[p.questionario], r = p.risposte;
  const passi = passiVisibili(q, r), passo = passi[Math.min(p.passo, passi.length - 1)];
  return passi.length + "|" + campiAttivi(passo, r).map(c => c.id + (c.tipo === "scelta" ? ":" + (valore(c.opzioni, r) || []).map(o => o.v).join(",") : "")).join(";");
}

function rispondi(id, val, ridisegnaSempre) {
  const prima = firmaPasso();
  Stato.pratica.risposte[id] = val;
  const cDer = trovaCampo(id);
  if (cDer && cDer.deriva) cDer.deriva(Stato.pratica.risposte);
  delete Stato.errori[id];
  const c0 = trovaCampo(id);
  if (c0 && c0.almenoUno && !vuoto(val)) for (const k of Object.keys(Stato.errori)) { const x = trovaCampo(k); if (x && x.almenoUno === c0.almenoUno) delete Stato.errori[k]; }
  Pratiche.salva(Stato.pratica);
  /* si confronta anche con la forma del passo all'ultimo disegno: il testo digitato è già salvato
     dall'evento "input", quindi "prima" può essere già aggiornato (es. numero di partecipanti) */
  if (ridisegnaSempre || (cDer && cDer.deriva) || firmaPasso() !== prima || firmaPasso() !== Stato.firmaDisegno) {
    /* Si ridisegna subito dopo che il cursore si è spostato sul campo successivo,
       poi gli si ridà il fuoco: così chi passa da un campo all'altro non perde il punto. */
    setTimeout(() => {
      if (Stato.schermo() !== "questionario") return;
      const att = document.activeElement, idAtt = att && att.id, sel = att && "selectionStart" in att ? [att.selectionStart, att.selectionEnd] : null;
      const y = window.scrollY; vistaQuestionario(); misura(); window.scrollTo(0, y);
      const nuovo = idAtt && document.getElementById(idAtt);
      if (nuovo && nuovo !== document.body) { nuovo.focus({ preventScroll: true }); try { if (sel) nuovo.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
    }, 0);
  } else {
    /* gli avvisi possono dipendere da altri campi (es. codice fiscale e nome): si aggiornano tutti */
    document.querySelectorAll("[data-avviso]").forEach(box => { const c = trovaCampo(box.dataset.avviso); if (c) box.innerHTML = htmlAvviso(c, Stato.pratica.risposte); });
  }
}

function trovaCampo(id) {
  const q = QUESTIONARI[Stato.pratica.questionario];
  let trovato = null;
  (function giro(l) { for (const c of l) { if (c.id === id) trovato = c; if (c.figli) giro(c.figli.campi); } })(q.passi.flatMap(p => p.campi));
  return trovato;
}

function avanti() {
  const p = Stato.pratica, q = QUESTIONARI[p.questionario];
  const passi = passiVisibili(q, p.risposte);
  const err = controllaPasso(passi[p.passo], p.risposte);
  Stato.errori = err;
  if (Object.keys(err).length) {
    vistaQuestionario(); misura();
    const primo = document.querySelector(`[data-box="${Object.keys(err)[0]}"]`);
    if (primo) primo.scrollIntoView({ block: "center", behavior: "smooth" });
    return;
  }
  if (p.passo < passi.length - 1) { p.passo++; Pratiche.salva(p); try { history.pushState({}, ""); } catch (e) {} disegna(); window.scrollTo(0, 0); }
  else vai("riepilogo");
}

/* Condivisione dei file solo su telefono e tablet: sul PC (Windows in particolare) il pannello di
   condivisione spesso non offre il programma di posta e i file non restano in nessuna cartella. */
function suTelefono() {
  try { if (navigator.userAgentData && typeof navigator.userAgentData.mobile === "boolean" && navigator.userAgentData.mobile) return true; } catch (e) {}
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)
    || (window.matchMedia && matchMedia("(pointer: coarse)").matches && !matchMedia("(pointer: fine)").matches);
}
function puoCondividereFile(f) {
  if (!suTelefono()) return false;
  try { return !!(navigator.canShare && navigator.canShare({ files: [f || new File(["x"], "x.pdf", { type: "application/pdf" })] })); } catch (e) { return false; }
}
/* Dopo lo scarico sul PC: elenco dei file con il tasto per riscaricarli (un clic per file, mai bloccato dal browser) */
function elencoScaricati(files) {
  Stato.scaricati = files;
  return `<p>File salvati nella cartella <b>Download</b> del computer (o dove il browser salva i file):</p>
    <ul class="lista-schede">${files.map((f, i) => `<li>${esc(f.name)} <button class="btn piccolo" data-riscarica="${i}">Scarica di nuovo</button></li>`).join("")}</ul>`;
}
function profiloValido() {
  const pr = Memoria.leggi("bussola.profilo", {});
  const err = !pr.nome ? "Inserisci il tuo nome: il backoffice deve sapere chi ha mandato la pratica."
    : !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(pr.email || "") ? "Inserisci la tua email." : "";
  const box = $("#erroreProfilo"); if (box) box.textContent = err;

async function fileAllegati(p) {

async function azioneInvio(tipo) {

    const url = `mailto:${to}?subject=${encodeURIComponent(oggettoEmail(p))}&body=${encodeURIComponent(testoEmail(p, pr, 1700))}`;

    return segnaInviato("Se non si è aperto nessun programma di posta, usa «Il programma di posta non si apre?» qui sotto. Ricorda di allegare i file scaricati.");
  }
  const pdf = new File([creaPDF(p, pr)], nomeFile(p, "pdf"), { type: "application/pdf" });
  const allegati = await fileAllegati(p);

    return;
  }
  if (tipo === "condividi") {
    try { await navigator.clipboard.writeText(to); } catch (e) {}
    try {
      await navigator.share({ files: [pdf].concat(allegati), title: oggettoEmail(p), text: `${oggettoEmail(p)}\nDestinatario: ${to}` });
      segnaInviato(`Condiviso. Indirizzo copiato: ${to}`);
    } catch (e) { if (e && e.name !== "AbortError") { const st = $("#statoInvio"); if (st) st.textContent = "Condivisione non riuscita: usa «Solo email» e allega il PDF a mano."; } }
  }
}

/* Eliminazione in due tocchi (niente finestre di conferma del browser): il primo chiede conferma, il secondo elimina */
function chiediElimina(b) {
  const id = b.dataset.elimina;
  if (!b.classList.contains("conferma")) {
    document.querySelectorAll(".conferma[data-elimina]").forEach(x => x.classList.remove("conferma"));
    document.querySelectorAll(".avviso-elimina").forEach(x => x.remove());
    b.classList.add("conferma"); b.dataset.testo = b.innerHTML;
    let nota = null;
    if (b.dataset.dentro) b.textContent = "Tocca di nuovo per eliminare la pratica";
    else { nota = document.createElement("div"); nota.className = "avviso-elimina"; nota.textContent = "Tocca di nuovo il cestino rosso per eliminare la pratica";
           b.closest(".riga-pratica").after(nota); }
    setTimeout(() => { if (b.isConnected && b.classList.contains("conferma")) { b.classList.remove("conferma"); b.innerHTML = b.dataset.testo; if (nota) nota.remove(); } }, 4000);
    return;
  }
  const p = Pratiche.tutte().find(x => x.id === id) || Stato.pratica;
  const nome = (p && p.risposte.nome) || "cliente senza nome";
  Pratiche.elimina(id);
  if (b.dataset.dentro) { Stato.pratica = null; return vaiHome(`Pratica di ${nome} eliminata.`); }
  Stato.messaggio = `Pratica di ${nome} eliminata.`; disegna();
}

/* ================= EVENTI ================= */
function collegaEventi() {
  $("#btnIndietro").addEventListener("click", () => { try { history.back(); } catch (e) { indietro(); } });
  window.addEventListener("popstate", () => indietro());

  document.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.az === "preventivo") return vai("albero", {});
    if (b.dataset.az === "sinistro") { Stato.pratica = Pratiche.nuova("sinistro", "sinistro"); Stato.errori = {}; return vai("questionario"); }
    if (b.dataset.az === "compliance") return vai("schede", { tipo: "compliance" });
    if (b.dataset.az === "guida") return vai("schede", { tipo: "guida" });
    if (b.dataset.az === "anteprima") { const pr = Memoria.leggi("bussola.profilo", {}); const w = window.open(URL.createObjectURL(creaPDF(Stato.pratica, pr)), "_blank"); if (!w) scaricaBlob(creaPDF(Stato.pratica, pr), nomeFile(Stato.pratica, "pdf")); return; }
    if (["condividi", "scarica", "email"].includes(b.dataset.az)) return azioneInvio(b.dataset.az);
    if (b.dataset.riscarica !== undefined) { const f = (Stato.scaricati || [])[+b.dataset.riscarica]; if (f) scaricaBlob(f, f.name); return; }
    if (b.dataset.az === "copiaTestoEmail") {
      const pr = Memoria.leggi("bussola.profilo", {}), out = b.closest("details").querySelector("[data-esito-copia]");
      (navigator.clipboard ? navigator.clipboard.writeText(testoEmail(Stato.pratica, pr)) : Promise.reject()).then(
        () => { out.textContent = "Copiato il testo dell'email."; segnaInviato(""); }, () => { out.textContent = "Copia non riuscita."; });
      return;
    }
    if (b.dataset.az === "inviato") return chiudiPratica();
    if (b.dataset.dest) { Stato.pratica.destinatari = [b.dataset.dest]; Pratiche.salva(Stato.pratica); document.querySelectorAll("[data-dest]").forEach(x => x.setAttribute("aria-pressed", x === b)); return; }
    if (b.dataset.vaiPasso !== undefined) { Stato.pratica.passo = Number(b.dataset.vaiPasso); Stato.errori = {}; Pratiche.salva(Stato.pratica); history.back(); window.scrollTo(0, 0); return; }
    if (b.id === "btnHome") return vaiHome();
    if (b.dataset.elimina) return chiediElimina(b);
    if (b.dataset.az === "disdettaPDF") return creaDisdetta();
    if (b.dataset.salvaFirma) return salvaFirma(b.dataset.salvaFirma);
    if (b.dataset.pulisciFirma || b.dataset.rifaiFirma) { const id = b.dataset.pulisciFirma || b.dataset.rifaiFirma; return rispondi(id, null, true); }
    if (b.dataset.az === "privacyCliente") return copiaPrivacyCliente();
    if (b.dataset.az === "dichiarazioneBianco") return scaricaBlob(creaDichiarazionePDF(null), "Dichiarazione proposta personalizzata.pdf");
    if (b.dataset.az === "segnalaPog") {
      const S = Stato.segnalaPog || {}, err = document.querySelector("[data-segnala-errore]");
      if (!String(S.prodotto || "").trim() || !String(S.testo || "").trim()) { if (err) err.textContent = "Indica il prodotto e cosa hai notato"; return; }
      const pr = Memoria.leggi("bussola.profilo", {});
      location.href = `mailto:${COMPLIANCE_AGENZIA.mail}?subject=${encodeURIComponent("Segnalazione POG – " + S.prodotto)}&body=${encodeURIComponent(`Prodotto: ${S.prodotto}\n\n${S.testo}\n\n${pr.nome || ""}`)}`;
      return;
    }
    if (b.dataset.az === "privacyBianco") return scaricaBlob(creaPrivacyPDF(null), "Informativa privacy Lloyd Varesino.pdf");
    if (b.dataset.az === "esperto") { Memoria.scrivi("bussola.esperto", !(Memoria.leggi("bussola.esperto", false) === true)); return disegna(); }
    if (b.dataset.az === "nuovaEsigenza") { const seg = Stato.clienteRiuso && Stato.clienteRiuso._segmento; return vai("albero", seg ? { nodo: seg } : {}); }
    if (b.dataset.condividiTesto !== undefined) {
      const t = b.dataset.condividiTesto, out = document.querySelector("[data-esito-copia]");
      if (navigator.share && suTelefono()) { navigator.share({ text: t }).catch(() => {}); return; }
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { if (out) out.textContent = "Messaggio copiato: incollalo nell'email o in WhatsApp Web."; }, () => {});
      return;
    }
    if (b.dataset.iban) return PromemoriaIban.invia(b.dataset.iban);
    if (b.dataset.ibanFatto) { PromemoriaIban.togli(b.dataset.ibanFatto); return disegna(); }
    if (b.dataset.ibanIcs) return PromemoriaIban.calendario(b.dataset.ibanIcs);
    if (b.dataset.copia) {
      const out = document.querySelector("[data-esito-copia]");
      (navigator.clipboard ? navigator.clipboard.writeText(b.dataset.copia) : Promise.reject()).then(
        () => { if (out) out.textContent = "Copiato: " + (b.dataset.copiaNome || b.dataset.copia); }, () => { if (out) out.textContent = "Copia non riuscita: selezionalo a mano."; });
      return;
    }
    if (b.dataset.az === "avanti") return avanti();
    if (b.dataset.az === "indietro") return $("#btnIndietro").click();
    if (b.dataset.passo !== undefined) { Stato.pratica.passo = Number(b.dataset.passo); Stato.errori = {}; Pratiche.salva(Stato.pratica); disegna(); window.scrollTo(0, 0); return; }
    if (b.dataset.nodo) return vai("albero", { nodo: b.dataset.nodo });
    if (b.dataset.prodotto) {
      const strada = percorsoNodo(b.dataset.prodotto), prod = strada[strada.length - 1];
      Stato.pratica = Pratiche.nuova("preventivo", prod.questionario);
      Stato.pratica.prodotto = prod.id;
      Stato.pratica.risposte._segmento = strada[0].id;      // "pf" persona fisica, "az" azienda
      Stato.pratica.risposte._prodotto = prod.id;
      Object.assign(Stato.pratica.risposte, prod.preset || {});   /* es. CAR o Postuma già scelte dal nodo */
      if (Stato.clienteRiuso) { const { _segmento, ...dati } = Stato.clienteRiuso; Object.assign(Stato.pratica.risposte, dati); Stato.clienteRiuso = null; }
      Stato.errori = {};
      return vai("questionario");
    }
    if (b.dataset.apri) {
      Stato.pratica = Pratiche.tutte().find(x => x.id === b.dataset.apri); Stato.errori = {};
      return vai("questionario");
    }
    if (b.dataset.campo && b.dataset.multi !== undefined) {
      const att = Stato.pratica.risposte[b.dataset.campo] || [];
      const v = b.dataset.multi;
      return rispondi(b.dataset.campo, att.includes(v) ? att.filter(x => x !== v) : att.concat(v), true);
    }
    if (b.dataset.campo && b.dataset.v !== undefined) return rispondi(b.dataset.campo, b.dataset.v, true);
    if (b.dataset.flag) { const id = b.dataset.flag; delete Stato.errori.iban; return rispondi(id, Stato.pratica.risposte[id] !== true, true); }
    if (b.dataset.togli) {
      const [campo, idf] = b.dataset.togli.split("|");
      Allegati.elimina(idf);
      return rispondi(campo, (Stato.pratica.risposte[campo] || []).filter(f => f.id !== idf), true);
    }
  });

  document.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset && t.dataset.segnala) { (Stato.segnalaPog = Stato.segnalaPog || {})[t.dataset.segnala] = t.value; return; }
    if (t.dataset && t.dataset.dis) { (Stato.disdetta = Stato.disdetta || {})[t.dataset.dis] = t.value; return; }
    if (t.dataset && t.dataset.profilo) { const pr = Memoria.leggi("bussola.profilo", {}); pr[t.dataset.profilo] = t.value.trim(); Memoria.scrivi("bussola.profilo", pr); return; } if (!t.dataset || !t.dataset.campo) return;
    if (t.dataset.euro) {
      const n = t.value.replace(/\D/g, "");
      Stato.pratica.risposte[t.dataset.campo] = n ? Number(n) : "";
      Pratiche.salva(Stato.pratica);
      const box = document.querySelector(`[data-avviso="${t.dataset.campo}"]`), c = trovaCampo(t.dataset.campo);
      if (box && c) box.innerHTML = htmlAvviso(c, Stato.pratica.risposte);
    } else { Stato.pratica.risposte[t.dataset.campo] = t.value; Pratiche.salva(Stato.pratica); }
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset && t.dataset.allegato) { const fl = Array.from(t.files || []); t.value = ""; if (fl.length) aggiungiFile(t.dataset.allegato, fl); return; } if (!t.dataset || !t.dataset.campo) return;
    if (t.dataset.euro) { const n = t.value.replace(/\D/g, ""); t.value = n ? Number(n).toLocaleString("it-IT") : ""; rispondi(t.dataset.campo, n ? Number(n) : ""); }
    else rispondi(t.dataset.campo, t.value);
  });

  window.addEventListener("resize", misura);
  if (window.ResizeObserver) { const ro = new ResizeObserver(misura); ro.observe($("#barra")); ro.observe($("#azioni")); }
}

try { localStorage.removeItem("bussola.pogVisto"); } catch (e) {} /* presa visione POG tolta nella 0.16 */
Stato.pila.push({ schermo: "home", dati: {} });
try { history.replaceState({ n: 1 }, ""); } catch (e) {}
collegaEventi();
disegna();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(misura);
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  /* quando arriva una versione nuova, si ricarica una volta da sola (solo se c'era già una versione installata) */
  const giaInstallata = !!navigator.serviceWorker.controller;
  let ricaricata = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (giaInstallata && !ricaricata) { ricaricata = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => reg.update()).catch(() => {});
}
