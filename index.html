<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#294d95">
<title>Bussola · Agenzia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icona-192.png">
<link rel="apple-touch-icon" href="icona-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blu:#294d95; --blu-2:#1e3a73; --blu-chiaro:#e9eef7; --arancio:#f76b1c;
  --verde:#1f7a4d; --verde-chiaro:#e5f3ec;
  --ambra:#9a5b00; --ambra-chiaro:#fdf1dc;
  --rosso:#a3272b; --rosso-chiaro:#fbe6e6;
  --fondo:#f4f7fa; --carta:#ffffff; --testo:#282828; --testo-2:#5b6573; --bordo:#d9e2ef;
  --raggio:14px;
  --h-barra:64px; --h-azioni:0px;           /* sovrascritte dal codice con le misure reali */
  --sicuro-sotto:env(safe-area-inset-bottom,0px);
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--fondo);color:var(--testo);font-family:var(--font);
  font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- barra in alto ---------- */
#barra{position:fixed;top:0;left:0;right:0;z-index:10;background:var(--carta);color:var(--testo);border-bottom:1px solid var(--bordo);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px}
#barra .riga{display:flex;align-items:center;gap:8px;min-height:44px;max-width:720px;margin:0 auto}
#barra .logo{height:44px;width:auto;display:block;flex:none}
body.interno #barra .logo{display:none}
#barra .separa{width:1px;height:28px;background:var(--bordo);flex:none}
body.interno #barra .separa{display:none}
#barra h1{font-size:18px;font-weight:600;color:var(--blu);margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#barra .sotto{font-size:13px;color:var(--testo-2);font-weight:500}
#barra .indietro{width:44px;height:44px;border:0;border-radius:12px;background:var(--blu-chiaro);color:var(--blu);
  display:flex;align-items:center;justify-content:center;flex:none}
#barra .indietro[hidden]{display:none}
#progresso{max-width:720px;margin:8px auto 0;display:flex;gap:4px}
#progresso[hidden]{display:none}
#progresso i{flex:1;height:4px;border-radius:2px;background:var(--bordo)}
#progresso i.fatto{background:var(--verde)}
#progresso i.ora{background:var(--arancio)}

/* ---------- area centrale ---------- */
#vista{padding:calc(var(--h-barra) + 16px) 16px calc(var(--h-azioni) + 24px);max-width:720px;margin:0 auto}

/* ---------- barra comandi in basso ---------- */
#azioni{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--carta);border-top:1px solid var(--bordo);
  padding:12px 16px calc(12px + var(--sicuro-sotto))}
#azioni[hidden]{display:none}
#azioni .riga{display:flex;gap:10px;max-width:720px;margin:0 auto}
.btn{min-height:52px;border-radius:12px;border:1px solid var(--bordo);background:var(--carta);
  font-weight:600;font-size:17px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primario{background:var(--blu);border-color:var(--blu);color:#fff;flex:1}
.btn.primario:disabled{background:#9aa9ba;border-color:#9aa9ba}
.btn.largo{width:100%}

/* ---------- home ---------- */
.saluto{margin:4px 2px 18px}
.saluto h2{font-size:24px;margin:0 0 4px;font-weight:700}
.saluto p{margin:0;color:var(--testo-2);font-size:15px}
.griglia{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tessera{background:var(--carta);border:1px solid var(--bordo);border-radius:var(--raggio);padding:16px 14px;
  text-align:left;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.tessera .ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.tessera b{font-size:17px;display:block}
.tessera small{color:var(--testo-2);font-size:13px;display:block;margin-top:2px}
.tessera.grande{grid-column:1 / -1;min-height:0;flex-direction:row;align-items:center;background:var(--blu);color:#fff;border-color:var(--blu)}
.tessera.grande small{color:#c9d7e6}
.tessera.grande .ico{background:rgba(255,255,255,.14)}
.ico.blu{background:var(--blu-chiaro);color:var(--blu)}
.ico.verde{background:var(--verde-chiaro);color:var(--verde)}
.ico.ambra{background:var(--ambra-chiaro);color:var(--ambra)}
.ico.rosso{background:var(--rosso-chiaro);color:var(--rosso)}
.sezione-titolo{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--testo-2);margin:26px 2px 10px}
.vuoto{background:var(--carta);border:1px dashed var(--bordo);border-radius:var(--raggio);padding:18px;color:var(--testo-2);font-size:15px;text-align:center}
.riga-pratica{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.pratica{background:var(--carta);border:1px solid var(--bordo);border-radius:var(--raggio);padding:14px;display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.elimina{flex:none;width:56px;border:1px solid var(--bordo);border-radius:var(--raggio);background:var(--carta);color:var(--testo-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.elimina.conferma{background:var(--rosso);border-color:var(--rosso);color:#fff}
.avviso-elimina{color:var(--rosso);font-size:13px;font-weight:600;text-align:right;margin:-4px 2px 8px}
.elimina-pratica{display:block;margin:28px auto 0;background:none;border:0;color:var(--rosso);font-weight:600;font-size:14px;text-decoration:underline;min-height:44px}
.elimina-pratica.conferma{background:var(--rosso);color:#fff;text-decoration:none;border-radius:10px;padding:0 16px}
.pratica div{flex:1;min-width:0}
.pratica b{display:block;font-size:16px}
.pratica small{color:var(--testo-2);font-size:13px}

/* ---------- elenchi di scelta (rami, prodotti) ---------- */
.elenco{display:flex;flex-direction:column;gap:8px}
.voce{background:var(--carta);border:1px solid var(--bordo);border-radius:var(--raggio);min-height:60px;padding:12px 14px;
  display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.voce div{flex:1}
.voce b{display:block;font-size:17px;font-weight:600}
.voce small{color:var(--testo-2);font-size:14px}
.voce:disabled{opacity:.5}
.briciole{font-size:13px;color:var(--testo-2);margin:0 2px 6px;font-weight:500}
.etichetta-presto.pronti{background:var(--verde-chiaro);color:var(--verde)}
.etichetta-presto{font-size:12px;font-weight:600;color:var(--testo-2);background:var(--fondo);border-radius:6px;padding:3px 7px}

/* ---------- questionario ---------- */
.passo-titolo{font-size:22px;font-weight:700;margin:2px 2px 4px}
.passo-sotto{color:var(--testo-2);font-size:15px;margin:0 2px 18px}
.campo{background:var(--carta);border:1px solid var(--bordo);border-radius:var(--raggio);padding:14px;margin-bottom:12px}
.campo > label, .campo .dom{display:block;font-weight:600;font-size:16px;margin-bottom:10px}
.campo .aiuto{color:var(--testo-2);font-size:14px;margin:-4px 0 10px}
.campo input[type=text],.campo input[type=email],.campo input[type=tel],.campo input[type=date],.campo textarea,.campo select{
  width:100%;min-height:50px;border:1px solid var(--bordo);border-radius:10px;padding:10px 12px;background:#fbfcfd;font-size:17px}
.campo textarea{min-height:90px;resize:vertical}
.campo input:focus,.campo textarea:focus,.campo select:focus{outline:2px solid var(--blu-2);outline-offset:1px;background:#fff}
.euro{position:relative}
.euro input{padding-left:30px !important}
.euro::before{content:"€";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--testo-2)}
.scelte{display:flex;flex-wrap:wrap;gap:8px}
.scelte.due > *{flex:1 1 0}
.pill{min-height:48px;padding:6px 12px;white-space:normal;line-height:1.25;max-width:100%;border-radius:10px;border:1px solid var(--bordo);background:#fbfcfd;font-weight:600;font-size:16px}
.pill[aria-pressed=true]{background:var(--blu);border-color:var(--blu);color:#fff}
.pill.si[aria-pressed=true]{background:var(--verde);border-color:var(--verde)}
.pill.no[aria-pressed=true]{background:var(--rosso);border-color:var(--rosso)}
.dichiarazione .testo{font-size:15px;color:var(--testo);margin-bottom:12px;font-weight:500}
.dichiarazione ul{margin:6px 0 12px;padding-left:20px;color:var(--testo-2);font-size:14px}
.avviso{border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px;display:flex;gap:8px;align-items:flex-start}
.avviso.ambra{background:var(--ambra-chiaro);color:#6b3f00}
.avviso.rosso{background:var(--rosso-chiaro);color:#7a1d20}
.avviso.blu{background:var(--blu-chiaro);color:var(--blu)}
.avviso svg{flex:none;margin-top:1px}
.sottocampi{border-left:3px solid var(--blu-chiaro);padding-left:12px;margin-top:12px}
.sottocampi .campo{border:0;padding:0;margin-bottom:12px;background:none}
.errore{color:var(--rosso);font-size:14px;margin-top:6px}
.allegati{display:flex;flex-direction:column;gap:8px}
.allegato{display:flex;align-items:center;gap:12px;border:1px solid var(--bordo);border-radius:10px;padding:8px;background:#fbfcfd}
.allegato div{flex:1;min-width:0}
.allegato b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.allegato small{color:var(--testo-2);font-size:13px}
.anteprima{width:52px;height:52px;border-radius:8px;background:var(--blu-chiaro);color:var(--blu);font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.anteprima img{width:100%;height:100%;object-fit:cover}
.btn.piccolo{min-height:40px;font-size:14px;padding:0 12px}
.btn.aggiungi{border-style:dashed;color:var(--blu);width:100%;position:relative}
.btn.aggiungi input{position:absolute;inset:0;opacity:0;cursor:pointer}
.stato-file{font-size:14px;color:var(--testo-2)}
.stato-file:empty{display:none}
.gruppo-opz{flex-basis:100%;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--testo-2);margin:10px 0 2px}
.gruppo-opz:first-child{margin-top:0}
.comp{font-size:12px;font-weight:500;opacity:.75;margin-left:4px;white-space:nowrap}
.spunta.impegno{border-style:dashed}
.spunta.impegno[aria-pressed=true]{border-style:solid}
.elenco-spunte{display:flex;flex-direction:column;gap:6px}
.spunta{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--bordo);border-radius:10px;background:#fbfcfd;padding:10px 12px;min-height:52px}
.spunta .casella{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--bordo);flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;margin-top:1px}
.spunta[aria-pressed=true]{border-color:var(--blu);background:var(--blu-chiaro)}
.spunta[aria-pressed=true] .casella{background:var(--blu);border-color:var(--blu)}
.testo-spunta b{display:block;font-size:15.5px;font-weight:600}
.testo-spunta small{display:block;color:var(--testo-2);font-size:13.5px;margin-top:2px}
.elenco-spunte .gruppo-opz{margin-top:10px}
.consigliata{font-size:11px;font-weight:600;background:var(--verde-chiaro);color:var(--verde);border-radius:6px;padding:2px 6px;margin-left:4px;white-space:nowrap}
.pill[aria-pressed=true] .consigliata{background:rgba(255,255,255,.2);color:#fff}
.scelte.due .pill{white-space:nowrap}
.pill.lunga{white-space:normal;text-align:left;padding:8px 12px;line-height:1.3}
.avviso.verde{background:var(--verde-chiaro);color:#14532d}
.riga-titolo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.riga-titolo .dom{margin:0}
.riepilogo dl,.campo dl{margin:0;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:6px 14px;font-size:14px}
.riepilogo dt,.campo dt{color:var(--testo-2)}
.riepilogo dd,.campo dd{margin:0;font-weight:500;overflow-wrap:anywhere}
dd.grave{color:var(--rosso);font-weight:700}
.griglia-2{display:grid;grid-template-columns:1fr;gap:8px}
.griglia-2 input{width:100%;min-height:50px;border:1px solid var(--bordo);border-radius:10px;padding:10px 12px;background:#fbfcfd;font-size:17px}
.passi-invio{margin:0 0 12px;padding-left:20px;font-size:15px;color:var(--testo)}
.passi-invio li{margin-bottom:6px}
.bottoni-invio{display:flex;flex-wrap:wrap;gap:10px}
.bottoni-invio .btn{flex:1 1 220px}
.lista-schede{margin:0;padding-left:20px;font-size:15px}
.lista-schede li{margin-bottom:6px}
.mfo-campo{grid-column:1 / -1}
.mfo-campo iframe{display:block;width:100%;border:0;background:var(--fondo);margin-top:12px}
.mfo-campo #mfoEsito .avviso{margin-top:0}
.riga-dato{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bordo);font-size:15px}
.riga-dato:first-of-type{border-top:0}
.riga-dato span{color:var(--testo-2);flex:0 0 96px}
.riga-dato b{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.doc-utile{border-top:1px solid var(--bordo);padding:10px 0}
.doc-utile:first-of-type{border-top:0;padding-top:0}
.doc-utile summary{cursor:pointer;font-weight:600;font-size:16px;color:var(--blu);min-height:40px;display:flex;align-items:center}
.doc-utile p{font-size:15px;margin:8px 0}
.dis-griglia{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0}
.dis-campo span{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.dis-campo small{font-weight:400;color:var(--testo-2)}
.dis-campo input{width:100%;min-height:48px;border:1px solid var(--bordo);border-radius:10px;padding:8px 12px;background:#fbfcfd;font-size:16px}
.btn.link{color:var(--blu);text-decoration:none;display:inline-flex}
@media (min-width: 900px){ .dis-griglia{grid-template-columns:1fr 1fr} }
.messaggio{white-space:pre-wrap;background:#fbfcfd;border:1px solid var(--bordo);border-radius:10px;padding:12px;font-size:15px;line-height:1.45}
.bottoni-msg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.perche{font-size:13.5px;color:var(--testo-2);background:var(--fondo);border-radius:8px;padding:6px 10px;margin:-4px 0 10px}
.nuova-esigenza{width:100%;margin-bottom:14px}
.promemoria input{width:100%;min-height:48px;border:1px solid var(--bordo);border-radius:10px;padding:8px 12px;background:#fbfcfd;font-size:16px;margin-top:6px}
.promemoria.scaduto{border-color:var(--rosso)}
.pill-mini{font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px;background:var(--ambra-chiaro);color:#6b3f00;white-space:nowrap}
.promemoria.scaduto .pill-mini{background:var(--rosso-chiaro);color:#7a1d20}
.interruttore{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--bordo);border-radius:12px;background:var(--carta);padding:12px 14px;margin-top:18px}
.interruttore b{display:block;font-size:15px}
.interruttore small{display:block;color:var(--testo-2);font-size:13px}
.levetta{width:44px;height:26px;border-radius:13px;background:#c9d3e0;position:relative;flex:none;transition:background .15s}
.levetta::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.interruttore[aria-pressed=true] .levetta{background:var(--blu)}
.interruttore[aria-pressed=true] .levetta::after{left:21px}
body.esperto .campo > .aiuto, body.esperto .perche, body.esperto .testo-spunta small, body.esperto .elenco .voce small{display:none}
.informativa summary{cursor:pointer;color:var(--blu);font-weight:600;min-height:40px;display:flex;align-items:center}
.informativa{max-height:none}
.informativa[open]{max-height:50vh;overflow:auto;border:1px solid var(--bordo);border-radius:10px;padding:0 12px 12px;background:#fbfcfd}
.informativa h4{font-size:13px;margin:14px 0 6px;color:var(--blu)}
.informativa p{font-size:13.5px;margin:0 0 8px;line-height:1.45}
.riquadro-firma{position:relative;border:1.5px dashed var(--bordo);border-radius:12px;background:#fff;height:180px;touch-action:none}
.riquadro-firma canvas{width:100%;height:100%;display:block;border-radius:12px;touch-action:none;cursor:crosshair}
.segno-firma{position:absolute;left:12px;bottom:10px;font-size:13px;color:var(--testo-2);pointer-events:none}
.riquadro-firma.in-corso .segno-firma{display:none}
.firma-img{display:block;max-width:100%;height:120px;object-fit:contain;border:1px solid var(--bordo);border-radius:10px;background:#fff}
.nota-piccola{color:var(--testo-2);font-size:13px;text-align:center;margin-top:18px}
/* ---------- passi laterali (solo schermi larghi) ---------- */
.layout-q{display:block}
.passi-lato{display:none}
.btn.secondario-largo{display:none}

/* =================== SCHERMI LARGHI: PC, Mac, tablet orizzontale =================== */
@media (min-width: 900px){
  body{font-size:16px}
  #barra .riga,#progresso,#azioni .riga{max-width:1120px}
  #vista{max-width:1120px;padding-left:24px;padding-right:24px}
  .griglia{grid-template-columns:2fr 1fr 1fr}
  .tessera.grande{grid-column:auto;flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:150px}
  .tessera.grande > svg{display:none}
  .saluto h2{font-size:28px}
  body.interno #barra .logo,body.interno #barra .separa{display:block}
  #barra .logo{height:48px}
  .layout-q{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
  .passi-lato{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(var(--h-barra) + 16px);
    background:var(--carta);border:1px solid var(--bordo);border-radius:var(--raggio);padding:8px}
  .passi-lato button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;display:flex;gap:10px;align-items:center;font-size:15px;color:var(--testo-2)}
  .passi-lato button:disabled{cursor:default;opacity:.55}
  .passi-lato button .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--bordo);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none}
  .passi-lato button.fatto .n{background:var(--verde-chiaro);border-color:var(--verde);color:var(--verde)}
  .passi-lato button.ora{background:var(--blu-chiaro);color:var(--blu);font-weight:600}
  .passi-lato button.ora .n{background:var(--blu);border-color:var(--blu);color:#fff}
  .passi-lato button:not(:disabled):not(.ora):hover{background:var(--fondo)}
  .elenco-spunte{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
  .elenco-spunte .gruppo-opz{grid-column:1 / -1}
  .elenco.albero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .griglia-2{grid-template-columns:1fr 1fr 1fr}
  #campi{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  #campi > .campo{grid-column:1 / -1}
  #campi > .campo.corto{grid-column:auto}
  .sottocampi{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .sottocampi > .campo{grid-column:1 / -1}
  .sottocampi > .campo.corto{grid-column:auto}
  #azioni .riga{justify-content:flex-end}
  .btn.primario{flex:0 0 auto;min-width:220px}
  .btn.secondario-largo{display:inline-flex}
  #progresso{display:none !important}
  .pill:hover:not([aria-pressed=true]),.voce:hover:not(:disabled),.tessera:hover{border-color:var(--blu)}
}
</style>
</head>
<body>
<header id="barra">

/* Utilità sull'albero: percorso dalla radice a un nodo, gruppo di invio, prodotti pronti */
function percorsoNodo(id, nodi = ALBERO, strada = []) {
  for (const n of nodi) {
    const s = strada.concat(n);
    if (n.id === id) return s;
    if (n.figli) { const t = percorsoNodo(id, n.figli, s); if (t) return t; }
  }
  return null;
}
function invioPer(id) { const p = percorsoNodo(id) || []; for (let i = p.length - 1; i >= 0; i--) if (p[i].invio) return p[i].invio; return "danni"; }
function contaPronti(n) { return n.figli ? n.figli.reduce((a, f) => a + contaPronti(f), 0) : (n.questionario ? 1 : 0); }
function contaTotali(n) { return n.figli ? n.figli.reduce((a, f) => a + contaTotali(f), 0) : 1; }

:8px 0 8px 20px}\nul.clean li{margin:4px 0}\n/* Bottoni */\n.btn{display:inline-block;border:none;border-radius:10px;padding:12px 22px;font-size:1rem;font-weight:600;cursor:pointer;transition:filter .15s,transform .05s;font-family:inherit}\n.btn:active{transform:translateY(1px)}\n.btn-primary{background:var(--brand);color:#fff}\n.btn-primary:hover{filter:brightness(1.12)}\n.btn-ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}\n.btn-ghost:hover{background:#f0f5fa}\n.btn[disabled]{opacity:.45;cursor:not-allowed}\n.btn-sm{padding:7px 14px;font-size:.85rem;border-radius:8px}\n/* Wizard */\n#progressBarOuter{background:var(--line);border-radius:99px;height:10px;overflow:hidden;margin:10px 0 4px}\n#progressBarInner{background:linear-gradient(90deg,var(--accent),var(--brand-2));height:100%;width:0%;transition:width .3s;border-radius:99px}\n.progress-meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--ink-soft)}\n.stepchips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 2px}\n.stepchip{font-size:.72rem;padding:3px 10px;border-radius:99px;background:#eef2f7;color:var(--ink-soft);border:1px solid var(--line)}\n.stepchip.active{background:var(--brand);color:#fff;border-color:var(--brand)}\n.stepchip.done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}\n.q{margin:20px 0;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}\n.q label.qlabel{display:block;font-weight:600;margin-bottom:4px}\n.q .qhelp{font-size:.84rem;color:var(--ink-soft);margin-bottom:10px}\n.q.q-missing{border-color:var(--bad);background:var(--bad-bg)}\n.opts{display:flex;flex-direction:column;gap:8px}\n.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;transition:border-color .12s,background .12s;font-size:.95rem}\n.opt:hover{border-color:var(--brand-2)}\n.opt.checked{border-color:var(--brand);background:#eef5fb;font-weight:600}\n.opt input{accent-color:var(--brand);width:18px;height:18px;flex-shrink:0}\nselect.fsel{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:.95rem;background:#fff;font-family:inherit;color:var(--ink)}\n.precise{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.precise input{padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;width:160px;font-size:.92rem;font-family:inherit}\n.precise span{font-size:.8rem;color:var(--ink-soft)}\n.wiznav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}\n/* Semafori */\n.light{display:inline-block;width:14px;height:14px;border-radius:50%;flex-shrink:0}\n.light.g{background:var(--ok);box-shadow:0 0 0 4px var(--ok-bg)}\n.light.y{background:var(--warn);box-shadow:0 0 0 4px var(--warn-bg)}\n.light.r{background:var(--bad);box-shadow:0 0 0 4px var(--bad-bg)}\n.lights-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:12px}\n.light-card{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}\n.light-card b{display:block;font-size:.92rem}\n.light-card p{font-size:.82rem;color:var(--ink-soft);margin-top:2px}\n.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.75rem;font-weight:700}\n.pill.g{background:var(--ok-bg);color:var(--ok)}\n.pill.y{background:var(--warn-bg);color:#9a6d00}\n.pill.r{background:var(--bad-bg);color:var(--bad)}\n/* KPI e tabelle */\n.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}\n.kpi{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:12px}\n.kpi .v{font-size:1.15rem;font-weight:700;color:var(--brand)}\n.kpi .l{font-size:.76rem;color:var(--ink-soft);margin-top:2px}\ntable.t{width:100%;border-collapse:collapse;margin:10px 0;font-size:.9rem}\ntable.t th{text-align:left;background:#eef2f7;padding:8px 10px;font-size:.8rem;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft)}\ntable.t td{padding:8px 10px;border-bottom:1px solid var(--line)}\ntable.t tr:last-child td{border-bottom:none}\ntable.t td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}\n.trow-tot td{font-weight:700;background:#f7f9fc}\n/* Simulatore */\n.sim-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:14px 0}\n.sim-ctl{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:14px}\n.sim-ctl label{font-size:.85rem;font-weight:600;display:flex;justify-content:space-between;margin-bottom:8px}\n.sim-ctl label output{color:var(--brand);font-weight:700}\ninput[type=range]{width:100%;accent-color:var(--brand);height:26px}\n.sim-note{font-size:.8rem;color:var(--ink-soft);margin-top:4px}\n/* Allocazioni */\n.alloc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:12px}\n.alloc-card{border:1.5px solid var(--line);border-radius:12px;padding:16px;background:#fff}\n.alloc-card.suggested{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,138,109,.12)}\n.alloc-card h4{font-size:.98rem;margin-bottom:2px}\n.alloc-card .tag{font-size:.72rem;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.5px}\n.alloc-row{display:flex;justify-content:space-between;font-size:.85rem;padding:5px 0;border-bottom:1px dashed var(--line)}\n.alloc-row:last-child{border-bottom:none}\n.alloc-row b{font-variant-numeric:tabular-nums}\n/* Report semplice */\n.simple-block{border-left:4px solid var(--brand-2);background:#f7fafd;border-radius:0 10px 10px 0;padding:12px 16px;margin:10px 0}\n.simple-block h4{font-size:.95rem;margin-bottom:4px;color:var(--brand)}\n.simple-block p, .simple-block li{font-size:.92rem}\n/* Tips */\n.tip{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;background:#fff}\n.tip b{font-size:.92rem}\n.tip p{font-size:.87rem;margin-top:3px}\n.tip .src{font-size:.76rem;color:var(--ink-soft);font-style:italic;margin-top:5px}\n/* Riepilogo */\n.rec-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}\n.rec-row:last-child{border-bottom:none}\n.rec-row .rl{color:var(--ink-soft)}\n.rec-row .rv{font-weight:600;text-align:right}\n.rec-row a{color:var(--brand-2);font-size:.78rem;margin-left:8px;cursor:pointer;text-decoration:underline}\n/* Grafici */\n.chart-box{margin:14px 0;overflow-x:auto}\n.chart-box svg{max-width:100%;height:auto;display:block;margin:0 auto}\n.chart-title{font-size:.88rem;font-weight:700;color:var(--ink-soft);margin:14px 0 4px;text-transform:uppercase;letter-spacing:.4px}\n.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--ink-soft);margin-top:6px;justify-content:center}\n.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}\n/* Alert */\n.alert{border-radius:10px;padding:12px 14px;margin:10px 0;font-size:.9rem;display:flex;gap:10px;align-items:flex-start}\n.alert.warn{background:var(--warn-bg);border:1px solid #ecd08e;color:#7a5800}\n.alert.bad{background:var(--bad-bg);border:1px solid #efb6b6;color:#8f2626}\n.alert.ok{background:var(--ok-bg);border:1px solid #a9dcbd;color:#1d6b3d}\n.alert.info{background:#e8f1fa;border:1px solid #bcd6ec;color:#274e6e}\n/* Nav risultati */\n.resnav{position:sticky;top:0;z-index:20;background:rgba(244,246,249,.95);backdrop-filter:blur(4px);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}\n.resnav a{font-size:.78rem;padding:6px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--ink-soft);text-decoration:none;font-weight:600}\n.resnav a:hover{border-color:var(--brand);color:var(--brand)}\nfooter.site{padding:26px 16px 40px;color:var(--ink-soft);font-size:.8rem;text-align:center}\n/* ============ Gamification (facoltativa) ============ */\n.game-box{display:flex;gap:12px;align-items:flex-start;background:#f2f7f4;border:1.5px dashed var(--accent);border-radius:12px;padding:14px;margin-top:16px}\n.game-box p{font-size:.88rem}\n.gswitch{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0}\n.gswitch input{opacity:0;width:0;height:0}\n.gslider{position:absolute;cursor:pointer;inset:0;background:#c4ccd6;border-radius:99px;transition:.2s}\n.gslider:before{content:\"\";position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}\n.gswitch input:checked + .gslider{background:var(--accent)}\n.gswitch input:checked + .gslider:before{transform:translateX(20px)}\n#xpWrap{margin:10px 0 2px}\n#xpBarOuter{background:var(--line);border-radius:99px;height:8px;overflow:hidden}\n#xpBar{background:linear-gradient(90deg,#e6a817,#0e8a6d);height:100%;width:0%;transition:width .4s;border-radius:99px}\n.xp-label{display:flex;justify-content:space-between;font-size:.76rem;color:var(--ink-soft);margin-top:3px}\n.xp-label b{color:var(--accent)}\n.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px}\n.badge-card{border:1.5px solid var(--accent);border-radius:12px;padding:14px;background:#f4faf7;text-align:center}\n.badge-card .bic{font-size:1.9rem}\n.badge-card b{display:block;font-size:.9rem;margin:4px 0 2px}\n.badge-card p{font-size:.76rem;color:var(--ink-soft)}\n.badge-card.locked{border-color:var(--line);background:#f7f8fa;filter:grayscale(1);opacity:.65}\n.badge-card.locked .bic{opacity:.5}\n.mission{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:12px 14px;margin:10px 0;background:#fff}\n.mission .mic{font-size:1.4rem}\n.mission b{font-size:.92rem}\n.mission p{font-size:.84rem;color:var(--ink-soft);margin-top:2px}\n.mission .mpts{margin-left:auto;flex-shrink:0;background:var(--warn-bg);color:#9a6d00;border-radius:99px;padding:3px 10px;font-size:.75rem;font-weight:700;white-space:nowrap}\n.toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}\n.toast{background:var(--ink);color:#fff;padding:9px 18px;border-radius:99px;font-size:.85rem;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:toastIn .25s ease-out, toastOut .4s ease-in 2.4s forwards}\n@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\n@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}\n.confetti{position:fixed;top:-14px;width:9px;height:14px;z-index:98;pointer-events:none;border-radius:2px;animation:confFall linear forwards}\n@keyframes confFall{to{transform:translateY(105vh) rotate(720deg)}}\n@media print{.toast-wrap,.confetti{display:none!important}}\n@media (max-width:640px){\n  body{font-size:15px}\n  .card{padding:16px}\n  header.site h1{font-size:1.3rem}\n  .wiznav{flex-direction:column-reverse}\n  .wiznav .btn{width:100%}\n}\n@media print{\n  header.site,.resnav,.wiznav,.btn,#simControls{display:none!important}\n  body{background:#fff}\n  .card{box-shadow:none;border-color:#ccc;break-inside:avoid}\n}\n\n/* ---- adattamento Bussola: stessa grafica dell'app (colori, carattere, misure) ---- */\n:root{ --brand:#294d95; --brand-2:#23507d; --accent:#1f7a4d; --ok:#1f7a4d; --ok-bg:#e5f3ec; --warn:#9a5b00; --warn-bg:#fdf1dc;\n  --bad:#a3272b; --bad-bg:#fbe6e6; --bg:#f4f7fa; --card:#fff; --line:#d9e2ef; --ink:#282828; --ink-soft:#5b6573;\n  --radius:14px; --shadow:none;\n  --font:\"Poppins\",-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif; }\nhtml{font-size:17px} body{font-size:1rem;line-height:1.45;background:var(--bg)}\nheader.site{display:none}\n.wrap{max-width:none;padding:0 0 8px}\n.card{border:1px solid var(--line);border-radius:14px;box-shadow:none;padding:18px 16px;margin:0 0 12px}\n.card h2{font-size:1.3rem;font-weight:700;color:var(--ink);margin-bottom:8px}\n.card h3{font-size:1.05rem;color:var(--ink)}\n.muted{font-size:.9rem}\n.btn{min-height:52px;border-radius:12px;padding:0 20px;font-size:1rem;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}\n.btn-primary{background:var(--brand)} .btn-primary:hover{filter:none;background:var(--brand-2)}\n.btn-ghost{border:1px solid var(--line);color:var(--ink);background:#fff}\n.btn-sm{min-height:40px;padding:0 12px;font-size:.85rem}\n.wiznav{margin-top:16px} .wiznav .btn{flex:1}\n#progressBarOuter{height:6px;background:var(--line)} #progressBarInner{background:var(--accent)}\n.progress-meta{font-size:.85rem}\n.stepchips{gap:6px} .stepchip{font-size:.8rem;padding:5px 12px;background:#fff}\n.stepchip.active{background:var(--brand)} .stepchip.done{background:var(--ok-bg)}\n.q{margin:0 0 12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}\n.q label.qlabel{font-size:1rem;font-weight:600;margin-bottom:8px}\n.q .qhelp{font-size:.85rem}\n.opts{gap:8px}\n.opt{min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fbfcfd;font-size:.95rem;font-weight:500}\n.opt:hover{border-color:var(--brand)}\n.opt.checked{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}\n.opt.checked input{accent-color:#fff}\nselect.fsel,.precise input{min-height:50px;border:1px solid var(--line);border-radius:10px;font-size:1rem;background:#fbfcfd}\n.precise input{width:200px}\n.kpi{background:#fff;border-radius:14px} .kpi .v{font-size:1.25rem}\n.light-card,.alloc-card,.tip,.badge-card,.mission{border-radius:14px}\n.alert{border-radius:10px}\n.resnav{background:rgba(244,247,250,.97)}\n.resnav a{font-size:.85rem;padding:8px 14px}\n#xpBar{background:var(--accent)}\nfooter.site{display:none}\n@media (min-width:900px){ html{font-size:16px} .card{padding:22px 24px} .opts{display:grid;grid-template-columns:1fr 1fr} }\n</style>\n<link href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n</head>\n<body>\n\n<header class=\"site\">\n  <div class=\"wrap\">\n    <span class=\"badge\">Strumento educativo · v1.0 · Lloyd Varesino</span>\n    <h1>🏛️ Mini Family Office personale</h1>\n    <p>Una prima analisi guidata di patrimonio, cash flow, rischio, debiti e protezioni — con report semplificato e avanzato. Non è consulenza finanziaria: è un punto di partenza per capire dove sei.</p>\n  </div>\n</header>\n\n<div class=\"wrap\">\n\n  <\!-- ============ 1. INTRODUZIONE E DISCLAIMER ============ -->\n  <section id=\"intro\" class=\"card\">\n    <\!-- Avviso mostrato solo se il JavaScript risulta bloccato (es. anteprima Quick Look su iPhone) -->\n    <div id=\"jsWarn\" class=\"alert bad\">⚠️ <div><b>JavaScript non attivo: l'app non può funzionare in questa modalità.</b><br>\n    Su iPhone/iPad l'anteprima dell'app File blocca il codice. Soluzioni: apri il file con un'app gratuita come <b>Documents (Readdle)</b>, oppure pubblica la pagina online (es. Netlify Drop, GitHub Pages) e aprila in <b>Safari</b>. Su computer basta il doppio clic.</div></div>\n    <h2>Come funziona</h2>\n    <p>Si parte da una <b>pagina di orientamento</b> (età, orizzonte, obiettivo, coppia, livello di approfondimento) che dimensiona il resto del questionario su tre percorsi: <b>Light</b> (~15 domande, analisi più imprecisa), <b>Standard</b> (~25–30) o <b>Approfondito</b> (fino a ~38, <b>consigliato</b>: include fiscalità, fase di utilizzo del capitale e analisi di coppia più ricca). Al termine otterrai:</p>\n    <ul class=\"clean\">\n      <li>una <b>fotografia del tuo patrimonio</b> e del tuo equilibrio finanziario;</li>\n      <li>una <b>valutazione a semaforo</b> delle aree chiave (liquidità, debiti, protezioni, rischio…);</li>\n      <li>un <b>report semplificato</b> in linguaggio chiaro e un <b>report avanzato</b> con tabelle, indicatori e grafici;</li>\n      <li>un <b>simulatore prudente</b> per esplorare l'effetto di risparmio, orizzonte e allocazione;</li>\n      <li><b>3 proposte di allocazione indicative</b> coerenti con il tuo profilo;</li>\n      <li>principi guida ispirati alla letteratura finanziaria.</li>\n    </ul>\n    <h3>⚠️ Disclaimer</h3>\n    <p class=\"muted\">Questo strumento è <b>educativo e orientativo</b>. Non costituisce consulenza finanziaria, assicurativa, fiscale o legale personalizzata. Le simulazioni si basano su ipotesi semplificate e rendimenti attesi prudenti: <b>non sono previsioni né garanzia di risultati futuri</b>. Per qualsiasi decisione reale confrontati con consulenti abilitati (consulente finanziario, intermediario assicurativo, commercialista, avvocato).</p>\n    <h3>🔒 Privacy</h3>\n    <p class=\"muted\">Tutti i calcoli avvengono <b>localmente nel tuo browser</b>. I calcoli avvengono sul dispositivo. Le risposte arrivano all'agenzia solo alla fine, se il cliente chiede di essere ricontattato. La pagina funziona anche offline.</p>\n    <div class=\"game-box\">\n      <label class=\"gswitch\"><input type=\"checkbox\" id=\"gameToggle\" checked><span class=\"gslider\"></span></label>\n      <p><b>🎮 Modalità gioco (facoltativa)</b><br>Guadagna punti rispondendo, sblocca trofei legati alla tua reale salute finanziaria e ricevi missioni concrete su cui lavorare. È solo un modo più coinvolgente di fare la stessa identica analisi: puoi disattivarla quando vuoi e i risultati non cambiano.</p>\n    </div>\n    <div style=\"margin-top:18px\">\n      <button class=\"btn btn-primary\" data-action=\"start\">Inizia l'analisi →</button>\n    </div>\n  </section>\n\n  <\!-- ============ 2. QUESTIONARIO (wizard) ============ -->\n  <section id=\"wizard\" class=\"card\" hidden>\n    <div class=\"progress-meta\"><span id=\"stepTitle\"></span><span id=\"qCounter\"></span></div>\n    <div id=\"progressBarOuter\"><div id=\"progressBarInner\"></div></div>\n    <div id=\"xpWrap\" hidden>\n      <div id=\"xpBarOuter\"><div id=\"xpBar\"></div></div>\n      <div class=\"xp-label\"><b id=\"xpLevel\"></b><span id=\"xpPts\"></span></div>\n    </div>\n    <div class=\"stepchips\" id=\"stepChips\"></div>\n    <div id=\"stepBody\"></div>\n    <div class=\"wiznav\">\n      <button class=\"btn btn-ghost\" id=\"btnPrev\" data-action=\"prev\">← Indietro</button>\n      <button class=\"btn btn-primary\" id=\"btnNext\" data-action=\"next\">Avanti →</button>\n    </div>\n  </section>\n\n  <\!-- ============ 3–11. RISULTATI ============ -->\n  <section id=\"results\" hidden>\n    <nav class=\"resnav\">\n      <a href=\"#secLights\">Semafori</a>\n      <a href=\"#secBadges\">Trofei</a>\n      <a href=\"#secMissions\">Missioni</a>\n      <a href=\"#secSimple\">Report semplice</a>\n      <a href=\"#secSim\">Simulatore</a>\n      <a href=\"#secAlloc\">Allocazioni</a>\n      <a href=\"#secAdv\">Report avanzato</a>\n      <a href=\"#secTips\">Principi guida</a>\n      <a href=\"#secLimits\">Limiti</a>\n    </nav>\n    <div id=\"resultsBody\"></div>\n    <div class=\"card\" style=\"text-align:center\">\n      <button class=\"btn btn-ghost\" data-action=\"print\">🖨️ Stampa / salva PDF</button>\n      <button class=\"btn btn-ghost\" id=\"btnRestart\" data-action=\"restart\">↺ Ricomincia</button>\n    </div>\n  </section>\n\n</div>\n\n<footer class=\"site\">\n  Mini Family Office · strumento educativo · i dati restano sul dispositivo fino all'invio all'agenzia · non è consulenza personalizzata.\n</footer>\n\n<script>\n\"use strict\";\n/* ============================================================\n   CONFIGURAZIONE QUESTIONARIO\n   30 domande in 8 step + riepilogo + risultati.\n   Ogni opzione ha \"mid\" = valore centrale usato nei calcoli.\n   ============================================================ */\n\n// FLUSSO ADATTIVO SU 4 PAGINE + riepilogo + risultati.\n// La PRIMA PAGINA contiene solo le domande di indirizzamento (età, orizzonte,\n// obiettivo, inclusione del partner, livello di approfondimento) che decidono\n// quali domande verranno poste nelle pagine successive:\n//   - Light:        ~15 domande (analisi più imprecisa, basata su stime)\n//   - Standard:     ~25–30 domande\n//   - Approfondito: fino a ~38 domande (CONSIGLIATO: fotografia più accurata)\nconst STEPS = [\n  {id:'p0', title:'1 · Per iniziare', sections:['iniziali']},\n  {id:'p1', title:'2 · Persona, famiglia e reddito', sections:['personali','famiglia','reddito']},\n  {id:'p2', title:'3 · Patrimonio, impegni e obiettivi', sections:['patrimonio','debiti','obiettivi','decumulo']},\n  {id:'p3', title:'4 · Rischio e protezioni', sections:['rischio','assicurazioni']},\n  {id:'riepilogo', title:'5 · Riepilogo', sections:[]},\n  {id:'risultati', title:'6 · Risultati', sections:[]}\n];\nconst SECTION_TITLES = {\n  iniziali:'🚀 Per iniziare', personali:'👤 Dati personali', famiglia:'👨‍👩‍👧 Famiglia e coppia', reddito:'💶 Reddito e spese',\n  patrimonio:'🏦 Patrimonio', debiti:'📉 Impegni finanziari', obiettivi:'🎯 Obiettivi',\n  decumulo:'🌅 Fase di utilizzo del capitale', rischio:'⚖️ Rischio e investimenti', assicurazioni:'🛡️ Coperture assicurative'\n};\n\n// --- Livello di approfondimento (1=Light, 2=Standard, 3=Approfondito) ---\n// Finché l'utente non sceglie, si assume il percorso consigliato (Approfondito).\nfunction tier(){\n  if (A.approfondimento === 'light') return 1;\n  if (A.approfondimento === 'standard') return 2;\n  return 3;\n}\nfunction tierName(){ return ['', 'Light', 'Standard', 'Approfondito'][tier()]; }\nfunction T2(){ return tier() >= 2; }\nfunction T3(){ return tier() >= 3; }\nfunction deepMode(){ return tier() >= 2; } // dati di dettaglio disponibili (Standard/Approfondito)\nfunction isFI(){ return A.obiettivo === 'rendita' || A.obiettivo === 'pensione'; }\nfunction hasPartner(){ return A.includiPartner === 'si' || A.includiPartner === 'solo_io'; }\nfunction coupleMode(){ return A.includiPartner === 'si'; }\n\nconst QUESTIONS = [\n// ---------- SEZIONE INIZIALE: guida l'intero percorso ----------\n{id:'eta', step:'iniziali', type:'radio', label:'Qual è la tua età?', options:[\n  {v:'u30', l:'Meno di 30 anni', mid:27},{v:'30_39', l:'30–39 anni', mid:35},\n  {v:'40_49', l:'40–49 anni', mid:45},{v:'50_59', l:'50–59 anni', mid:55},\n  {v:'60_69', l:'60–69 anni', mid:65},{v:'70p', l:'70 anni o più', mid:75}]},\n{id:'orizzonte', step:'iniziali', type:'radio', label:'Su quale orizzonte temporale vuoi pianificare?',\n help:'Quanto tempo hai davanti prima di usare la maggior parte del capitale che accumuli.', options:[\n  {v:'breve', l:'Meno di 5 anni', mid:4},{v:'medio', l:'5–10 anni', mid:7},\n  {v:'lungo', l:'10–20 anni', mid:15},{v:'moltolungo', l:'Oltre 20 anni', mid:25}]},\n{id:'obiettivo', step:'iniziali', type:'select', label:'Qual è il tuo obiettivo finanziario principale?', options:[\n  {v:'emergenza', l:'Costruire un fondo di emergenza'},\n  {v:'casa', l:'Acquistare o cambiare casa'},\n  {v:'figli', l:'Educazione / futuro dei figli'},\n  {v:'pensione', l:'Integrazione pensionistica'},\n  {v:'crescita', l:'Far crescere il patrimonio'},\n  {v:'rendita', l:'Rendita / indipendenza finanziaria'},\n  {v:'protezione', l:'Proteggere la famiglia'}]},\n{id:'includiPartner', step:'iniziali', type:'radio', label:'Vuoi includere il tuo coniuge/partner nell’analisi?',\n help:'Includendo il partner valuteremo anche quanto reddito porta ciascuno di voi e gli eventuali rischi per il patrimonio familiare legati alla sua attività professionale.', options:[\n  {v:'si', l:'Sì: analisi di coppia (consigliato se convivete)'},\n  {v:'solo_io', l:'Ho un partner, ma analizzate solo me'},\n  {v:'no_partner', l:'Non ho un coniuge/partner'}]},\n{id:'approfondimento', step:'iniziali', type:'radio', label:'Quanto vuoi approfondire l’analisi?',\n help:'Consigliamo il percorso Approfondito: più domande ma fotografia molto più accurata. ⚠️ Attenzione: con il percorso Light l’analisi sarà più imprecisa, perché molti dati verranno stimati con ipotesi standard.', options:[\n  {v:'approfondito', l:'Approfondito: analisi dettagliata, fino a ~38 domande (consigliato)'},\n  {v:'standard', l:'Standard: buon equilibrio tra dettaglio e velocità (~25–30 domande)'},\n  {v:'light', l:'Light: solo l’essenziale, ~15 domande (analisi più imprecisa)'}]},\n\n// ---------- SEZIONE: DATI PERSONALI ----------\n{id:'residenza', step:'personali', type:'select', label:'Dove vivi?', visibleIf: T3, options:[\n  {v:'nord', l:'Nord Italia'},{v:'centro', l:'Centro Italia'},\n  {v:'sud', l:'Sud Italia e Isole'},{v:'estero', l:'Estero'}]},\n\n// ---------- SEZIONE: FAMIGLIA E COPPIA ----------\n{id:'dipendenti', step:'famiglia', type:'radio', label:'Quante persone dipendono economicamente da te (figli o altri)?', options:[\n  {v:'0', l:'Nessuna', mid:0},{v:'1', l:'1 persona', mid:1},\n  {v:'2', l:'2 persone', mid:2},{v:'3p', l:'3 o più persone', mid:3}]},\n{id:'quotaReddito', step:'famiglia', type:'radio', label:'Come si divide il reddito familiare tra te e il tuo partner?',\n visibleIf: coupleMode, options:[\n  {v:'solo_io', l:'Praticamente solo io', share:1.0},\n  {v:'prev_io', l:'Prevalentemente io (circa 70/30)', share:0.7},\n  {v:'meta', l:'Circa metà ciascuno', share:0.5},\n  {v:'prev_partner', l:'Prevalentemente il partner (circa 30/70)', share:0.3},\n  {v:'solo_partner', l:'Praticamente solo il partner', share:0.0}]},\n{id:'responsabilita', step:'famiglia', type:'multi', label:'Ricopri ruoli con responsabilità patrimoniali personali particolari?',\n visibleIf: function(){ return T2() || coupleMode(); },\n help:'Alcuni ruoli espongono il patrimonio personale a rischi specifici. Seleziona tutto ciò che ti riguarda.', options:[\n  {v:'albo', l:'Professionista iscritto ad albo (medico, avvocato, ingegnere…)'},\n  {v:'amministratore', l:'Amministratore di società'},\n  {v:'sindaco', l:'Sindaco o revisore di società'},\n  {v:'snc', l:'Socio di SNC'},\n  {v:'sas', l:'Socio accomandatario di SAS'},\n  {v:'altro', l:'Altro ruolo con responsabilità personale'},\n  {v:'nessuna', l:'Nessuno esa mensile media della famiglia (tutto incluso, comprese le rate)', precise:true, unit:'€/mese', options:[\n  {v:'s1', l:'Meno di 1.000 €', mid:800},{v:'s2', l:'1.000–1.500 €', mid:1250},\n  {v:'s3', l:'1.500–2.500 €', mid:2000},{v:'s4', l:'2.500–4.000 €', mid:3200},\n  {v:'s5', l:'Oltre 4.000 €', mid:5000}]},\n{id:'risparmioMensile', step:'reddito', type:'radio', label:'Quanto riesci a risparmiare in media ogni mese?', precise:true, unit:'€/mese', options:[\n  {v:'0', l:'Nulla o quasi', mid:0},{v:'a', l:'Meno di 100 €', mid:50},\n  {v:'b', l:'100–250 €', mid:175},{v:'c', l:'250–500 €', mid:375},\n  {v:'d', l:'500–1.000 €', mid:750},{v:'e', l:'Oltre 1.000 €', mid:1500}]},\n{id:'fondoEmergenza', step:'reddito', type:'radio', label:'Hai un fondo di emergenza dedicato?', visibleIf: T2,\n help:'Denaro accantonato e subito disponibile per imprevisti, separato dagli investimenti.', options:[\n  {v:'no', l:'No, non ho riserve dedicate'},\n  {v:'liquidita', l:'Uso la liquidità generica sul conto'},\n  {v:'lt3', l:'Sì, copre meno di 3 mesi di spese'},\n  {v:'m3_6', l:'Sì, copre 3–6 mesi di spese'},\n  {v:'gt6', l:'Sì, copre oltre 6 mesi di spese'}]},\n\n// ---------- STEP 4: PATRIMONIO ----------\n{id:'liquidita', step:'patrimonio', type:'radio', label:'Liquidità totale (conti correnti, depositi)', precise:true, unit:'€', options:[\n  {v:'l1', l:'Meno di 5.000 €', mid:2500},{v:'l2', l:'5.000–15.000 €', mid:10000},\n  {v:'l3', l:'15.000–30.000 €', mid:22000},{v:'l4', l:'30.000–60.000 €', mid:45000},\n  {v:'l5', l:'60.000–100.000 €', mid:80000},{v:'l6', l:'Oltre 100.000 €', mid:150000}]},\n{id:'investimenti', step:'patrimonio', type:'radio', label:'Investimenti finanziari (fondi, ETF, azioni, obbligazioni, polizze di investimento)', precise:true, unit:'€', options:[\n  {v:'0', l:'Nessuno', mid:0},{v:'i1', l:'Meno di 10.000 €', mid:5000},\n  {v:'i2', l:'10.000–25.000 €', mid:17500},{v:'i3', l:'25.000–50.000 €', mid:37500},\n  {v:'i4', l:'50.000–100.000 €', mid:75000},{v:'i5', l:'100.000–250.000 €', mid:175000},\n  {v:'i6', l:'Oltre 250.000 €', mid:400000}]},\n{id:'tipoStrumenti', step:'patrimonio', type:'select', label:'Dove sono investiti oggi prevalentemente i tuoi capitali?',\n visibleIf: function(){ return T3() && A.investimenti !== undefined && A.investimenti !== '0'; },\n help:'Serve anche per stimare la fiscalità: i titoli di Stato sono tassati al 12,5%, gli altri strumenti al 26%.', options:[\n  {v:'deposito', l:'Conti deposito / liquidità remunerata'},\n  {v:'titoli_stato', l:'Titoli di Stato / obbligazioni governative'},\n  {v:'fondi', l:'Fondi comuni / ETF diversificati'},\n  {v:'azioni', l:'Azioni singole'},\n  {v:'misto', l:'Un mix di più strumenti'}]},\n{id:'immobili', step:'patrimonio', type:'radio', label:'Valore stimato degli immobili di proprietà (inclusa prima casa)', precise:true, unit:'€', visibleIf: T2, options:[\n  {v:'0', l:'Nessun immobile', mid:0},{v:'m1', l:'Meno di 100.000 €', mid:75000},\n  {v:'m2', l:'100.000–250.000 €', mid:175000},{v:'m3', l:'250.000–500.000 €', mid:350000},\n  {v:'m4', l:'Oltre 500.000 €', mid:700000}]},\n{id:'previdenza', step:'patrimonio', type:'radio', label:'Previdenza integrativa (fondo pensione, PIP)', visibleIf: T2, options:[\n  {v:'0', l:'Non ne ho', mid:0},{v:'p1', l:'Sì, meno di 10.000 € accumulati', mid:5000},\n  {v:'p2', l:'Sì, 10.000–50.000 €', mid:25000},{v:'p3', l:'Sì, oltre 50.000 €', mid:80000}]},\n{id:'contribuzionePrevidenza', step:'patrimonio', type:'radio', label:'Quanto versi oggi alla previdenza integrativa?', visibleIf: T3,\n help:'I versamenti sono deducibili fino a circa 5.164 € l’anno: un vantaggio fiscale immediato.', options:[\n  {v:'0', l:'Nulla', mid:0},{v:'v1', l:'Meno di 100 €/mese', mid:50},\n  {v:'v2', l:'100–300 €/mese', mid:200},{v:'v3', l:'Oltre 300 €/mese', mid:400}]},\n{id:'altriAsset', step:'patrimonio', type:'radio', label:'Altri asset rilevanti (quote societarie, oro, arte, cripto…)', visibleIf: T3, options:[\n  {v:'0', l:'Nessuno', mid:0},{v:'a1', l:'Meno di 25.000 €', mid:12500},\n  {v:'a2', l:'25.000–100.000 €', mid:60000},{v:'a3', l:'Oltre 100.000 €', mid:150000}]},\n\n// ---------- SEZIONE: IMPEGNI FINANZIARI ----------\n// Domanda \"porta\": se l'utente seleziona \"Nessuno\", le altre 4 domande\n// vengono compilate automaticamente come \"nessun impegno\" e nascoste.\n{id:'tipiDebiti', step:'debiti', type:'multi', label:'Quali impegni finanziari hai attualmente?',\n help:'Se non ne hai, seleziona \"Nessuno\": le altre domande su questo tema verranno saltate automaticamente.', options:[\n  {v:'mutuo', l:'Mutuo'},\n  {v:'prestiti', l:'Prestiti personali'},{v:'auto', l:'Finanziamento auto'},\n  {v:'leasing', l:'Leasing'},{v:'revolving', l:'Carte revolving'},\n  {v:'altri', l:'Altri debiti'},{v:'nessuno', l:'Nessuno', exclusive:true}]},\n{id:'mutuo', step:'debiti', type:'radio', label:'Debito residuo del mutuo', precise:true, unit:'€',\n visibleIf: function(){ return T2() && (A.tipiDebiti || []).includes('mutuo'); }, options:[\n  {v:'0', l:'Nessun mutuo', mid:0},{v:'d1', l:'Meno di 50.000 €', mid:30000},\n  {v:'d2', l:'50.000–100.000 €', mid:75000},{v:'d3', l:'100.000–200.000 €', mid:150000},\n  {v:'d4', l:'Oltre 200.000 €', mid:250000}]},\n{id:'altriDebitiTot', step:'debiti', type:'radio', label:'Totale residuo degli altri debiti (esclusi mutui)', precise:true, unit:'€',\n visibleIf: function(){ return T2() && (A.tipiDebiti || []).some(function(v){ return ['prestiti','auto','leasing','revolving','altri'].includes(v); }); }, options:[\n  {v:'0', l:'Nessuno', mid:0},{v:'e1', l:'Meno di 10.000 €', mid:5000},\n  {v:'e2', l:'10.000–30.000 €', mid:20000},{v:'e3', l:'Oltre 30.000 €', mid:45000}]},\n{id:'rataMensile', step:'debiti', type:'radio', label:'Rata mensile totale di tutti gli impegni (mutuo + prestiti + leasing…)', precise:true, unit:'€/mese',\n visibleIf: function(){ const td = A.tipiDebiti || []; return td.length > 0 && !td.includes('nessuno'); }, options:[\n  {v:'0', l:'Nessuna rata', mid:0},{v:'t1', l:'Meno di 300 €', mid:200},\n  {v:'t2', l:'300–600 €', mid:450},{v:'t3', l:'600–1.000 €', mid:800},\n  {v:'t4', l:'Oltre 1.000 €', mid:1300}]},\n{id:'durataImpegni', step:'debiti', type:'radio', label:'Durata residua dell’impegno più lungo',\n visibleIf: function(){ const td = A.tipiDebiti || []; return T2() && td.length > 0 && !td.includes('nessuno'); }, options:[\n  {v:'0', l:'Nessun impegno', mid:0},{v:'u5', l:'Meno di 5 anni', mid:3},\n  {v:'a5_10', l:'5–10 anni', mid:7},{v:'a10_20', l:'10–20 anni', mid:15},\n  {v:'o20', l:'Oltre 20 anni', mid:25}]},\n\n// ---------- SEZIONE: OBIETTIVI (dettaglio solo percorso completo) ----------\n// L'obiettivo principale è chiesto nella sezione iniziale. Nel percorso\n// essenziale il capitale target viene stimato con default prudenti dichiarati.\n{id:'capitaleObiettivo', step:'obiettivi', type:'radio', label:'Quale capitale vorresti raggiungere per questo obiettivo (a fine piano)?', precise:true, unit:'€',\n visibleIf: function(){ return T2() && !isFI(); }, options:[\n  {v:'c1', l:'Meno di 25.000 €', mid:20000},{v:'c2', l:'25.000–50.000 €', mid:37500},\n  {v:'c3', l:'50.000–100.000 €', mid:75000},{v:'c4', l:'100.000–250.000 €', mid:175000},\n  {v:'c5', l:'250.000–500.000 €', mid:375000},{v:'c6', l:'Oltre 500.000 €', mid:650000}]},\n\n// ---------- SEZIONE: DECUMULO (percorso completo, obiettivi pensione/indipendenza) ----------\n{id:'etaObiettivo', step:'decumulo', type:'radio', label:'A che età vorresti iniziare a vivere (anche in parte) del tuo capitale?',\n visibleIf: function(){ return T2() && isFI(); }, options:[\n  {v:'u50', l:'Prima dei 50 anni', mid:48},{v:'50_55', l:'50–55 anni', mid:53},\n  {v:'55_60', l:'55–60 anni', mid:58},{v:'60_67', l:'60–67 anni', mid:64},\n  {v:'67p', l:'Dopo i 67 anni', mid:68}]},\n{id:'speseTarget', step:'decumulo', type:'radio', label:'Che tenore di vita mensile vorresti in quella fase (in euro di oggi)?', precise:true, unit:'€/mese',\n visibleIf: function(){ return T2() && isFI(); }, options:[\n  {v:'st1', l:'Meno di 1.500 €', mid:1200},{v:'st2', l:'1.500–2.500 €', mid:2000},\n  {v:'st3', l:'2.500–4.000 €', mid:3200},{v:'st4', l:'Oltre 4.000 €', mid:5000}]},\n{id:'altreEntrateFuture', step:'decumulo', type:'radio', label:'Su quali altre entrate mensili potrai contare in quella fase (pensione pubblica, affitti…)?', precise:true, unit:'€/mese',\n visibleIf: function(){ return T2() && isFI(); },\n help:'Il capitale necessario copre solo la differenza tra il tenore di vita desiderato e queste entrate.', options:[\n  {v:'0', l:'Nessuna o quasi', mid:0},{v:'ae1', l:'Meno di 500 €', mid:300},\n  {v:'ae2', l:'500–1.000 €', mid:750},{v:'ae3', l:'1.000–2.000 €', mid:1500},\n  {v:'ae4', l:'Oltre 2.000 €', mid:2500}]},\n\n// ---------- SEZIONE: RISCHIO ----------\n{id:'conoscenza', step:'rischio', type:'radio', label:'Come valuti la tua conoscenza finanziaria?', visibleIf: T2, options:[\n  {v:'base', l:'Base: conosco conti e depositi', score:0},\n  {v:'media', l:'Media: so cosa sono fondi e obbligazioni', score:1},\n  {v:'buona', l:'Buona: conosco ETF, azioni e diversificazione', score:2},\n  {v:'avanzata', l:'Avanzata: valuto rischio, costi e asset allocation', score:3}]},\n{id:'esperienza', step:'rischio', type:'radio', label:'Che esperienza di investimento hai?', visibleIf: T2, options:[\n  {v:'nessuna', l:'Nessuna', score:0},\n  {v:'depositi', l:'Solo depositi, buoni o obbligazioni', score:1},\n  {v:'fondi', l:'Fondi comuni o ETF', score:2},\n  {v:'azioni', l:'Azioni singole o strumenti complessi', score:3}]},\n{id:'reazione', step:'rischio', type:'radio', label:'Il tuo portafoglio perde il 20% in pochi mesi. Cosa fai?', options:[\n  {v:'vendo_tutto', l:'Vendo tutto per evitare altre perdite', score:0},\n  {v:'vendo_parte', l:'Vendo una parte', score:1},\n  {v:'mantengo', l:'Mantengo le posizioni e aspetto', score:2},\n  {v:'compro', l:'Ne approfitto per investire di più', score:3}]},\n{id:'perditaMax', step:'rischio', type:'radio', label:'Qual è la perdita temporanea massima che potresti tollerare senza vendere?', options:[\n  {v:'p5', l:'Circa 5%', score:0, maxdd:5},\n  {v:'p10', l:'Circa 10%', score:1, maxdd:10},\n  {v:'p20', l:'Circa 20%', score:2, maxdd:20},\n  {v:'p30', l:'30% o più', score:3, maxdd:30}]},\n{id:'priorita', step:'rischio', type:'radio', label:'Tra stabilità e rendimento, cosa conta di più per te?', visibleIf: T3,\n options:[\n  {v:'protezione', l:'Protezione: preferisco stabilità anche con rendimenti bassi', score:0},\n  {v:'equilibrio', l:'Equilibrio: un po’ di crescita accettando oscillazioni moderate', score:1.5},\n  {v:'crescita', l:'Crescita: accetto oscillazioni ampie per rendimenti maggiori', score:3}]},\n\n// ---------- STEP 8: ASSICURAZIONI ----------\n{id:'coperture', step:'assicurazioni', type:'multi', label:'Quali coperture assicurative hai già attive?',\n help:'Considera solo polizze personali/familiari in vigore. Seleziona tutte quelle presenti.', options:[\n  {v:'tcm', l:'Vita caso morte (TCM)'},\n  {v:'invalidita', l:'Invalidità permanente (da malattia o infortunio)'},\n  {v:'infortuni', l:'Infortuni'},\n  {v:'sanitaria', l:'Sanitaria / rimborso spese mediche'},\n  {v:'ltc', l:'LTC / non autosufficienza'},\n  {v:'rc', l:'Responsabilità civile della famiglia'},\n  {v:'abitazione', l:'Abitazione (incendio, danni)'},\n  {v:'tutela', l:'Tutela legale personale/familiare'},\n  {v:'mutuoprot', l:'Protezione mutuo/prestiti (CPI)'},\n  {v:'nessuna', l:'Nessuna copertura', exclusive:true}]}\n];\n\n/* ============================================================\n   STATO E UTILITY\n   ============================================================ */\nlet A = {};              // risposte: A[id] = valore (o array per multi)\nlet currentStep = 0;     // indice in STEPS\n\nconst byId = id => document.getElementById(id);\nconst Q = id => QUESTIONS.find(q => q.id === id);\nconst optOf = (id, v) => { const q = Q(id); return q ? (q.options.find(o => o.v === v) || null) : null; };\n\n// Valore numerico di una risposta: campo preciso (se inserito) o valore centrale del range\nfunction midVal(id){\n  const p = A[id + '_precise'];\n  if (p !== undefined && p !== null && p !== '' && !isNaN(+p) && +p >= 0) return +p;\n  const o = optOf(id, A[id]);\n  return o && typeof o.mid === 'number' ? o.mid : 0;\n}\nfunction scoreVal(id){ const o = optOf(id, A[id]); return o && typeof o.score === 'number' ? o.score : 0; }\nfunction labelOf(id){\n  const q = Q(id); if (!q) return '—';\n  if (q.type === 'multi'){\n    const arr = A[id] || [];\n    if (!arr.length) return '—';\n    return arr.map(v => (optOf(id, v) || {l:v}).l).join(', ');\n  }\n  const o = optOf(id, A[id]);\n  const p = A[id + '_precise'];\n  const hasP = p !== undefined && p !== '' && !isNaN(+p);\n  if (!o) return hasP ? fmtEUR(+p) + ' (valore preciso)' : '—'; // valido anche solo il valore preciso\n  let s = o.l;\n  if (hasP) s += ' (preciso: ' + fmtEUR(+p) + ')';\n  return s;\n}\nfunction fmtEUR(n){\n  if (n === null || n === undefined || isNaN(n)) return '—';\n  return new Intl.NumberFormat('it-IT', {style:'currency', currency:'EUR', maximumFractionDigits:0}).format(n);\n}\nfunction fmtPct(n, dec){ return (isNaN(n) ? '—' : n.toFixed(dec === undefined ? 1 : dec).replace('.', ',') + '%'); }\nfunction esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }\n\n/* ============================================================\n   WIZARD: RENDERING E NAVIGAZIONE\n   ============================================================ */\nfunction startWizard(){\n  byId('intro').hidden = true;\n  byId('wizard').hidden = false;\n  currentStep = 0;\n  renderStep();\n  window.scrollTo(0, 0);\n}\n\n// Una domanda è visibile se non ha condizione o la condizione è vera\nfunction isVisible(q){ return !q.visibleIf || q.visibleIf(); }\nfunction visibleQuestions(){ return QUESTIONS.filter(isVisible); }\n\n// Una domanda è considerata risposta anche se è stato inserito SOLO\n// il valore preciso, senza selezionare un range\nfunction hasPrecise(q){\n  if (!q.precise) return false;\n  const p = A[q.id + '_precise'];\n  return p !== undefined && p !== '' && !isNaN(+p);\n}\nfunction isAnswered(q){\n  if (q.type === 'multi') return !!(A[q.id] && A[q.id].length);\n  if (A[q.id] !== undefined && A[q.id] !== '') return true;\n  return hasPrecise(q);\n}\n\nfunction questionsForStep(stepId){\n  const s = STEPS.find(x => x.id === stepId);\n  if (!s || !s.sections || !s.sections.length) return [];\n  return QUESTIONS.filter(q => s.sections.includes(q.step) && isVisible(q));\n}\nfunction pageOfSection(sec){ return STEPS.findIndex(s => (s.sections || []).includes(sec)); }\nfunction answeredCount(){ return visibleQuestions().filter(isAnswered).length; }\n\nfunction updateCounter(){\n  const tot = visibleQuestions().length, done = answeredCount();\n  const el = byId('qCounter');\n  if (el) el.textContent = done + ' / ' + tot + ' domande · ne mancano ' + Math.max(0, tot - done);\n}\n\n// Auto-compilazione impegni finanziari in base alla domanda \"porta\"\nfunction normalizeDebts(){\n  const td = A.tipiDebiti || [];\n  const none = !td.length || td.includes('nessuno');\n  if (none){\n    A.mutuo = '0'; A.altriDebitiTot = '0'; A.rataMensile = '0'; A.durataImpegni = '0';\n    A.mutuo_precise = ''; A.altriDebitiTot_precise = ''; A.rataMensile_precise = '';\n    A._debtsAuto = true;\n  } else {\n    // se prima era tutto auto-compilato a zero, richiedi di nuovo i dati ora rilevanti\n    if (A._debtsAuto){ A.rataMensile = undefined; A.durataImpegni = undefined; A._debtsAuto = false; }\n    if (!td.includes('mutuo')){ A.mutuo = '0'; A.mutuo_precise = ''; }\n    else if (A.mutuo === '0' && !hasPrecise(Q('mutuo'))){ A.mutuo = undefined; }\n    const others = td.some(v => ['prestiti','auto','leasing','revolving','altri'].includes(v));\n    if (!others){ A.altriDebitiTot = '0'; A.altriDebitiTot_precise = ''; }\n    else if (A.altriDebitiTot === '0' && !hasPrecise(Q('altriDebitiTot'))){ A.altriDebitiTot = undefined; }\n  }\n}\n\n// Corpo di una pagina: sezioni tematiche con intestazione + domande visibili\nfunction renderStepBody(stepId){\n  const s = STEPS.find(x => x.id === stepId);\n  let html = '';\n  (s.sections || []).forEach(sec => {\n    const qs = QUESTIONS.filter(q => q.step === sec && isVisible(q));\n    if (!qs.length) return;\n    html += '<h3 style=\"margin:24px 0 2px;color:var(--brand);border-bottom:2px solid var(--line);padding-bottom:6px\">' +\n      esc(SECTION_TITLES[sec] || sec) + '</h3>' + qs.map(renderQuestion).join('');\n  });\n  // Disclaimer dinamico: percorso Light = analisi più imprecisa\n  if (stepId === 'p0' && A.approfondimento === 'light')\n    html += '<div class=\"alert warn\">⚠️ <div><b>Hai scelto il percorso Light.</b> L’analisi sarà più imprecisa: diversi dati (debiti residui, dettaglio patrimoniale, profilo di rischio) verranno stimati con ipotesi standard invece che con le tue risposte. Per decisioni importanti consigliamo il percorso Approfondito.</div></div>';\n  return html;\n}\n\nfunction renderStep(){\n  const step = STEPS[currentStep];\n  byId('stepTitle').textContent = step.title;\n  updateCounter();\n  updateXPBar();\n  byId('progressBarInner').style.width = Math.round(100 * currentStep / (STEPS.length - 1)) + '%';\n\n  // chips degli step\n  byId('stepChips').innerHTML = STEPS.map((s, i) =>\n    '<span class=\"stepchip ' + (i === currentStep ? 'active' : (i < currentStep ? 'done' : '')) + '\">' + esc(s.title) + '</span>'\n  ).join('');\n\n  const body = byId('stepBody');\n  if (step.id === 'riepilogo'){ body.innerHTML = renderRecap(); }\n  else if (step.id === 'risultati'){ /* gestito da showResults() */ }\n  else { body.innerHTML = renderStepBody(step.id); }\n\n  byId('btnPrev').disabled = currentStep === 0;\n  byId('btnNext').textContent = step.id === 'riepilogo' ? '📊 Genera l’analisi' : 'Avanti →';\n}\n\nfunction renderQuestion(q){\n  // Nessun handler inline: gli eventi sono gestiti tramite delegazione (compatibile iOS/Quick Look)\n  let inner = '';\n  if (q.type === 'select'){\n    inner = '<select class=\"fsel\" data-q=\"' + q.id + '\">' +\n      '<option value=\"\">— Seleziona —</option>' +\n      q.options.map(o => '<option value=\"' + o.v + '\"' + (A[q.id] === o.v ? ' selected' : '') + '>' + esc(o.l) + '</option>').join('') +\n      '</select>';\n  } else if (q.type === 'multi'){\n    const cur = A[q.id] || [];\n    inner = '<div class=\"opts\">' + q.options.map(o =>\n      '<label class=\"opt' + (cur.includes(o.v) ? ' checked' : '') + '\">' +\n      '<input type=\"checkbox\" data-q=\"' + q.id + '\" data-v=\"' + o.v + '\" ' + (cur.includes(o.v) ? 'checked' : '') +\n      '> ' + esc(o.l) + '</label>'\n    ).join('') + '</div>';\n  } else { // radio\n    inner = '<div class=\"opts\">' + q.options.map(o =>\n      '<label class=\"opt' + (A[q.id] === o.v ? ' checked' : '') + '\">' +\n      '<input type=\"radio\" name=\"' + q.id + '\" value=\"' + o.v + '\" data-q=\"' + q.id + '\" ' + (A[q.id] === o.v ? 'checked' : '') +\n      '> ' + esc(o.l) + '</label>'\n    ).join('') + '</div>';\n  }\n  if (q.precise){\n    const pv = A[q.id + '_precise'];\n    inner += '<div class=\"precise\"><input type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\" placeholder=\"Valore preciso (opzionale)\"' +\n      ' value=\"' + (pv !== undefined && pv !== '' ? pv : '') + '\"' +\n      ' data-precise=\"' + q.id + '\"><span>' + esc(q.unit || '€') + ' — se lo inserisci, i calcoli useranno questo valore</span></div>';\n  }\n  return '<div class=\"q\" id=\"q_' + q.id + '\"><label class=\"qlabel\">' + esc(q.label) + '</label>' +\n    (q.help ? '<div class=\"qhelp\">' + esc(q.help) + '</div>' : '') + inner + '</div>';\n}\n\n// --- gestori risposta (richiamati dalla event delegation) ---\nfunction setAnswer(id, v){\n  A[id] = v;\n  award('q_' + id, 10, 'risposta registrata');\n  const pi = pageOfSection(Q(id).step);\n  if (currentStep === pi){ // ridisegna per evidenziare la scelta\n    byId('stepBody').innerHTML = renderStepBody(STEPS[pi].id);\n    updateCounter();\n  }\n}\nfunction setPrecise(id, v){\n  A[id + '_precise'] = v === '' ? '' : Math.max(0, +v);\n  if (v !== '') award('p_' + id, 5, 'valore preciso: analisi più accurata');\n  // il valore preciso rende valida la domanda anche senza range selezionato\n  const el = byId('q_' + id);\n  if (el && v !== '') el.classList.remove('q-missing');\n  updateCounter();\n}\nfunction toggleMulti(id, v, checked){\n  let cur = (A[id] || []).slice();\n  const isExclusive = (optOf(id, v) || {}).exclusive;\n  if (checked){\n    if (isExclusive) cur = [v];\n    else { cur = cur.filter(x => !(optOf(id, x) || {}).exclusive); cur.push(v); }\n  } else cur = cur.filter(x => x !== v);\n  A[id] = cur;\n  if (cur.length) award('q_' + id, 10, 'risposta registrata');\n  if (id === 'tipiDebiti') normalizeDebts(); // auto-compila/azzera le altre domande sui debiti\n  const pi = pageOfSection(Q(id).step);\n  if (currentStep === pi){\n    byId('stepBody').innerHTML = renderStepBody(STEPS[pi].id);\n    updateCounter();\n  }\n}\n\n// --- validazione step corrente (solo domande visibili; il valore preciso vale come risposta) ---\nfunction validateAnswers(stepId){\n  const missing = questionsForStep(stepId).filter(q => !isAnswered(q));\n  missing.forEach(q => { const el = byId('q_' + q.id); if (el) el.classList.add('q-missing'); });\n  if (missing.length){\n    const first = byId('q_' + missing[0].id);\n    if (first && first.scrollIntoView) first.scrollIntoView(true);\n  }\n  return missing.length === 0;\n}\n\nfunction nextStep(){\n  const step = STEPS[currentStep];\n  if (step.id !== 'riepilogo' && step.id !== 'risultati' && !validateAnswers(step.id)) return;\n  if (step.id === 'riepilogo'){ showResults(); return; }\n  if (step.sections && step.sections.length) award('page_' + step.id, 25, '„' + step.title + '” completata!');\n  currentStep = Math.min(currentStep + 1, STEPS.length - 1);\n  renderStep();\n  window.scrollTo(0, 0);\n}\nfunction prevStep(){\n  if (byId('results').hidden === false){ // torna dal report al riepilogo\n    byId('results').hidden = true; byId('wizard').hidden = false;\n    currentStep = STEPS.findIndex(s => s.id === 'riepilogo');\n  } else currentStep = Math.max(currentStep - 1, 0);\n  renderStep();\n  window.scrollTo(0, 0);\n}\nfunction gotoStep(i){ currentStep = i; byId('results').hidden = true; byId('wizard').hidden = false; renderStep(); window.scrollTo(0, 0); }\n// Riavvio con doppio tocco di conferma (niente confirm(): su iOS può essere bloccato)\nlet restartArmed = false;\nfunction restart(){\n  const btn = byId('btnRestart');\n  if (!restartArmed){\n    restartArmed = true;\n    if (btn) btn.textContent = '⚠️ Confermi? Tocca di nuovo per cancellare tutto';\n    setTimeout(() => { restartArmed = false; if (btn) btn.textContent = '↺ Ricomincia'; }, 4000);\n    return;\n  }\n  restartArmed = false;\n  A = {}; GAME.xp = 0; GAME.rewarded = {};\n  byId('results').hidden = true; byId('intro').hidden = false; window.scrollTo(0, 0);\n}\n\n/* ============================================================\n   GAMIFICATION (facoltativa — principi: amplificare motivazioni\n   reali, apprendimento prima di tutto, partecipazione volontaria)\n   Punti e trofei sono legati alla qualità dei dati e alla salute\n   finanziaria effettiva, mai a comportamenti fittizi.\n   ============================================================ */\nconst GAME = { enabled:true, xp:0, rewarded:{} };\nconst LEVELS = [\n  {min:0,   name:'🌱 Apprendista del patrimonio'},\n  {min:100, name:'📘 Pianificatore'},\n  {min:220, name:'🧭 Stratega finanziario'},\n  {min:360, name:'🏛️ CFO di famiglia'}\n];\nfunction gameLevel(){\n  let cur = LEVELS[0], next = null;\n  for (let i = 0; i < LEVELS.length; i++){\n    if (GAME.xp >= LEVELS[i].min) cur = LEVELS[i];\n    else { next = LEVELS[i]; break; }\n  }\n  return { cur, next };\n}\nfunction updateXPBar(){\n  const w = byId('xpWrap'); if (!w) return;\n  w.hidden = !GAME.enabled;\n  if (!GAME.enabled) return;\n  const { cur, next } = gameLevel();\n  const from = cur.min, to = next ? next.min : Math.max(GAME.xp, cur.min + 1);\n  byId('xpBar').style.width = Math.min(100, Math.round(100 * (GAME.xp - from) / Math.max(1, to - from))) + '%';\n  byId('xpLevel').textContent = cur.name;\n  byId('xpPts').textContent = GAME.xp + ' punti' + (next ? ' · prossimo livello a ' + next.min : ' · livello massimo!');\n}\nfunction toast(msg){\n  if (!GAME.enabled) return;\n  let wrap = document.querySelector('.toast-wrap');\n  if (!wrap){ wrap = document.createElement('div'); wrap.className = 'toast-wrap'; document.body.appendChild(wrap); }\n  const t = document.createElement('div');\n  t.className = 'toast'; t.textContent = msg;\n  wrap.appendChild(t);\n  setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 3000);\n}\n// premio una-tantum: ogni chiave viene pagata una sola volta\nfunction award(key, pts, label){\n  if (!GAME.enabled || GAME.rewarded[key]) return;\n  GAME.rewarded[key] = true;\n  GAME.xp += pts;\n  toast('+' + pts + ' punti · ' + label);\n  updateXPBar();\n}\nfunction confettiBurst(){\n  if (!GAME.enabled) return;\n  const colors = ['#1f4e79','#2e7dba','#0e8a6d','#d99a06','#8a5fbf','#d64545'];\n  for (let i = 0; i < 60; i++){\n    const c = document.createElement('span');\n    c.className = 'confetti';\n    c.style.left = Math.random() * 100 + 'vw';\n    c.style.background = colors[i % colors.length];\n    c.style.animationDuration = (2.2 + Math.random() * 2) + 's';\n    c.style.animationDelay = (Math.random() * .6) + 's';\n    document.body.appendChild(c);\n    setTimeout(function(){ if (c.parentNode) c.parentNode.removeChild(c); }, 5200);\n  }\n}\n\n// ---- Trofei: si sbloccano solo con comportamenti finanziari reali ----\nfunction generateBadges(M){\n  const preciseCount = QUESTIONS.filter(q => q.precise && A[q.id + '_precise'] !== undefined && A[q.id + '_precise'] !== '').length;\n  return [\n    {ic:'🛡️', name:'Guardiano', earned:M.ef.months >= 6, how:'Fondo di emergenza da almeno 6 mesi di spese', got:'La tua riserva copre 6+ mesi: le emergenze non ti spaventano.'},\n    {ic:'🐜', name:'Formica d’oro', earned:M.cf.savingsRate >= 0.15, how:'Tasso di risparmio di almeno il 15%', got:'Risparmi almeno il 15% del reddito: la base di ogni patrimonio.'},\n    {ic:'⛓️', name:'Spezza catene', earned:M.nw.totalDebt === 0 || M.debt.rateOnIncome <= 0.2, how:'Nessun debito, o rate sotto il 20% del reddito', got:'I debiti non comandano sul tuo bilancio.'},\n    {ic:'🎯', name:'Rotta tracciata', earned:M.goalGap <= 0, how:'Proiezione che raggiunge il tuo obiettivo', got:'Con le ipotesi prudenti attuali, il tuo obiettivo è a portata.'},\n    {ic:'🧊', name:'Mente fredda', earned:A.reazione === 'mantengo' || A.reazione === 'compro', how:'Disciplina dichiarata nei ribassi di mercato', got:'Nei cali non vendi: è il superpotere dell’investitore.'},\n    {ic:'🔬', name:'Analista', earned:M.tier === 3, how:'Completa il percorso Approfondito', got:'Hai scelto l’analisi più accurata.'},\n    {ic:'📐', name:'Precisione svizzera', earned:preciseCount >= 3, how:'Inserisci almeno 3 valori precisi', got:'Dati precisi = analisi più affidabile.'},\n    {ic:'👫', name:'Gioco di squadra', earned:!!M.couple, how:'Fai l’analisi di coppia', got:'Pianificare in due rende la famiglia più solida.'},\n    {ic:'☂️', name:'Ombrello aperto', earned:M.ins.red === 0 && (A.coperture || []).some(c => c !== 'nessuna'), how:'Nessuna protezione essenziale mancante', got:'I rischi gravi sono coperti: si costruisce solo su fondamenta protette.'}\n  ];\n}\nfunction renderBadges(M){\n  const badges = generateBadges(M);\n  const earned = badges.filter(b => b.earned).length;\n  return '<p class=\"muted small\">Trofei sbloccati: <b>' + earned + ' su ' + badges.length + '</b>. Quelli in grigio ti dicono già su cosa lavorare.</p><div class=\"badge-grid\">' +\n    badges.map(b => '<div class=\"badge-card' + (b.earned ? '' : ' locked') + '\"><div class=\"bic\">' + b.ic + '</div><b>' + esc(b.name) + '</b><p>' + esc(b.earned ? b.got : 'Come sbloccarlo: ' + b.how) + '</p></div>').join('') + '</div>';\n}\n\n// ---- Missioni: sfide concrete generate dalle aree deboli reali ----\nfunction generateMissions(M){\n  const ms = [];\n  if (M.ef.months < 6) ms.push({ic:'🛡️', t:'Missione Scudo', d:'Porta il fondo di emergenza a 6 mesi di spese: mancano circa ' + fmtEUR(M.ef.gap) + '. Versali su un conto separato e non toccarli.', pts:100});\n  if (M.debt.hasRevolving) ms.push({ic:'✂️', t:'Missione Forbici', d:'Estingui le carte revolving: nessun investimento prudente rende quanto costano.', pts:120});\n  if (M.debt.rateOnIncome > 0.35) ms.push({ic:'⚖️', t:'Missione Alleggerimento', d:'Riduci le rate sotto il 35% del reddito: rinegozia, consolida o estingui il debito più caro.', pts:100});\n  if (M.ins.red > 0) ms.push({ic:'☂️', t:'Missione Ombrello', d:'Chiudi le ' + M.ins.red + ' lacune assicurative critiche segnalate: proteggere i rischi gravi viene prima di investire.', pts:100});\n  if (M.cf.savingsRate < 0.15 && M.cf.implicitSavings > 0) ms.push({ic:'🐜', t:'Missione +50', d:'Aumenta il risparmio di 50 €/mese (automatizzalo il giorno dello stipendio) e punta al 15% del reddito.', pts:80});\n  if (M.risk.warnings.length) ms.push({ic:'🧭', t:'Missione Bussola', d:'Chiarisci con un consulente le incoerenze del tuo profilo di rischio prima di cambiare gli investimenti.', pts:60});\n  if (M.tier === 1) ms.push({ic:'🔬', t:'Missione Lente', d:'Rifai l’analisi con il percorso Approfondito per una fotografia molto più accurata.', pts:60});\n  if (!ms.length) ms.push({ic:'🏆', t:'Missione Mantenimento', d:'Le basi sono solide! Rivedi il piano tra 12 mesi o dopo eventi importanti (casa, figli, lavoro) e difendi il tuo indice.', pts:50});\n  return ms;\n}\nfunction renderMissions(M, score){\n  return generateMissions(M).map(m =>\n    '<div class=\"mission\"><span class=\"mic\">' + m.ic + '</span><div><b>' + esc(m.t) + '</b><p>' + esc(m.d) + '</p></div><span class=\"mpts\">+' + m.pts + ' pt</span></div>'\n  ).join('') + '<div class=\"alert info\">🔁 <div><b>Sfida con te stesso:</b> salva il report di oggi (indice ' + score + '/100), completa una missione nella vita reale e rifai l’analisi tra qualche mese. Battere il proprio punteggio è l’unica classifica che conta.</div></div>';\n}\n\n// ---- Indice di salute finanziaria 0–100 (dai semafori) ----\nfunction computeHealthScore(lights){\n  const pts = lights.reduce((s, l) => s + (l.level === 'g' ? 10 : (l.level === 'y' ? 5 : 0)), 0);\n  return Math.round(100 * pts / (lights.length * 10));\n}\n\n// --- riepilogo dati inseriti (collectAnswers) ---\nfunction collectAnswers(){\n  return QUESTIONS.map(q => ({id:q.id, step:q.step, label:q.label, value:labelOf(q.id)}));\n}\nfunction renderRecap(){\n  let html = '<p class=\"muted\">Controlla le risposte. Puoi tornare a qualsiasi pagina per correggerle.</p>';\n  STEPS.slice(0, 4).forEach((s, si) => {\n    html += '<h3 style=\"margin-top:20px;color:var(--brand)\">' + esc(s.title) +\n      ' <a style=\"font-size:.78rem;cursor:pointer;text-decoration:underline;color:var(--brand-2)\" data-goto=\"' + si + '\">modifica</a></h3>';\n    s.sections.forEach(sec => {\n      const qs = QUESTIONS.filter(q => q.step === sec && isVisible(q));\n      if (!qs.length) return;\n      html += '<div class=\"muted small\" style=\"margin-top:10px;font-weight:700\">' + esc(SECTION_TITLES[sec] || sec) + '</div>';\n      html += qs.map(q =>\n        '<div class=\"rec-row\"><span class=\"rl\">' + esc(q.label) + '</span><span class=\"rv\">' + esc(labelOf(q.id)) + '</span></div>'\n      ).join('');\n    });\n  });\n  return html;\n}\n/* ============================================================\n   MOTORE DI CALCOLO\n   Ipotesi dichiarate (nominali, prudenti, al lordo di inflazione):\n   - Conservativo: 2,0% annuo · Bilanciato: 3,2% · Dinamico: 4,5%\n   - Scenario prudente: base −1,5 punti · positivo: base +1,5 punti\n   - Costi/tasse non modellati in dettaglio (v. sezione limiti)\n   ============================================================ */\n\nconst RETURNS = { conservativo:0.020, bilanciato:0.032, dinamico:0.045 };\nconst SCENARIO_DELTA = 0.015;\n\n// ---- Patrimonio ----\nfunction calculateNetWorth(){\n  const liq = midVal('liquidita'), inv = midVal('investimenti'), imm = midVal('immobili'),\n        prev = midVal('previdenza'), altri = midVal('altriAsset');\n  const grossAssets = liq + inv + imm + prev + altri;\n  let mutuo, altriDeb, totalDebt, debtEstimated = false;\n  const td = A.tipiDebiti || [];\n  const hasDebts = td.length > 0 && !td.includes('nessuno');\n  if (deepMode() || !hasDebts){\n    mutuo = midVal('mutuo'); altriDeb = midVal('altriDebitiTot');\n    totalDebt = mutuo + altriDeb;\n  } else {\n    // Percorso essenziale: il debito residuo è stimato dalla rata\n    // (ipotesi dichiarata: durata media residua 5 anni)\n    totalDebt = Math.round(midVal('rataMensile') * 12 * 5);\n    mutuo = td.includes('mutuo') ? Math.round(totalDebt * 0.8) : 0;\n    altriDeb = totalDebt - mutuo;\n    debtEstimated = true;\n  }\n  return { liq, inv, imm, prev, altri, grossAssets, mutuo, altriDeb, totalDebt, debtEstimated, netWorth: grossAssets - totalDebt };\n}\n\n// ---- Fiscalità (stime semplificate, dichiarate nelle assunzioni) ----\n// 26% sui guadagni della maggior parte degli strumenti, 12,5% titoli di Stato,\n// 20% come proxy per portafogli misti. Bollo 0,2% annuo sul conto titoli.\nfunction effTaxRate(){\n  const map = { deposito:0.26, titoli_stato:0.125, fondi:0.26, azioni:0.26, misto:0.20 };\n  return map[A.tipoStrumenti] !== undefined ? map[A.tipoStrumenti] : 0.26;\n}\n\n// ---- Capitale obiettivo: dichiarato, calcolato (indipendenza) o default prudente ----\nfunction computeGoal(cf, investable){\n  if (deepMode() && isFI() && isAnswered(Q('speseTarget'))){\n    // Regola del 4% (25× il fabbisogno) + correzione fiscale sul decumulo:\n    // si assum
